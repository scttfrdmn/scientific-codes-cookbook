[[series]]
id = "launch-bound"
axis = "layout"
held = ["image", "instance", "workers", "size"]
equal_work = "none: -maxh-bounded runs, so each layout runs as many steps as fit in its time limit"
attribution = "same-binary"
verdict = { shape = "flat" }
note = "the re-run: the four layouts fall within 4.4% of each other"

