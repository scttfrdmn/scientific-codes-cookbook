# measurements/gromacs-scaling/record.toml -- GROMACS benchMEM on one Graviton4 node: the 8 -> 192 core
# ladder, five decompositions at 64 cores, the launch cliff at 8, and a size leg. Phase B of the sizing
# work, 2026-09-09, us-east-1. Written from scratch at schema 2.
# Instances: the README says "one c8g box sized to the core count" and each run.log reports
# "Running on 1 node with total N cores", so the c8g size is the one with N vCPUs. The launch section
# names only 8 cores and no log records its box, so its rows are c8g.unrecorded (the session reported
# c8g.2xlarge; kept in each row's note as the session's account). The image is not recorded (image =
# "unrecorded"); the specs were not kept. No row has usd_hr: the README's price is a per-vCPU rate card
# that no artifact carries, and its ns/day per $/hr column is derived from it. Throughput is
# GROMACS' own ns/day from a -maxh-bounded run, not compute cost. No completion records exist.
schema = 2
result_unit = "one simulated nanosecond (benchMEM, 81,743 atoms; benchSMALL, 20,028 atoms, on the size rows)"
throughput_unit = "ns/day"
throughput_is_result = true

[workload]
size = { atoms = 81743 }
note = "benchMEM.tpr, mdrun -maxh-bounded (0.05 h ladder and decomposition, 0.08 h launch, 0.06 h small, 0.2 h benchRIB) with -nsteps 100000000 -pin off"

[timing]
wall = "no wall is recorded: each rung is mdrun's own ns/day over a -maxh-bounded run"

[[series]]
id = "knee"
axis = "workers"
held = ["image", "family", "size", "generation"]
equal_work = "none: -maxh-bounded runs, so each rung runs as many steps as fit in its time limit; the same benchMEM.tpr and mdrun line throughout"
attribution = "same-binary"
attribution_note = "the image digest is not recorded; every run.log reports GROMACS 2026.3-conda_forge, ARM_NEON_ASIMD, CPU part 0xd4f"
# no verdict: the README reads "the cost per nanosecond more than doubles" on a rate card no row carries,
# so no $ curve can confirm it. Throughput rises through 192 (derived).
note = "12.995 -> 147.669 ns/day, 11.4x on 24x the cores; ns/day per $/hr falls 40.7 -> 19.3 at the README's c8g $0.03988/vCPU-hr (a rate card no artifact carries, so no row has usd_hr). 59% step efficiency at 192, where the box spans two NUMA nodes and atoms per rank halve: the measurement cannot separate the two"

[[series]]
id = "small"
axis = "workers"
held = ["image", "family", "size", "generation"]
equal_work = "none: -maxh-bounded runs, so each rung runs as many steps as fit in its time limit; the same benchSMALL.tpr throughout"
attribution = "same-binary"
attribution_note = "the image digest is not recorded; every run.log reports GROMACS 2026.3-conda_forge"
note = "efficiency vs 8 cores falls to 53% at 192"

[[series]]
id = "size-c8"
axis = "size"
size_key = "atoms"
held = ["image", "instance", "workers", "layout"]
equal_work = "none: -maxh-bounded runs on two different systems (benchMEM, benchSMALL)"
attribution = "same-binary"
note = "one column of the README's size table at 8 cores; benchRIB produced no result, so it is not a member"

[[series]]
id = "size-c16"
axis = "size"
size_key = "atoms"
held = ["image", "instance", "workers", "layout"]
equal_work = "none: -maxh-bounded runs on two different systems (benchMEM, benchSMALL)"
attribution = "same-binary"
note = "one column of the README's size table at 16 cores; benchRIB produced no result, so it is not a member"

[[series]]
