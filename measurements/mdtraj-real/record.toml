# measurements/mdtraj-real/record.toml
schema = 1
result_unit = "the whole dataset: all 60 FAST XTCs (120,060 frames) through every analysis and cross-check, plus the DHFR DCD"

[[dataset]]
id = "RODA s3://fah-public-data-covid19-cryptic-pockets/SARS-CoV-2/nsp5_monomer/ FAST_simulations/ (60 XTCs) + input_files/ (5 files)"
tier = "roda"
pins = "inputs.sha256"
note = "Folding@home COVID-19 cryptic pockets, Mpro monomer (Zimmerman et al., Nat. Chem. 13, 651 (2021)); copied server-side, ETags equal the source's"

[[dataset]]
id = "runs/openmm-mdanalysis-real/r1/traj-JAC.dcd + constraints-JAC.npz (100-frame DHFR DCD, 23,558 atoms)"
tier = "run-output"
pins = "inputs.sha256"
from_recipe = "measurements/openmm-mdanalysis-real"
note = "JAC.prmtop from the sibling's pinned Amber20_Benchmark_Suite.tar.gz (same object, also in inputs.sha256)"

