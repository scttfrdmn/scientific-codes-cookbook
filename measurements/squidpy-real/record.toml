# --- across chips and reported (compare.py, ties.py) ---------------------------------
[[check]]
id = "statistics-cross-chip"
claim = "Moran's I and Geary's C, Graviton4 against x86"
kind = "reported"
observed = "Moran bit-identical on 19,246 of 19,428 puck genes; Geary on 18,169 of 19,428"
outcome = "reported"
across_chips = "fixed-point"
across_chips_evidence = "Moran max |Δ| 3.0e-16 (puck), 1.9e-15 (slide); Geary 8.9e-16, 1.6e-14; co-occurrence ≤ 2.2e-16; Intel == AMD byte-identical; gene rankings identical"

[[check]]
id = "pval-sim-ties"
claim = "permutation pval_sim, Graviton4 against x86"
kind = "reported"
observed = "14 of the 2,000 puck HVGs (16 on the slide) differ; worst by 21 of 100 permutations"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "var_sim agrees to 6e-16 on those genes; 11–96 of 100 permuted values lie within 1e-14 of the observed I, so sims >= score is a last-bit tie"

[[check]]
id = "svg-counts"
claim = "spatially variable genes at BH-FDR < 0.05, puck (reported, not asserted)"
kind = "reported"
observed = "7,486 of 19,428 analytic; 670 of the 2,000 HVGs by permutation"
outcome = "reported"

[[trap]]
id = "squidpy-permutation-leaves-numba-one-thread"
scope = "tool"
symptom = "numba.get_num_threads() is 1 after every n_jobs=1 nhood_enrichment; co_occurrence 34.5 s against 6.6 s, Moran's I 165 s against 83 s"
cause = "squidpy's runner calls numba.set_num_threads(1) before each chunk (squidpy/_utils.py:77, _callback_wrapper); under n_jobs=1 or the threading backend the chunk runs in the calling thread, so the setting outlives the call"
fix = "numba.set_num_threads(n) after each permutation call"
cost = "a run stopped when it showed the trap, ~$0.20"

[[trap]]
id = "squidpy-nhood-enrichment-readonly-memmap"
scope = "tool"
symptom = "TypeError: No matching definition for argument type(s) readonly array(uint32, 1d, C), …"
cause = "the counting kernel is compiled for writable uint32 arrays; loky memory-maps any argument over 1 MB read-only, and the graph's indices cross 1 MB at 262,144 edges"
fix = "n_jobs=1 for enrichment on a puck-sized section (then reset numba threads, above)"

[[trap]]
id = "squidpy-seed-depends-on-n-jobs"
scope = "tool"
symptom = "enrichment z-scores moved by up to 8.1 (puck) and 0.9 (slide) between n_jobs=1 and n_jobs=16 under the same seed"
cause = "squidpy seeds each worker's chunk from its position (seed + first index), so a different n_jobs draws a different null"
fix = "pin n_jobs with the seed"
