# --- checks: the README's "What held at scale, on all three chips" rows (real.py) ------
[[check]]
id = "deposit-sanity"
claim = "counts are non-negative integers; obs names unique; positions finite"
kind = "identity"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "knn-exhaustive"
claim = "kNN graph == exhaustive float64 kNN, every bead"
kind = "identity"
bound = "exact"
observed = "0 of 44,588 differ; distances rel 0 (10 beads tie at k = 6, checked by distance)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "radius-exhaustive"
claim = "radius graph == exhaustive, symmetric"
kind = "identity"
bound = "exact"
observed = "0 of 268,136 differ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "grid-eq-hex-lattice"
claim = "grid graph from pixel coordinates == the hex lattice from `array_row`/`array_col`, at 1, 2, 3 rings"
kind = "identity"
bound = "exact"
observed = "0 of 19,946 / 58,898 / 115,898 edges differ; ring labels == hop counts"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "grid-ring-size"
claim = "grid: every spot with a complete ring has exactly 3k(k+1) neighbours"
kind = "identity"
bound = "exact"
observed = "6 / 18 / 36 on 3,135 / 2,860 / 2,603 spots"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "enrichment-counts"
claim = "enrichment counts == M′AM (one-hot labels), sum == edges"
kind = "conservation"
bound = "exact"
observed = "equal, 5 calls per section"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "planted-halves"
claim = "planted halves on the real positions: left–left, right–right z > 5, left–right z < −5"
kind = "band"
