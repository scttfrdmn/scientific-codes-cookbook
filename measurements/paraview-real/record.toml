# measurements/paraview-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is the spawn completion window, exactly (results/billed-windows.txt), the README's
# "task window". wall is week.py's own timer (summary.tsv); real.sh's pvbatch_wall_s (times.txt) also
# counts pvbatch start-up (1,622 / 2,175 / 910 s). peak is ru_maxrss. 8 threads = TBB, read back from VTK.
schema = 2
result_unit = "one week (168 hours) of hourly ERA5 3D temperature contoured, clipped, integrated and rendered"

[workload]
size = { hours = 168, points = 38414880 }
note = "1440 x 721 x 37 points an hour, seven daily netCDF4 files (8.86 GB) staged to tmpfs; per hour: contour, feature edges, two scalar clips, four integrals and a frame"

[timing]
wall = "week.py's own wall (summary.tsv wall_s), 168 hours"
billed_basis = "spawn-task"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "contour-points"
attribution = "same-version-other-build"
attribution_note = "ParaView 6.1.1: aarch.science's viz image on Graviton4, its viz-c97c5af10411 linux-64 lock twin on x86; Intel's 8 vCPUs are 4 cores x 2 threads"
note = "AMD 1.78x faster than Graviton4 and 24% cheaper per result; Graviton4 1.35x faster than Intel"

[[dataset]]
id = "s3://nsf-ncar-era5/e5.oper.an.pl/202301/e5.oper.an.pl.128_130_t.ll025sc.202301{01..07}00_*23.nc (RDA ds633.0)"
tier = "roda"
pins = "pins.sha256"
note = "Payer: BucketOwner"

[[run]]
id = "m8g"
in = ["chip"]
instance = "m8g.2xlarge"
purpose = "primary"
workers = 8
ranks = 1
threads_per_rank = 8
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-18"
date_source = "git"
wall_s = 1581
billed_s = 1743
usd_hr = 0.359
compute_usd = 0.158
billed_usd = 0.174
peak_gib = 7.93
peak_kind = "rss"

[[run]]
id = "m8i"
in = ["chip"]
instance = "m8i.2xlarge"
purpose = "cross-chip"
workers = 8
ranks = 1
threads_per_rank = 8
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-18"
date_source = "git"
wall_s = 2136
billed_s = 2251
usd_hr = 0.4234
compute_usd = 0.251
billed_usd = 0.265
peak_gib = 7.86
peak_kind = "rss"

[[run]]
id = "m8a"
in = ["chip"]
instance = "m8a.2xlarge"
purpose = "cross-chip"
workers = 8
ranks = 1
threads_per_rank = 8
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-18"
date_source = "git"
wall_s = 886
billed_s = 972
usd_hr = 0.4869
compute_usd = 0.12
billed_usd = 0.131
peak_gib = 7.92
peak_kind = "rss"

# checks table in '## What held at scale, on all three chips': columns ['claim', 'why it must hold', 'all three chips']
[[check]]
id = "contour-points"
claim = "contour points = grid edges whose ends straddle 273.15 K"
kind = "identity"
observed = "168/168 hours, recounted in numpy from the same array"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "boundary-edges"
claim = "boundary edges of the surface = crossed edges on the six domain faces"
kind = "identity"
observed = "168/168"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "manifold"
claim = "0 non-manifold edges"
kind = "identity"
observed = "168/168"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "grid-volume"
claim = "`IntegrateVariables` volume of the grid = Σ\\|dx\\|·Σ\\|dy\\|·Σ\\|dz\\|"
kind = "identity"
observed = "0.0 relative"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "integral-trapezoid"
claim = "∫T over the grid = numpy's tensor trapezoid on the same coordinates"
kind = "cross-code"
bound = "N·ε = 8.3e-9"
observed = "worst 1.6e-13, bound N·ε = 8.3e-9"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "∫T differs across chips by ≤ 1.7e-13 relative; under TBB the same hour computed twice in one run differs by 3e-12 to 7.6e-11 (thread scheduling, not the chip)"

[[check]]
id = "planar-clip-partition"
claim = "a planar clip (z = 512.3 hPa) partitions the volume"
kind = "conservation"
bound = "8.3e-9"
observed = "worst 5.3e-11, bound 8.3e-9"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "clipped volumes differ by ≤ 2.0e-10 under TBB; the Sequential backend gives bit-identical vol_lo = −51248981.04289708 on all three"

[[check]]
id = "tbb-backend"
claim = "the TBB backend is the one in use, with 8 threads"
kind = "rank-count"
observed = "`TBB`, 8"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "frames"
claim = "168 frames, 800 × 450, shaded"
kind = "sentinel"
observed = "168/168"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "frames-bytes"
claim = "all 168 frames, byte for byte (S3 ETags), and 21 of 28 columns of hours.tsv in every hour"
kind = "reported"
observed = "identical on all three chips"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "scalar-clip-partition"
claim = "A scalar clip does not partition the volume exactly"
kind = "reported"
observed = "|below + above| misses the whole by up to 4.0e-7 relative, ∫T by 4.3e-7"
outcome = "reported"

[[check]]
id = "euler-characteristic"
claim = "The Euler characteristic V − E + F of the surface"
kind = "reported"
observed = "ranges from −55 to 178 across the week"
outcome = "reported"

[[check]]
id = "numpy-einsum"
claim = "numpy's own trapezoid (`einsum`) between arm64 and both x86 chips"
kind = "reported"
observed = "differs in 73 of 168 hours, by ≤ 2.4e-16"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "73 of 168 hours differ by ≤ 2.4e-16 (one ulp, SIMD summation order); Intel and AMD agree"

[[trap]]
id = "paraview-smp-sequential-default"
scope = "image"
symptom = "seven of the eight cores sit idle (hour 0: 29.4 s Sequential vs 7.3 s TBB on Graviton4)"
cause = "conda-forge's ParaView starts on VTK's `Sequential` SMP backend, which uses one core"
fix = "vtkSMPTools.SetBackend(\"TBB\") at the top of the pvbatch script"
cost = "2.0-4.2x on the hour-0 pipeline"

[[trap]]
id = "paraview-clip-negative-volume"
scope = "data"
symptom = "a clip of ERA5 integrates to a negative volume (−5.12e7 and −1.34e7 deg²·hPa on hour 0)"
cause = "ERA5's latitude runs north to south and clip pieces are integrated as signed tetrahedra"
fix = "take abs() before reporting a clipped volume or a ratio of one"
