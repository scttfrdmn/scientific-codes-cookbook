# --- checks: the five in-task assertions (results/smoke-check-*.txt) and the cross-chip identity
[[check]]
id = "partition-total"
claim = "partition total 48,817,006"
kind = "conservation"
bound = "want exactly 48817006 (every input record accounted for)"
observed = "48817006"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "examined-flagstat"
claim = "examined == flagstat"
kind = "cross-code"
bound = "== samtools flagstat primary-mapped"
observed = "48184934"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "supplementary-flagstat"
claim = "supplementary == flagstat"
kind = "cross-code"
bound = "== samtools flagstat supplementary"
observed = "519020"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "percent-recomputed"
claim = "the `PERCENT_DUPLICATION` recomputation"
kind = "identity"
bound = "want < 0.000001 (identity)"
observed = "0.008684"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "bam-magic"
claim = "the BAM magic"
kind = "sentinel"
bound = "1f8b0804"
observed = "1f8b0804"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "dup-metrics-across-chips"
claim = "`READ_PAIR_DUPLICATES` 206,518 and `PERCENT_DUPLICATION` 0.008684 on all four generations"
kind = "identity"
bound = "exact"
observed = "206,518; 0.008684"
outcome = "pass"
across_chips = "identical"
across_chips_evidence = "`dup_metrics.txt` is identical line for line on Graviton4, Intel and AMD, apart from the `# Started on:` timestamp"

[[check]]
id = "tmpfs-peak"
claim = "the tmpfs high-water mark within 2 MB (8,832–8,834 MB)"
kind = "reported"
observed = "8,832–8,834 MB; 8,834 MB Intel, 8,815 MB AMD"
outcome = "reported"

[[trap]]
id = "picard-spawn-task-run-no-bucket-substitution"
scope = "platform"
symptom = "stage-in fails with `Invalid bucket name \"${COOKBOOK_BUCKET}\"`"
cause = "`make run` substitutes ${COOKBOOK_BUCKET}; `spawn task run` does not"
fix = "pass a spec with the bucket already resolved"
