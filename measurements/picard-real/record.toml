in = ["gen"]
instance = "r6g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-r6g-2xl.txt"
date = "2026-10-01"
date_source = "git"
wall_s = 928
billed_s = 1150
usd_hr = 0.4032
compute_usd = 0.1039
billed_usd = 0.1288
tmpfs_peak_gib = 8.627
billed_basis = "unattributed"

