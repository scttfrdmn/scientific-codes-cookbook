# measurements/picard-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: the Intel/AMD billed is the EC2 window (CloudTrail, results/billed-windows.txt); the four
# 2026-10-02 generation rows' billed matches no surviving window (unattributed). tmpfs peaks are each
# smoke check's tmpfs_peak_used_mb.
schema = 2
result_unit = "one MarkDuplicates run on bwa's whole-genome sorted BAM (48,817,006 records, 4.5 GB)"

[workload]
size = { records = 48817006 }
note = "one MarkDuplicates pass over a whole-genome coordinate-sorted BAM (4,568,357,482 bytes), -Xmx24g; the temp spill lands in /tmp tmpfs"

[timing]
wall = "MarkDuplicates alone, timed in-script"
billed_basis = "ec2"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "size", "input"]
equal_work = "dup-metrics-across-chips"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "billed_usd" }
note = "per-step speedup 1.24x, 1.26x, 1.23x; 1.93x Graviton2 -> Graviton5; cost falls on both the billed and the compute-only basis"

[[series]]
id = "chip"
axis = "chip"
held = ["size", "generation"]
equal_work = "partition-total"
attribution = "same-version-other-build"
attribution_note = "x86 legs run bioconda's x86 build of the same Picard 3.5.0 on their own chip's bwa-samtools BAM (same 4,568,357,482 bytes); the 8i vCPUs are 4 cores with SMT, the 8a vCPUs 8 whole cores"

[[not_swept]]
axis = "workers"
reason = "MarkDuplicates' thread usage is modest and not configurable the way an aligner's is, so there is no core knee to find here; the generation axis is the whole question"

[[dataset]]
id = "bwa's whole-genome sorted BAM (aln.sorted.bam, 48,817,006 records, 4,568,357,482 bytes)"
tier = "run-output"
from_recipe = "bwa-samtools"
note = "x86 legs read their own chip's bwa-samtools BAM, same size; Intel's has arm64's S3 ETag, AMD's was uploaded in different parts so its ETag cannot show byte identity"

# --- Graviton generation sweep, 8 vCPU / 64 GiB, -Xmx24g, same digest, same object
[[run]]
