# measurements/structural-variants-real/record.toml -- manta and delly on whole-genome HG002 30x, three chips.
schema = 1
result_unit = "one whole genome called and checked by one caller"

[[dataset]]
id = "s3://giab NHGRI novoalign HG002.hs37d5.60x.1.bam (+ .bai), HG002 (NA24385), GRCh37 hs37d5"
tier = "roda"
pins = "pins.sha256"
note = "copied server-side into the bucket"

[[dataset]]
id = "s3://1000genomes hs37d5.fa.gz (+ .fai)"
tier = "roda"
pins = "pins.sha256"
note = "names and lengths asserted == 1000 Genomes' published .fai; 00-prep's decompressed hs37d5.fa is pinned too"

