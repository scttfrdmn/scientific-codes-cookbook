# measurements/pytorch-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: each chip's task ran BOTH trainings, so its EC2 window (results/billed-windows.txt: 1726 /
# 946 / 642 s) is shared by the two and the one-training rows carry billed_basis = "shared-window".
schema = 2
result_unit = "one 15-epoch ResNet-20 training run on the complete CIFAR-10"
throughput_unit = "samples/s"

[workload]
size = { epochs = 15, train_images = 50000, test_images = 10000, parameters = 269722 }
note = "one training process, 16 threads, deterministic algorithms and a fixed seed; the dataset fits in RAM as uint8 tensors"

[timing]
wall = "the train column: the task's command window halved (two trainings per task), so it includes data loading and per-epoch evaluation"
billed_basis = "shared-window"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "layout", "size"]
equal_work = "pixels-sha256"
attribution = "same-version-other-build"
attribution_note = "x86 runs the env's linux-64 twin of the same PyTorch build; aarch64's oneDNN backward-weights convolution falls back to gemm:ref while x86 runs jit:avx512_core; Intel's 16 vCPU are 8 cores with SMT"

[[dataset]]
id = "s3://fast-ai-imageclas/cifar10.tgz (CIFAR-10, AWS Open Data)"
tier = "roda"
pins = "pins.sha256"
note = "copied from stage-inputs.sh, verified before upload and re-verified in-task"

[[run]]
id = "chip-c8g"
in = ["chip"]
instance = "c8g.4xlarge"
purpose = "primary"
results = "results/arm64-c8g.4xlarge"
threads_per_core = 1
workers = 16
ranks = 1
threads_per_rank = 16
date = "2026-10-17"
date_source = "git"
wall_s = 791
usd_hr = 0.6381
compute_usd = 0.14
peak_gib = 3.0
throughput = 1004
simd_path = "gemm:ref (backward-weights); brgconv:sve_128 (forward)"
note = "wall_s is the train column (task command window halved). README bills the task covering both trainings (1726 s, $0.306), so billed is left out of a one-training row. $/hr from the AWS Price List; spawn printed none"

[[run]]
id = "chip-c8i"
in = ["chip"]
instance = "c8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64-c8i.4xlarge"
threads_per_core = 2
workers = 16
ranks = 1
threads_per_rank = 16
date = "2026-10-17"
date_source = "git"
wall_s = 411
usd_hr = 0.7497
compute_usd = 0.086
peak_gib = 3.1
throughput = 2099
simd_path = "jit:avx512_core"
note = "wall_s is the train column (task command window halved). README bills the task covering both trainings (946 s, $0.197), so billed is left out of a one-training row. $/hr from the AWS Price List; spawn printed none"

[[run]]
id = "chip-c8a"
in = ["chip"]
instance = "c8a.4xlarge"
purpose = "cross-chip"
results = "results/amd-c8a.4xlarge"
host = "results/amd-c8a.4xlarge/host.txt"
spawn_version = "0.131.1"
workers = 16
ranks = 1
threads_per_rank = 16
date = "2026-10-20"
date_source = "git"
wall_s = 283
usd_hr = 0.8622
compute_usd = 0.068
peak_gib = 3.1
throughput = 3243
simd_path = "jit:avx512_core"
note = "wall_s is the train column (task command window halved). README bills the task covering both trainings (641 s, $0.154), so billed is left out of a one-training row. $/hr from the AWS Price List; spawn printed none"

# checks table in '## What was asserted at scale, on all three chips': columns ['identity', 'graviton4', 'intel', 'amd']
[[check]]
id = "pixels-sha256"
claim = "archive sha256 pinned; decoded pixels+labels sha256"
kind = "pin"
observed = "`12412dd2…`"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "class-counts"
claim = "class counts: 5,000 train / 1,000 test per class, all RGB 32×32"
kind = "identity"
observed = "exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "param-count"
claim = "ResNet-20 parameter count = 269,722 (counted by hand, He et al.'s \"0.27M\")"
kind = "reference"
observed = "exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "repeat-bit-identical"
claim = "repeat in a fresh process: every parameter, all 5,865 per-step losses, final accuracy"
kind = "invariance"
observed = "bit-identical"
outcome = "pass"

[[check]]
id = "confusion-books"
claim = "confusion rows each sum to 1,000, total 10,000, trace = correct count"
kind = "conservation"
observed = "exact"
outcome = "pass"

[[check]]
id = "softmax-sum"
claim = "softmax rows sum to 1 (float64)"
kind = "conservation"
observed = "5.6e-16 (Graviton4); 6.7e-16 (Intel, AMD)"
outcome = "pass"

[[check]]
id = "accuracy-bounds"
claim = "test accuracy > 0.80 (floor) and < 0.9225 (ceiling)"
kind = "band"
bound = "> 0.80 and < 0.9225"
observed = "0.8871"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "0.8871 (Graviton4) vs 0.8880 (Intel, AMD)"

[[check]]
id = "batch-independence"
claim = "eval batch 100 vs 1000: max \\|Δlogit\\|, prediction flips (reported)"
kind = "reported"
observed = "0, 0 (Graviton4); 7.6e-06, 0 (Intel, AMD)"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "Graviton4 max |Δlogit| exactly 0; x86 takes a different kernel per batch size and moves logits by 7.6e-6"

[[check]]
id = "step0-loss"
claim = "The step-0 loss is bit-identical across chips"
kind = "reported"
observed = "2.4814796…"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "trained-network"
claim = "The trained network is a path, so the cross-chip comparison is reported, not asserted"
kind = "reported"
observed = "final train loss 0.2906 vs 0.2892, test accuracy 88.71% vs 88.80%"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "first differ at step 1 by 2.4e-7 (one float32 ulp), 1e-2 by step 10; mid-training accuracy up to 10 points apart (epoch 1: 45.9% vs 56.4%); AMD == Intel bit for bit (parameter hash d8e6af29…, A.trace byte-identical)"

[[trap]]
id = "pytorch-onednn-bwdw-gemm-ref-sve128"
scope = "tool"
symptom = "on Graviton4 the backward-weights convolution dispatches `gemm:ref` (8.65 ms vs x86 `jit:avx512_core` 0.59 ms, ONEDNN_VERBOSE); x86 trains 2.1-3.2x faster"
blames = "conda-forge's build"
cause = "oneDNN's f32 backward-weights list has aarch64 JIT kernels for SVE-512 and SVE-256 only, so 128-bit SVE falls through to im2col + portable ref_gemm; PyTorch's own ACL wheel is the same (8.84 ms); Graviton3 SVE-256 picks jit:sve_256 at 0.85 ms"
fix = "none upstream yet; torch.backends.mkldnn.flags(enabled=False) routes it to im2col + OpenBLAS (5.8 ms, still 10x x86, and slows forward/backward-data). Pick the chip by the job: Graviton4 infers 1.6-2.2x faster"
refs = ["oneDNN#2165"]

[[upstream]]
ref = "oneDNN#2165"
role = "cited"
note = "uxlfoundation/oneDNN: no SVE-128 backward-weights kernel; the cause of the training gap"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "AMD leg ran with spawn 0.131.1 built from its tag; 0.139.1's wrapper leaves too little of the 16 KiB user data"
