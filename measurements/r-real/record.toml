# measurements/r-real/record.toml -- a year of NYC taxi trips in R, three chips, checked against DuckDB.
# Schema 2: billed is the EC2 window (CloudTrail RunInstances -> TerminateInstances, to within 1 s;
# results/billed-windows.txt). wall is analysis.R's RSCRIPT_WALL_S. Threads are the packages'
# defaults (data.table 4, arrow 8), so no ranks x threads layout is authored.
schema = 2
result_unit = "the 2023 NYC TLC yellow-taxi year read, aggregated three ways and regressed (38,310,226 trips)"

[workload]
size = { rows = 38310226, model_rows = 34184942, files = 12 }
note = "12 monthly Parquet files (606 MiB) read into one data.table, three group-sum engines, then one lm() with a 34 M x 32 design matrix kept with its QR"

[timing]
wall = "the R session (analysis.R's RSCRIPT_WALL_S)"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "size", "generation"]
equal_work = "rows"
attribution = "same-version-other-build"
attribution_note = "same R 4.5.3 package versions: aarch.science's r image on Graviton4, the linux-64 twin installed offline on x86; the x86 bills are lower because of that packaging (80 s image pull vs 2 s pull + 4 s install), not the chip; Intel's 8 vCPU are 4 cores x 2 threads"
note = "AMD is fastest (1.19x Graviton4, 1.29x Intel); Graviton4 does the R work 1.09x faster than Intel and 22% cheaper"

[[dataset]]
id = "NYC TLC 2023 yellow-taxi trip records, 12 monthly Parquet files, https://d37ci6vzurychx.cloudfront.net/trip-data"
tier = "durable-id"
pins = "pins.sha256"
note = "per-file sha256s as fetched on 2026-10-17, copied from stage-inputs.sh; a TLC re-issue fails staging"

[[run]]
id = "r8g"
in = ["chip"]
instance = "r8g.2xlarge"
purpose = "primary"
results = "results/results-arm64-r8g2xl.txt"
date = "2026-10-17"
date_source = "run"
wall_s = 77.3
billed_s = 287
usd_hr = 0.4713
compute_usd = 0.0101
billed_usd = 0.0376
peak_gib = 31.66
peak_kind = "rss"
phase_s = { pull = 80 }
note = "billed includes the 0.86 GB aarch.science r image pull (80 s); phases: read 4.8, lm() 15.3, crossprod+solve 17.5 s"

[[run]]
id = "r8i"
in = ["chip"]
instance = "r8i.2xlarge"
purpose = "cross-chip"
results = "results/results-x86_64-r8i2xl.txt"
date = "2026-10-17"
date_source = "run"
threads_per_core = 2
wall_s = 84.4
billed_s = 226
usd_hr = 0.5557
compute_usd = 0.013
billed_usd = 0.0349
peak_gib = 31.49
peak_kind = "rss"
phase_s = { pull = 2, stage_in = 10, setup = 4 }
note = "x86 env twin installed offline (2 s pull, 10 s stage-in, 4 s install): the lower bill is packaging, not the chip"

[[run]]
id = "r8a"
in = ["chip"]
instance = "r8a.2xlarge"
purpose = "cross-chip"
results = "results/results-amd-r8a2xl.txt"
host = "results/host-amd-r8a2xl.txt"
spawn_version = "0.131.1"
date = "2026-10-21"
date_source = "run"
wall_s = 65.2
billed_s = 161
usd_hr = 0.639
compute_usd = 0.0116
billed_usd = 0.0286
peak_gib = 31.53
peak_kind = "rss"
note = "spawn 0.131.1 built from its release tag (0.139.1's wrapper overflows EC2 user data, spawn#1246)"

# --- checks: "What held at scale, on all three chips" (check.R, vs DuckDB 1.5.6) ------------
[[check]]
id = "rows"
claim = "rows decoded == Parquet footers == DuckDB"
kind = "cross-code"
observed = "38,310,226"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "total-cents"
claim = "total in integer cents == DuckDB"
kind = "cross-code"
observed = "109,038,341,189"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "groups-conserve"
claim = "group sums (62 month×payment, 263 zones) add back to N and to the total"
kind = "conservation"
observed = "exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "three-engines"
claim = "data.table == dplyr (tolerance 0) == base rowsum()"
kind = "identity"
observed = "TRUE"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "agg-sha-duckdb"
claim = "both aggregate tables, sha256 == DuckDB's"
kind = "cross-code"
observed = "match"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "model-rows"
claim = "model rows under the filters == DuckDB"
kind = "cross-code"
observed = "34,184,942"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "lm-rank"
claim = "lm rank"
kind = "identity"
observed = "32 of 32"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "normal-equations"
claim = "normal equations, max cos(Xⱼ, r) < √N·ε (1.3e-12)"
kind = "band"
bound = "< √N·ε (1.3e-12)"
observed = "6.5e-15"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "6.5e-15 (Graviton4) vs 3.3e-16 (Intel, AMD; 3.318e-16 on both)"

[[check]]
id = "qr-vs-normeq"
claim = "QR vs solve(XᵀX, Xᵀy), rel. < √N·κ²·ε (4.0e-7, κ = 553.8)"
kind = "band"
bound = "< √N·κ²·ε (4.0e-7, κ = 553.8)"
observed = "3.0e-10"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "3.0e-10 (Graviton4), 4.2e-13 (Intel), 8.5e-13 (AMD)"
corename_sensitive = true

[[check]]
id = "coefficients"
claim = "lm coefficients across chips"
kind = "reported"
observed = "differ in the 10th–11th digit (largest absolute difference 1.1e-10)"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "intercept 2.1904801166 vs …1167; AMD and Intel byte-identical, all 32 to 16 digits"
corename_sensitive = true

[[trap]]
id = "r-nyc-tlc-bucket-403"
scope = "data"
symptom = "list, head-object and requester-pays all return 403 from a configured account on s3://nyc-tlc"
blames = "your AWS credentials"
cause = "the RODA-listed bucket denies signed requests too (known since 2024)"
fix = "fetch from the TLC's own CloudFront distribution, pinned by sha256 as fetched"
refs = ["open-data-registry#1418"]

[[upstream]]
ref = "awslabs/open-data-registry#1418"
role = "workaround"
note = "s3://nyc-tlc returns 403; files come from the TLC's CloudFront instead"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "AMD leg ran on spawn 0.131.1 built from its release tag"
