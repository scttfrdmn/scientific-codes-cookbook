# measurements/bedtools-real/record.toml
# Schema 2: billed is spawn's task window (results/billed-windows.txt, matched by task id:
# cookbook-bedtools-gen-c{6,7,9}g-* from gen-c*.task.json; the x86 legs' gen-c8g-{x8664,amd}-*).
# Until #123 the README printed the x86 rows' EC2 window (226/221 s, kept as ec2_s) and Graviton
# windows 58-87 s over spawn. The c8g row stays unattributed: its spec is gen-c8g.task.json, and the
# batch's only c8g window is the recipe's genomecov task, a different task id.
schema = 2
result_unit = "one genomecov -ibam pass over the whole-genome BAM (48,817,006 records, 3,366 contigs)"

[workload]
size = { records = 48817006, contigs = 3366 }
note = "one serial genomecov pass over bwa's sorted BAM (4.5 GB) on 8 vCPU; the same BAM object on every chip"

[timing]
wall = "genomecov alone, timed in-script"
billed_basis = "spawn-task"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "size"]
equal_work = "genome-bases-fai"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "wall" }
note = "2.33x Graviton2 -> Graviton5; per-step 1.69x, 1.16x, 1.19x; Graviton4's billed window is unattributed, so billed is not compared across its rung"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "size", "generation"]
equal_work = "genome-bases-fai"
attribution = "same-version-other-build"
attribution_note = "x86 rows run the recipe's pinned biocontainers bedtools 2.31.1 against the same BAM object; Intel's 8 vCPUs are 4 cores x 2 SMT"

[[dataset]]
id = "bwa-samtools sorted BAM, runs/bwa-samtools/r1/aln.sorted.bam (4.5 GB)"
tier = "run-output"
pins = "../picard-real/pins.sha256"
from_recipe = "bwa-samtools"
note = "the same object on all six rungs, including Intel and AMD (not the x86 re-alignment); hashed 2026-10-28 on AWS, after the runs, and the object was rewritten 2026-10-24 by bwa-samtools' #121 re-run (same size), so the pin proves today's bytes, not the run's"

[[dataset]]
id = "GRCh38_full_analysis_set_plus_decoy_hla.fa.fai (inputs/bwa-real/)"
tier = "versioned-release"
pins = "../bwa-real/pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[run]]
id = "gen-c6g"
in = ["gen"]
instance = "c6g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-c6g-2xl.txt"
date = "2026-10-02"
date_source = "run"
wall_s = 286
billed_s = 361
usd_hr = 0.272
compute_usd = 0.0216
billed_usd = 0.0273
tmpfs_peak_gib = 4.2568

