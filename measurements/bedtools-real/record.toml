# measurements/bedtools-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "one genomecov -ibam pass over the whole-genome BAM (48,817,006 records, 3,366 contigs)"

[[dataset]]
id = "bwa-samtools sorted BAM, runs/bwa-samtools/r1/aln.sorted.bam (4.5 GB)"
tier = "run-output"
from_recipe = "bwa-samtools"
note = "the same object on all six rungs, including Intel and AMD (not the x86 re-alignment)"

[[dataset]]
id = "GRCh38_full_analysis_set_plus_decoy_hla.fa.fai (inputs/bwa-real/)"
tier = "versioned-release"
pins = "../bwa-real/pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[run]]
instance = "c6g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-c6g-2xl.txt"
date = "2026-10-01"
date_source = "git"
wall_s = 286
billed_s = 420
usd_hr = 0.272
compute_usd = 0.0216
billed_usd = 0.0317

[[run]]
instance = "c7g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-c7g-2xl.txt"
date = "2026-10-01"
date_source = "git"
wall_s = 169
billed_s = 290
usd_hr = 0.29
compute_usd = 0.0136
billed_usd = 0.0234

[[run]]
instance = "c8g.2xlarge"
purpose = "primary"
results = "results/smoke-check-c8g-2xl.txt"
date = "2026-10-01"
date_source = "git"
threads_per_core = 1
wall_s = 146
billed_s = 284
usd_hr = 0.319
compute_usd = 0.0129
billed_usd = 0.0252

[[run]]
instance = "c9g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-c9g-2xl.txt"
date = "2026-10-01"
date_source = "git"
wall_s = 123
billed_s = 229
usd_hr = 0.3478
compute_usd = 0.0119
billed_usd = 0.0221

[[run]]
instance = "c8i.2xlarge"
purpose = "cross-chip"
spawn_version = "0.139.1"
results = "results/smoke-check-c8i-2xl.txt"
host = "results/hwprobe-c8i-2xl.txt"      # model/siblings/cores only; tpc from the README column
date = "2026-10-01"
date_source = "git"
threads_per_core = 2
wall_s = 130
billed_s = 226
usd_hr = 0.3748
compute_usd = 0.0135
billed_usd = 0.0235

[[run]]
instance = "c8a.2xlarge"
purpose = "cross-chip"
spawn_version = "0.139.1"
results = "results/smoke-check-c8a-2xl.txt"
host = "results/hwprobe-c8a-2xl.txt"
date = "2026-10-01"
date_source = "git"
threads_per_core = 1
wall_s = 101
billed_s = 221
usd_hr = 0.4311
compute_usd = 0.0121
billed_usd = 0.0265

[[check]]
id = "genome-bases-fai"
claim = "genome bases == the reference .fai total"
kind = "conservation"
bound = "== the reference .fai total"
observed = "3,217,346,917"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "per-contig-bases"
claim = "per-contig bases == the genome aggregate"
kind = "conservation"
bound = "== the genome aggregate"
observed = "3,217,346,917"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "covered-1x"
claim = "covered ≥1×"
kind = "reported"
observed = "2,164,818,308 (67.2858%)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "mean-depth"
claim = "mean depth"
kind = "reported"
observed = "1.4875×"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "max-depth"
claim = "max depth"
kind = "reported"
observed = "17,991"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "genomecov-bytes"
claim = "genomecov-wgs.txt is byte-identical on all three chips"
kind = "reported"
observed = "byte-identical"
outcome = "reported"
across_chips = "identical"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "x86 legs staged each resolved spec's command as a sha256-checked file run with bash"
