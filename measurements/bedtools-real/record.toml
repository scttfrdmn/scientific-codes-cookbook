# measurements/bedtools-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: the x86 rows' billed is the EC2 window (README; CloudTrail in results/billed-windows.txt
# matches 226/221 s exactly). The Graviton rows' billed is 58-87 s longer than their spawn windows and
# CloudTrail no longer reaches 2026-10-02, so it is unattributed. Dates are the git date results/ landed;
# the completion records put the Graviton runs on 2026-10-02 and the x86 legs on 2026-10-21.
schema = 2
result_unit = "one genomecov -ibam pass over the whole-genome BAM (48,817,006 records, 3,366 contigs)"

[workload]
size = { records = 48817006, contigs = 3366 }
note = "one serial genomecov pass over bwa's sorted BAM (4.5 GB) on 8 vCPU; the same BAM object on every chip"

[timing]
wall = "genomecov alone, timed in-script"
billed_basis = "ec2"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "size"]
equal_work = "genome-bases-fai"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "wall" }
note = "2.33x Graviton2 -> Graviton5; per-step 1.69x, 1.16x, 1.19x; billed is boot-dominated and ranks Graviton3 ahead of Graviton4"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "size", "generation"]
equal_work = "genome-bases-fai"
attribution = "same-version-other-build"
attribution_note = "x86 rows run the recipe's pinned biocontainers bedtools 2.31.1 against the same BAM object; Intel's 8 vCPUs are 4 cores x 2 SMT"

[[dataset]]
id = "bwa-samtools sorted BAM, runs/bwa-samtools/r1/aln.sorted.bam (4.5 GB)"
tier = "run-output"
from_recipe = "bwa-samtools"
note = "the same object on all six rungs, including Intel and AMD (not the x86 re-alignment)"

[[dataset]]
id = "GRCh38_full_analysis_set_plus_decoy_hla.fa.fai (inputs/bwa-real/)"
tier = "versioned-release"
pins = "../bwa-real/pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[run]]
id = "gen-c6g"
in = ["gen"]
instance = "c6g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-c6g-2xl.txt"
date = "2026-10-01"
date_source = "git"
wall_s = 286
billed_s = 420
billed_basis = "unattributed"
usd_hr = 0.272
compute_usd = 0.0216
billed_usd = 0.0317
tmpfs_peak_gib = 4.2568

[[run]]
id = "gen-c7g"
in = ["gen"]
instance = "c7g.2xlarge"
purpose = "generation-sweep"
results = "results/smoke-check-c7g-2xl.txt"
date = "2026-10-01"
date_source = "git"
wall_s = 169
billed_s = 290
billed_basis = "unattributed"
usd_hr = 0.29
compute_usd = 0.0136
billed_usd = 0.0234
tmpfs_peak_gib = 4.2568

[[run]]
id = "c8g"
in = ["gen", "chip"]
