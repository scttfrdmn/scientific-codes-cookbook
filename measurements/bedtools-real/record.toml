[[check]]
id = "genome-bases-fai"
claim = "genome bases == the reference .fai total"
kind = "conservation"
bound = "== the reference .fai total"
observed = "3,217,346,917"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "per-contig-bases"
claim = "per-contig bases == the genome aggregate"
kind = "conservation"
bound = "== the genome aggregate"
observed = "3,217,346,917"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "covered-1x"
claim = "covered ≥1×"
kind = "reported"
observed = "2,164,818,308 (67.2858%)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "mean-depth"
