# measurements/openblas-x86/record.toml -- drafted by the #118 extraction, then authored.
# A probe, not a workload: the README prices and times nothing, so the runs carry no $ and no seconds.
# The input is synthetic (set.seed(20261004), a 200x200 symmetric matrix built in the probe), so no dataset.
schema = 1
result_unit = "one probe run on one instance (fixed-point and attempted-path quantities through OpenBLAS); not priced"

[[run]]
instance = "c6i.large"
purpose = "diagnostic"
date = "2026-10-25"
date_source = "run"
