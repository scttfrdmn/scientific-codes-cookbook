# --- checks: in-task asserts (results/*smoke-check.txt, canary.txt, concordance.txt) ----
[[check]]
id = "snv-precision"
claim = "SNV precision vs GIAB HG001 v4.2.1, QUAL>=30, inside the high-confidence BED"
kind = "reference"
bound = ">=0.98"
observed = "0.99000"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "snv-recall"
claim = "SNV recall vs GIAB HG001 v4.2.1"
kind = "reference"
bound = ">=0.99"
observed = "0.99545"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "snv-f1"
claim = "SNV F1 vs GIAB HG001 v4.2.1"
kind = "reference"
bound = ">=0.985"
observed = "0.99272"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "indel-concordance"
claim = "indels (observation)"
kind = "reported"
observed = "0.99419 precision, 0.99372 recall, 0.99395 F1"
outcome = "reported"
across_chips = "n/a"

[[check]]
id = "truth-denominator"
claim = "TP + FN = 69,210 is the truth-side SNV count inside the BED, matching the local truth-vs-itself identity test"
kind = "identity"
observed = "69,210"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "threads-invariant"
claim = "variants_8t must equal variants_1t -- threads change speed, never the answer"
kind = "invariance"
bound = "=="
observed = "4093"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "generation-invariant"
claim = "All four returned exactly 4,093 variants and 3,361 SNVs"
kind = "invariance"
bound = "=="
observed = "4,093 variants, 3,361 SNVs"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "java-pairhmm"
claim = "arm64_java_pairhmm: Intel GKL AVX .so cannot load on AArch64 -> Java LOGLESS_CACHING"
kind = "native-arch"
bound = ">=1"
observed = "1"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "vcf-structure"
claim = "a VCF that is single-sample (NA12878), entirely on chr20, indexed"
kind = "identity"
bound = "sample NA12878, all_on_chr20 0, sample_column 1, vcf_index 1"
outcome = "pass"
across_chips = "n/a"

[[cross_code]]
with = "published:GIAB-HG001-v4.2.1"
same_bytes = false
metric = "SNV precision, recall, F1 by POS:REF:ALT inside the high-confidence BED"
tolerance_basis = "precision floor 0.98 is looser than observed because the recipe applies no variant filtering, so precision is a property of the recipe, not of GATK"
check = "snv-f1"

[[trap]]
id = "gatk4-gkl-x86-only-threads-inert"
scope = "tool"
symptom = "Unable to load libgkl_compression.so from native/libgkl_compression.so ... cannot open shared object file: No such file or directory (Possible cause: can't load AMD 64 .so on a AARCH64 platform)"
blames = "a missing file"
cause = "GATK ships its PairHMM and SmithWaterman accelerators (Intel GKL) as x86-64 native libraries only; on AArch64 both fall back to Java, single-threaded, so --native-pair-hmm-threads is inert"
fix = "do not buy cores for HaplotypeCaller on Graviton; buy the cheapest box that holds the heap and scatter intervals across tasks"
cost = "77 s at 1 thread vs 78 s at 8"
