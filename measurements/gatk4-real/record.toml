# measurements/gatk4-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed windows are spawn's completion records (README caveats; all five match to the second).
schema = 2
result_unit = "one HaplotypeCaller call set over the sweep interval chr20:1,000,000-3,000,000 (NA12878, ~33x)"

[workload]
size = { interval_mb = 2 }
note = "one HaplotypeCaller call over chr20:1,000,000-3,000,000; the rate along chr20 varies ~50x with local complexity, so a per-Mb rate does not transfer"

[timing]
wall = "HaplotypeCaller alone"
billed_basis = "spawn-task"

[[series]]
id = "threads"
axis = "workers"
held = ["image", "instance", "size"]
equal_work = "threads-invariant"
attribution = "same-binary"
attribution_note = "--native-pair-hmm-threads is inert on AArch64: the Intel GKL is x86-only, so PairHMM falls back to single-threaded Java"
verdict = { shape = "flat", through = 8, on = "wall" }

[[series]]
id = "gen"
axis = "generation"
held = ["image", "workers", "size", "input"]
equal_work = "generation-invariant"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "compute_usd" }
note = "every step of the ladder is both faster and cheaper; Graviton5 1.95x Graviton2"

[[dataset]]
id = "NYGC 30x NA12878 CRAM, ENA ERR3239334"
tier = "durable-id"
pins = "pins.sha256"
note = "hashed in place at s3://1000genomes/1000G_2504_high_coverage/data/ERR3239334/ with its .crai; hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "NA12878 chr20 36x BAM (built from ERR3239334, inputs/gatk4/NA12878.chr20.30x.bam)"
tier = "built"
pins = "pins.sha256"
from_recipe = "gatk4"
note = "sha256 copied from results/prep-check.txt, the build run's own check output"

[[dataset]]
id = "GIAB HG001 v4.2.1 benchmark VCF + high-confidence BED, chr20 slice"
tier = "versioned-release"
pins = "pins.sha256"
note = "inputs/gatk4/truth.*; hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's; the .vcf.gz and .bed sha256s are also in minimap2-real/pins.sha256"

[[dataset]]
id = "GRCh38_full_analysis_set_plus_decoy_hla.fa (chr20 reference + index)"
tier = "versioned-release"
pins = "pins.sha256"
note = "chr20.fa.fai and chr20.dict copied from recipes/gatk4/stage-inputs.sh; chr20.fa (inputs/bwa-samtools/) hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

