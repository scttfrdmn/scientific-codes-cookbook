# measurements/gpu-gromacs/record.toml -- written from scratch at schema 2 (#118), from README.md and
# the committed results/ and cfg/ (S3 reads only, $0).
# GPU rows: spawn launch on the DLAMI (spawn#601), NGC GROMACS 2023.2 by the full digest that every
# host.log prints. Prices are the README's rate-card $/hr (no artifact carries a price); $/ns is
# derived from usd_hr / ns/day, never authored. The util plateau / mean / HBM peak are derived from
# the committed gpu_util*.csv, never authored.
# Dates: the S3 LastModified of each run's artifacts, in the session's local time (PDT), the
# convention the README uses (in UTC the evening runs of 09-15 fall on 09-16).
# CPU leg: the README says "the instance *size* is not recorded", so those rows are
# '<family>.unrecorded' (families from the README's CPU table and the result prefixes); no vCPUs
# derived, no price. NOT a row: RUN 1 (results/run1-a10g/): no artifact names its instance family
# ("The A10G size is printed by RUN 2" only); its md.log lines and 465.827 ns/day live in the
# 'run1-auto-offload' check.
# The p5 / g7e capacity watches in cfg/ have no outcome in any artifact, so they are not rows.
schema = 2
result_unit = "one simulated nanosecond of a 21,087-atom SPC water box (PME, 1.0 nm cut-offs, 2 fs, h-bond constraints, V-rescale 300 K)"
throughput_unit = "ns/day"
throughput_is_result = true

[workload]
size = { atoms = 21087, steps = 25000 }
note = "gmx solvate -cs spc216 -box 6 6 6 (7,029 SOL), built in-task; one job per card unless MPS-packed"

[timing]
wall = "mdrun's own Wall t from md.log (the scripts' wall_s)"

[[series]]
id = "card"
axis = "gpu_model"
held = ["image", "size", "layout", "workers"]
equal_work = "gpu-runs-complete"
attribution = "same-binary"
note = "-nb gpu -pme gpu -update gpu -ntmpi 1 -ntomp 8 on each card; the README states no shape. The Blackwell (g7) member failed in mdrun"

[[series]]
id = "offload"
axis = "offload"
held = ["image", "instance", "size", "layout", "workers"]
equal_work = "gpu-runs-complete"
attribution = "same-binary"
note = "one A10G, one box, four configs: full offload is 6.47x the CPU-only run; moving PME alone to the CPU costs 2.57x, moving the update 1.17x"

[[series]]
id = "mps"
axis = "concurrent"
held = ["image", "instance", "size"]
equal_work = "gpu-runs-complete"
attribution = "same-binary"
verdict = { shape = "knee", at = 2, through = 4, on = "throughput" }
note = "aggregate gains 73.2% from 1 to 2 jobs, then 1.7% and 0.1% (flat after two); per-system ns/day falls 2.27x from N = 1 to 4"

[[series]]
id = "accelerator"
axis = "accelerator"
held = ["size", "workers"]
equal_work = "none: the GPU and CPU legs ran the same .mdp and solvate at 25,000 steps but are different builds; each leg's completion is its own check (gpu-runs-complete, cpu-runs-complete)"
attribution = "other-version"
attribution_note = "GPU legs run NGC GROMACS 2023.2 (CUDA, full offload); CPU legs conda-forge GROMACS 2026.3 (miniforge3:latest + run-time install, except the pinned aarchsci md on c8g). The NGC image never completed a CPU-only run, so any GPU-vs-CPU multiple carries the build difference too"
note = "CPU instance sizes are not recorded; 8 OpenMP threads on every member"

[[dataset]]
id = "gmx solvate -cs spc216 -box 6 6 6, OPLS-AA SPC water (7,029 SOL), GROMACS's own spc216"
tier = "built"
unpinned = "built in-task by gmx solvate + grompp from the image's own spc216.gro and a .mdp the script writes; nothing is staged"

