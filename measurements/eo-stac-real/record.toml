# measurements/eo-stac-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "the whole search plus every check (Earth Search v1 sentinel-2-l2a, California, 2024)"

[[dataset]]
id = "Earth Search v1 sentinel-2-l2a over s3://sentinel-cogs/sentinel-s2-l2a-cogs/, bbox [-124.5, 32.5, -114.1, 42.0], datetime 2024"
tier = "roda"
pins = "pins.sha256"
note = "live catalog; the reference is the 2026-10-20 00-pin snapshot (snapshot/items.jsonl.gz, snapshot/listing.tsv.gz), pinned in pins.sha256"

[[dataset]]
id = "earth-observation-real 11SKA 2024: scenes.txt, sizes.tsv, pins.sha256"
tier = "run-output"
pins = "pins.sha256"
note = "reused from measurements/earth-observation-real (eo-real/* lines of pins.sha256)"

# billed = EC2 launch to terminate; task window (295 / 264 / 234 s) is not the billed column
[[run]]
instance = "m8g.2xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 32
wall_s = 208.1
billed_s = 346
usd_hr = 0.359
compute_usd = 0.0208
billed_usd = 0.0345
peak_gib = 1.52
peak_kind = "rss"

[[run]]
instance = "m8i.2xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 32
wall_s = 206.7
billed_s = 347
usd_hr = 0.4234
compute_usd = 0.0243
billed_usd = 0.0408
peak_gib = 1.52
peak_kind = "rss"

[[run]]
instance = "m8a.2xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-21"
date_source = "run"
workers = 32
wall_s = 187.8
billed_s = 282
usd_hr = 0.4869
compute_usd = 0.0254
billed_usd = 0.0381
peak_gib = 1.52
peak_kind = "rss"

# --- checks: "What held at scale, on all three chips"; "Nothing differed" across chips
[[check]]
id = "pagination-complete"
claim = "`matched()` == items paginated, no id served twice"
kind = "identity"
observed = "18,346 / 18,346"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "page-size-invariance"
claim = "limit 1000 (ids only) == limit 100, the same **sequence**"
kind = "invariance"
observed = "18,346 ids, same order"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "monthly-partition"
claim = "12 monthly searches: disjoint, union == the year, each only its month"
kind = "conservation"
observed = "1,593 … 1,945, sum 18,346"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "cloud-partition"
claim = "`eo:cloud_cover` < 20 ∪ ≥ 20 == the year, disjoint, predicate holds"
kind = "conservation"
observed = "9,886 + 8,460 + 0 missing"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "aggregate"
claim = "server `/aggregate` total and per-tile counts == the items"
kind = "identity"
observed = "18,346; 135 tiles; overflow 0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "query-satisfied"
claim = "every item: collection, year, geometry ∩ bbox (shapely)"
kind = "identity"
observed = "0 violate"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "search-vs-bucket"
claim = "**search == the query recomputed from the bucket's own items**"
kind = "reference"
observed = "18,346 of 53,706 match; 0 / 0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "s3-path"
claim = "`earthsearch:s3_path` == the item's bucket directory"
kind = "identity"
observed = "0 differ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "api-vs-bucket-item"
claim = "**API item == bucket item, value for value**, except links and created/updated"
kind = "reference"
observed = "0 of 18,346 differ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "hrefs-listed"
claim = "every `sentinel-cogs` asset href is a listed key"
kind = "identity"
observed = "347,724 checked, 0 dangling"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "proj-code-rename"
claim = "pystac renames `proj:epsg` → `proj:code` on parse"
kind = "identity"
observed = "18,346 of 18,346"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "11ska-pins"
claim = "11SKA == earth-observation-real's 153 scenes + its nodata item; their item files still match its sha256 pins; their 612 sizes match"
kind = "pin"
observed = "154; 0 differ; 0 differ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "snapshot"
claim = "live items == the snapshot, byte for byte; live listing == pinned (key, size, ETag)"
kind = "pin"
observed = "18,346; 384,386 rows"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "unreferenced-cogs"
claim = "Reported, not asserted: what the bucket holds that the catalog does not say"
kind = "reported"
observed = "S2B_10TEM_20240829_0_L2A lists 5 assets, 14 data COGs unreferenced; L2A_PVI.tif in 18,302 of 18,346 dirs, never an asset; 3 of 53,709 dirs have no item JSON"
outcome = "reported"
across_chips = "identical"

[[cross_code]]
with = "measurements/earth-observation-real"
same_bytes = true
metric = "11SKA 2024 scene set, item-file sha256 pins and 612 asset sizes"
check = "11ska-pins"

[[trap]]
id = "eo-stac-page-too-big-500"
scope = "tool"
symptom = "APIError: {\"message\": \"Internal server error\"}"
blames = "the server, generically; the error does not say \"page too big\""
cause = "a page cannot be larger than ~6 MB: limit=1000 full items fails; limit=260 (5.57 MB) returns 200, limit=300 returns 502"
fix = "keep full-item searches at pystac-client's default of 100; ids-only searches page fine at 1000"

[[trap]]
id = "eo-stac-fields-drop-datetime"
scope = "tool"
symptom = "parse_exception: cannot parse empty date"
cause = "Earth Search builds its next-page token from each item's datetime; excluding properties gives a good first page and page 2 fails server-side"
fix = "`fields` must keep `properties.datetime`"

[[trap]]
id = "eo-stac-api-vs-bucket-bytes"
scope = "data"
symptom = "every API item differs from its bucket file when compared as raw JSON (18,346 of 18,346)"
cause = "the API serialises the bucket's integral floats as integers (proj:transform 20.0 -> 20)"
fix = "compare value for value, or API to API / bucket to bucket, never across by hash"
