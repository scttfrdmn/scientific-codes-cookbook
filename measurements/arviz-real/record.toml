# measurements/arviz-real/record.toml
schema = 1
result_unit = "the whole verified set: 57 posteriordb posteriors sampled, and both draw sets (reference and fresh) diagnosed and checked"

[[dataset]]
id = "posteriordb 1.1.0 (tag 1.1.0, commit 299b77cf): 57 posteriors with reference posteriors"
tier = "versioned-release"
pins = "pins.sha256"
from_recipe = "measurements/cmdstan-real"
note = "reuses cmdstan-real's staged copy in place (256 files, 32 MB, each checked against its git blob)"

[[run]]
instance = "m8g.xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-20"
date_source = "git"
wall_s = 1128
billed_s = 1204
usd_hr = 0.1795
compute_usd = 0.0562
billed_usd = 0.06
peak_gib = 6.93
peak_kind = "cgroup-memory.peak"
note = "wall_s is the whole task (CmdStan compile+sample dominates); ArviZ's own time is 41.8 s"

[[run]]
instance = "m8i.xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-20"
date_source = "git"
wall_s = 1261
billed_s = 1315
usd_hr = 0.2117
compute_usd = 0.0742
billed_usd = 0.0773
peak_gib = 8.87
peak_kind = "cgroup-memory.peak"
note = "the bayes env's linux-64 twin; ArviZ's own time 38.9 s"

[[run]]
instance = "m8a.xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-20"
date_source = "git"
wall_s = 704
billed_s = 743
usd_hr = 0.2434
