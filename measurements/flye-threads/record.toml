# --- checks: the README's stated observations (no checks table; claims copied from its prose) --
[[check]]
id = "final-assembly-sentinel"
claim = "the span from `Starting Flye` to `Final assembly`"
kind = "sentinel"
observed = "INFO: Final assembly: /tmp/out/assembly.fasta in every flye.log"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "logs-agree"
claim = "Each `timing.txt` holds the wall and the counts, and each `flye.log` agrees with it: its `Fragments`, `Total length` and `Largest frg` lines"
kind = "reported"
observed = "10 / 12 / 11 / 14 contigs; 5,478,608 / 5,470,958 / 5,400,307 / 5,502,781 bp"
outcome = "reported"
across_chips = "n/a"

[[check]]
id = "contigs-by-threads"
claim = "On the same reads, `-t 1/2/4/8` gave 10, 12, 11 and 14 contigs."
kind = "reported"
observed = "10, 12, 11, 14"
outcome = "reported"
across_chips = "n/a"
