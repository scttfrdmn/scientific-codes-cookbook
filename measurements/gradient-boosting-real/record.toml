# measurements/gradient-boosting-real/record.toml -- drafted by the #118 extraction, then authored.
# No results/ committed: every number is the README's, except the billed windows (results/billed-windows.txt).
# Schema 2: billed is the EC2 window (README: "launch to terminate"), matched exactly by CloudTrail.
schema = 2
result_unit = "one whole verified run: all of HIGGS loaded, a 500-round xgboost and a 500-round LightGBM fit, six 100-round verification fits and SHAP"

[[dataset]]
id = "UCI HIGGS, doi:10.24432/C5V312, ml/machine-learning-databases/00280/HIGGS.csv.gz"
tier = "durable-id"
pins = "pins.sha256"
note = "copied from the README's Pins table and stage-inputs.sh"

[workload]
size = { rows = 11000000, features = 28, rounds = 500 }
note = "all of UCI HIGGS; two 500-round fits (xgboost, LightGBM) plus six 100-round verification fits and SHAP in one task"

[timing]
wall = "task compute: the whole real.py script (CSV load, both main fits, verification fits, SHAP)"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation", "layout"]
equal_work = "margins-cross-chip"
attribution = "same-version-other-build"
attribution_note = "x86 legs use the recipe's geo-ml env twin (xgboost 3.4.2, LightGBM 4.7.0, numpy 2.5.3); Intel's 8 vCPU are 4 cores with SMT"

# Compound "fit wall: xgboost / LightGBM" and "compute $/fit" cells share one task and one bill,
# so they are not split into rows; wall_s is the README's "task compute" (the whole script).
[[run]]
id = "chip-m8g"
in = ["chip"]
instance = "m8g.2xlarge"
purpose = "primary"
date = "2026-10-18"
date_source = "git"
workers = 8
ranks = 1
threads_per_rank = 8
threads_per_core = 1
wall_s = 552
billed_s = 707
usd_hr = 0.359
billed_usd = 0.0705
peak_gib = 17.4
peak_kind = "rss"
note = "fit wall xgboost / LightGBM 92.6 / 160.0 s, compute $/fit 0.0092 / 0.0160 (per fit, not per result, so not compute_usd); cgroup memory.peak 17.3 GiB"

[[run]]
id = "chip-m8i"
in = ["chip"]
instance = "m8i.2xlarge"
purpose = "cross-chip"
date = "2026-10-18"
date_source = "git"
workers = 8
ranks = 1
threads_per_rank = 8
threads_per_core = 2
wall_s = 771
billed_s = 888
usd_hr = 0.4234
billed_usd = 0.1044
peak_gib = 17.4
peak_kind = "rss"
note = "fit wall 149.7 / 205.9 s, compute $/fit 0.0176 / 0.0242; cgroup memory.peak 20.1 GiB (x86 twin env installs at run time)"

[[run]]
id = "chip-m8a"
in = ["chip"]
instance = "m8a.2xlarge"
purpose = "cross-chip"
date = "2026-10-18"
date_source = "git"
workers = 8
ranks = 1
threads_per_rank = 8
threads_per_core = 1
wall_s = 575
billed_s = 701
usd_hr = 0.4869
billed_usd = 0.0948
peak_gib = 17.4
peak_kind = "rss"
note = "fit wall 88.0 / 170.0 s, compute $/fit 0.0119 / 0.0230; cgroup memory.peak 20.1 GiB"

# --- checks: the README's "What held at scale, on all three chips" rows ---------------
[[check]]
id = "input-pin"
claim = "sha256 of the staged file == the pin; 11,000,000 × 29, labels {0,1}, all finite"
kind = "pin"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "hessian-sum"
claim = "tree 0: sum of leaf hessians == n·p0·(1−p0)"
kind = "conservation"
bound = "1e-5 relative"
observed = "xgb 1.20e-08, lgb 1.13e-08 rel"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "lgb-leaf-counts"
claim = "LightGBM: every tree's leaf counts sum to n_train"
kind = "conservation"
bound = "exact"
observed = "500 of 500"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "shap-local-accuracy"
claim = "TreeSHAP contributions + bias == raw margin, 1,000 rows"
kind = "identity"
bound = "1e-3 xgboost (float32), 1e-9 LightGBM"
observed = "xgb 4.586e-06 (float32), lgb 1.785e-13"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "xgboost residual 4.586e-06 (Graviton4) vs 4.584e-06 (Intel, AMD); LightGBM 1.785e-13 on all three"

[[check]]
id = "determinism-100-rounds"
claim = "a fresh 100-round fit == the main model's first 100 trees"
kind = "identity"
bound = "exact"
observed = "margins and xgb dump identical"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "scale-invariance"
claim = "fit on `4X`, predict `4X_test` == fit on X"
kind = "invariance"
bound = "exact"
observed = "bit-identical, both"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "monotone-constraint"
claim = "`m_bb` constrained non-decreasing: steps on a 500 × 200 grid"
kind = "identity"
bound = "min step >= 0"
observed = "min step 0.000e+00, both"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "unconstrained-control"
claim = "the unconstrained model on the same grid must step down"
kind = "band"
bound = "min step < 0"
observed = "−0.880 / −0.895"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "test-auc"
claim = "test AUC > 0.80"
kind = "band"
bound = "> 0.80"
observed = "0.845918 / 0.845705"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "published-auc"
claim = "AUC against LightGBM's docs/Experiments.rst"
kind = "reported"
observed = "LightGBM 0.845705 vs 0.845724; xgboost hist 0.845918 vs 0.845314"
outcome = "reported"

[[check]]
id = "margins-cross-chip"
claim = "xgb_margin.npy and lgb_margin.npy sha256 across chips"
kind = "reported"
observed = "byte-identical on Graviton4, Intel and AMD"
outcome = "reported"
across_chips = "identical"

[[cross_code]]
with = "published:LightGBM-v4.6.0-docs-Experiments.rst-HIGGS"
same_bytes = true
metric = "test AUC on the published split and settings"
tolerance_basis = "reported, not asserted: the published numbers come from much older versions of both libraries, so they check the setup, not a reference value"
check = "published-auc"

[[trap]]
id = "gradient-boosting-uci-chunked-fetch-drops"
scope = "data"
symptom = "UCI serves the file chunked with no Content-Length and dropped the first fetch at 1.25 GB"
cause = "chunked transfer with no Content-Length from UCI"
fix = "fetch.py resumes with Range; completeness proved by an end-to-end gzip read (CRC-32 and length trailer) and the row count"
