# measurements/salmon-real/record.toml -- the SIMPLE case.
# Everything not here (owner recipe = salmon, tool/version, arm64 + x86 pins, last_verified*,
# spec paths, families/TTL/cost_limit, staging, chip names) is derived by gen_catalog.py.
# Schema 2: billed = wall + overhead = the spawn wrapper's window (the README: stage-in start to stage-out
# done), matching cookbook-salmon-quant-c{6,7,8,9}g-v2 and -c8g-v2-{x8664-x1,amd-a1} to within 1 s.
schema = 2
result_unit = "one complete RNA-seq run quantified (ERR188026, 15.8M reads, all 453,553 Ensembl 116 transcripts)"
throughput_unit = "reads/s"

[workload]
size = { reads = 15800127, transcripts = 453553 }
note = "one complete run against one shared 1.68 GB index tar, built once by recipes/salmon/01-index"

[timing]
wall = "salmon quant (quant_wall_s)"
billed_basis = "spawn-task"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "workers", "size", "spawn_version"]
equal_work = "numreads-conservation"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "billed_usd" }
note = "2.04x faster Gv2 -> Gv5; 37% cheaper compute, 33% cheaper billed; overhead also shrinks 74 -> 43 s"

[[series]]
id = "chip"
axis = "chip"
held = ["workers", "size", "generation"]
equal_work = "quant-sf-bytes"
attribution = "same-version-other-build"
attribution_note = "x86 rows run bioconda's linux/amd64 salmon 2.7.0 and read the index their own salmon built (a different tar); Intel's 16 vCPUs are 8 cores with SMT"
note = "AMD fastest and, by a hair, cheapest billed; Graviton4 ties it on compute (0.0131 vs 0.0132)"

[[not_swept]]
axis = "workers"
reason = "At 16 threads quant finishes in about a minute against 43-78 s of fixed overhead. There is nothing for more cores to buy"

[[dataset]]
id = "Ensembl 116 Homo_sapiens.GRCh38.cdna.all.fa.gz"
tier = "versioned-release"
pins = "pins.sha256"
note = "inputs/salmon-real/ensembl116_cdna.fa.gz; hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "ENA ERR188026_{1,2}.fastq.gz (complete run)"
tier = "durable-id"
pins = "../kallisto-real/reads.md5"
note = "ENA's fastq_md5 (md5, not sha256) for this same object (inputs/salmon-real/), checked on the box by kallisto-real, rsem-real and transcript-assembly-real; salmon-real's own runs did not check it"

[[dataset]]
id = "salmon index (1.68 GB tar)"
tier = "run-output"
from_recipe = "salmon"          # recipes/salmon/01-index.task.json; x86 rows read each chip's own index
note = "arm64 and x86 indexes are different tars; quant.sf is byte-identical regardless"

