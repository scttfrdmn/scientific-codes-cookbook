# --- checks: README has no checks table; these are the in-task asserts in results/*.txt -
[[check]]
id = "tpm-sum"
claim = "sum(TPM) == 1000000.00"
kind = "identity"
bound = "exact"
observed = "1000000.00"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "numreads-conservation"
claim = "sum(NumReads) == num_mapped"
kind = "conservation"
bound = "exact"
observed = "14,913,565"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "quant-sf-bytes"
claim = "quant.sf byte-identical on Graviton4, Intel and AMD"
kind = "reported"               # observed after the fact, not an in-task assert
observed = "byte-identical"
outcome = "reported"
across_chips = "identical"

[[trap]]
id = "salmon-image-no-python-jq"
scope = "image"
symptom = "exit 127 on every chip after quant.sf had already staged"
cause = "the aarchbio salmon image has neither python3 nor jq; the sweep script parsed meta_info.json with python"
fix = "parse with the shell tools the image actually has; check an image for the interpreters you assume"
cost = "the first sweep's timings (science recoverable from the staged output)"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "0.139.1 leaves too little of EC2's 16 KiB user data for this inline script; x86 legs staged a sha256-checked task.sh"
