# measurements/zarr-dask-real/record.toml -- drafted by the #118 extraction, then authored.
# Two single-tool tasks per chip on two boxes: 01-ncref (climate env, xlarge) and 02-zarr (the
# recipe's pathology image, 4xlarge). The README's $/result columns are the SUM of both tasks, so
# neither row carries that figure; the zarr row's billed_usd is its own spawn cost_estimate.
# Schema 2: the rows are pipeline tasks (attempt r3); the ncref rows have no printed $/hr, so the
# generator's per-chip sum carries wall and billed seconds but no $. billed is the spawn completion
# window, exactly (results/billed-windows.txt), though the README calls it launch to terminate.
schema = 2
result_unit = "the whole verified run: both tasks (netCDF reference + zarr/dask) and every check"

[workload]
size = { days = 60225, cells = 51840 }
note = "one variable x one experiment x one member: 60,225 x 180 x 288 float32 (12.49 GB decoded; a 7.78 GB Zarr v2 store, 72 chunks); 02-zarr rewrites it at seven layouts in tmpfs and reduces each"

[timing]
wall = "each task's tool, timed in run.sh (ncref-times.txt / times.txt tool_wall_s)"
billed_basis = "spawn-task"

[[series]]
id = "chip-zarr"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "zarr-eq-netcdf"
attribution = "same-version-other-build"
attribution_note = "the recipe's pathology image on Graviton4, its pathology-c817c8dd8540 linux-64 twin on x86 (zarr, dask, numcodecs at the same versions); Intel's 16 vCPUs are 8 cores x 2 SMT"
note = "AMD finishes 1.45x faster than Graviton4 and 1.75x faster than Intel, and is cheapest per result"

[[series]]
id = "chip-ncref"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "zarr-eq-netcdf"
attribution = "same-version-other-build"
attribution_note = "the climate env on Graviton4, its climate-60e8dca4df0d twin on x86; netCDF4 single-threaded"

[[dataset]]
id = "CMIP6 CMIP.NOAA-GFDL.GFDL-CM4.historical.r1i1p1f1.day.tas.gr1 v20180701 Zarr v2 store, s3://cmip6-pds (102 objects) + fx/areacella/gr1/v20180701 (21)"
tier = "roda"
pins = "tas.md5"
note = "pinned by the publisher's single-part MD5 ETags in tas.md5 / areacella.md5; bucket is Payer: BucketOwner"

[[dataset]]
id = "ESGF netCDF s3://esgf-world/CMIP6/.../v20180701/*.nc, 9 files, 7.18 GB (us-east-2)"
tier = "durable-id"
pins = "esgf-nc.sha256"
note = "the SHA256 the ESGF index publishes, identical at all four replicas it lists"

