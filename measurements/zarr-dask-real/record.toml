# --- checks: "What held at scale, on all three chips" (92 checks per chip, all passing)
[[check]]
id = "provenance"
claim = "9 netCDF files match ESGF's published SHA256; 123 Zarr objects match the publisher's single-part MD5 ETags"
kind = "pin"
observed = "9/9, 123/123"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "zarr-eq-netcdf"
claim = "**Zarr store == ESGF netCDF: sha256 of the whole decoded array**"
kind = "cross-code"
observed = "`c69468cd…2fd90` both"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "row-sums"
claim = "every (day, lat-row) sum of `tas × 2²⁴` == netCDF's, all 10.8M"
kind = "cross-code"
observed = "equal; total 14,496,831,323,174,129,664 / 2²⁴"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "coordinates"
claim = "time, time_bnds, lat/lon and bounds == netCDF's"
kind = "cross-code"
observed = "exact; zarr's `days since 12:00` int == netCDF's float − 0.5, all 60,225"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "geometry"
claim = "72 chunk objects, the last ragged; noleap 165 × 365"
kind = "identity"
observed = "71 × 838 + 727"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "weights-telescope"
claim = "cell weights `sin φn − sin φs` telescope to 2"
kind = "identity"
observed = "0.0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "areacella"
claim = "**`areacella` == the spherical cell area at R = 6371 km, rounded to float32**"
kind = "reference"
bound = "≤ 2⁻²⁴"
observed = "max 5.33e-8 ≤ 5.96e-8, all 51,840 cells"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "coarsen"
claim = "dask annual coarsen == numpy, every cell of 165 × 51,840; years sum to each cell's total"
kind = "conservation"
observed = "exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "object-count"
claim = "`v3-*`: data objects == the grid's chunk/shard count"
kind = "identity"
observed = "72 / 72 / 72 / 90 / 2,440 / 17 / 72"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "rewrite-bit-identical"
claim = "`v3-*`: **bit-identical to the published store**, region by region on the copy's own grid"
kind = "invariance"
observed = "every region, every layout"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "reads-vs-numpy"
claim = "`v3-*`: point series and day maps == numpy"
kind = "cross-code"
observed = "exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "integer-sums-minmax"
claim = "`v3-*`: exact integer (day, row) sums == reference; min/max bit-exact; argmax of the unique maximum == numpy"
kind = "invariance"
observed = "exact; index 2,867,408,966"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "daily-f64-exact"
claim = "`v3-*`: **every daily float64 sum is exact**"
kind = "invariance"
observed = "0 error, 60,225 days × 7 layouts"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "f64-total-bound"
claim = "`v3-*`: float64 total within `2·log₂(n)·ε` = 1.40e-14 of the exact value"
kind = "band"
bound = "2·log₂(n)·ε = 1.40e-14, n = 3.12e9"
observed = "**0 ulp** from correctly rounded at every layout"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "f32-control"
claim = "`v3-*`: **control, float32 accumulation misses that bound**"
kind = "band"
observed = "2.1e-8 to 9.7e-8 out: the global mean off by 6e-6 to 2.7e-5 K"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "the float32 total takes 3 distinct values across the 7 layouts; each layout's value is bit-identical on Graviton4, Intel and AMD (compare.txt)"

[[check]]
id = "area-weighted-daily"
claim = "`v3-*`: every daily area-weighted sum within `(2·log₂(51840)+2)·ε` of an `fsum` over exact row sums"
kind = "band"
bound = "(2·log₂(51840)+2)·ε"
observed = "max 3.56e-16 ≤ 7.40e-15"
outcome = "pass"
across_chips = "path"
across_chips_evidence = "the area-weighted daily series takes 4 distinct values across the 7 layouts; each layout's value is bit-identical on Graviton4, Intel and AMD"

[[check]]
id = "determinism"
claim = "the same dask reduction twice"
kind = "identity"
observed = "bit-identical"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "historical-warming"
claim = "GFDL-CM4's own global-mean `tas`, reported, not asserted"
kind = "reported"
observed = "285.917 K for 1850–1900 and 286.636 K for 1995–2014: 0.72 K"
outcome = "reported"
across_chips = "identical"

[[trap]]
id = "zarr-dask-zstd-no-shuffle"
scope = "tool"
symptom = "zarr v3 ZstdCodec store 31% larger (10.08 GB vs 7.71 GB) than blosc-lz4-with-shuffle on the same float32 data"
cause = "zarr's v3 ZstdCodec on its own applies no byte shuffle"
fix = "a codec default is not a neutral choice: add a shuffle, or use blosc with shuffle"

[[trap]]
id = "zarr-dask-reencode-not-published-bytes"
scope = "data"
symptom = "re-encoding with the store's own codec settings (blosc, lz4, clevel 5, shuffle) reproduces 0 of 72 published chunk objects"
cause = "the 2020 store was written by an older c-blosc"
fix = "assert on decoded arrays (bit-identical in all three), not on chunk payload bytes"
