# measurements/megahit-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is the spawn completion window, exactly (results/billed-windows.txt). The -t 16
# rows are one task that assembles BOTH runs (size carries both); the -t 1 rows are the even run.
# peak is ru_maxrss; avg_cores and tmpfs_peak_gib are assemble.sh's sampler
# (times.txt / footprint.txt; for the -t 16 rows the log run's, the larger).
schema = 2
result_unit = "one metagenome assembly (one whole ZymoBIOMICS run)"

[workload]
size = { read_pairs = 8785731 }
note = "the D6300 even run (MiSeq 2x151, 2.65 Gbp); the -t 16 rows also assemble the D6310 log run (47,832,553 pairs, 9.66 Gbp) in the same task"

[timing]
wall = "megahit's own wall (megahit_wall_s, == its 'ALL DONE. Time elapsed'); the -t 16 rows' wall is the sum of the two assemblies"
billed_basis = "spawn-task"

[[series]]
id = "chip-t16"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "reads-in-library"
attribution = "same-version-other-build"
attribution_note = "MEGAHIT 1.2.9: aarch.bio's build on Graviton4, bioconda's on x86; the builds assemble slightly different contig sets (~2% of bases), and --no-hw-accel shows it is the build, not the POPCNT/BMI2 core; Intel's 16 vCPUs are 8 cores x 2 SMT"
note = "Graviton4 is the cheapest assembly at -t 16: AMD 1.23-1.29x faster but 5-10% dearer, Intel slower and 35-48% dearer"

[[series]]
id = "chip-t1"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "reads-in-library"
attribution = "same-version-other-build"
attribution_note = "as chip-t16; at -t 1 Intel == AMD byte-identical, arm64 differs (the build)"
note = "at one thread the order flips: AMD 1.26x and Intel 1.11x faster than Graviton4, all within 7% on cost"

[[dataset]]
id = "ENA PRJEB29504 ERR2984773 (D6300 even, 8,785,731 pairs) and ERR2935805 (D6310 log, 47,832,553 pairs), FASTQ.gz from the RODA .sra"
tier = "roda"
pins = "pins.sha256"
note = "the same staged bytes measurements/metaphlan-real profiles (its stage-inputs.sh converts .sra -> FASTQ.gz)"

[[dataset]]
id = "Zymo ZymoBIOMICS.STD.refseq.v2.zip (73.0 Mb), from Zymo's S3 bucket by object version id"
tier = "durable-id"
pins = "pins.sha256"
note = "v2 references (2023) postdate the 2019 runs: same strains, re-sequenced"

