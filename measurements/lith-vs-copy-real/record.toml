# measurements/lith-vs-copy-real/record.toml -- drafted by the #118 extraction, then authored.
# Graviton4 only; the variable is the data path. Three arms per workload: today (spawn's
# stage-in, the source measurement's own run, not re-run), tuned copy (CLI CRT client), lith.
# wall_s = the tool's own wall column; billed_s = spawn's window minus the two baseline copies.
# Peak memory is host MemTotal - MemAvailable (counts the tmpfs): peak_kind host-used.
# Schema 2: request charges are request_usd; tmpfs_peak_gib and phase_s are row.json's (new arms) or
# the README's (today). The today rows' billed is the plain spawn window (controls.txt), except
# tomography, whose billed excludes the astra/compare check phases on every arm.
schema = 2
result_unit = "one workload result: the BBii TomoPy reconstruction / one 0.25-degree GFS cycle / one SV caller on HG002 30x / the whole Argo GDAC archive"

[timing]
wall = "the tool's own wall: TomoPy / gfs.py / the SV caller / argo.py"
billed_basis = "spawn-task-minus-baseline"

[[series]]
id = "tomography"
axis = "data_path"
held = ["image", "size", "generation"]
equal_work = "tomography-arms"
attribution = "same-binary"
attribution_note = "the arms' boxes differ by family as well as by data path: r8g for the copies, m8g for lith (the smallest box it allows)"
note = "ties before request charges and loses after them; on the TomoPy result the tuned copy wins"

[[series]]
id = "gfs"
axis = "data_path"
held = ["image", "size", "generation"]
equal_work = "gfs-arms"
attribution = "same-binary"
attribution_note = "r8g for the copies, m8g for lith"
note = "requests included, lith is $0.130 against $0.131: a tie, on a box with half the RAM"

[[series]]
id = "manta"
axis = "data_path"
held = ["image", "size", "generation"]
equal_work = "manta-arms"
attribution = "same-binary"
attribution_note = "r8g for the copies, c8g for lith"
note = "manta runs 32 region readers against one 64 GB object: 7.6x slower through lith"

[[series]]
id = "delly"
axis = "data_path"
held = ["image", "size", "generation"]
equal_work = "delly-arms"
attribution = "same-binary"
attribution_note = "r8g for the copies, c8g for lith"
note = "delly streams the BAM: lith wins, $0.50 a genome against $0.73 tuned"

[[series]]
id = "gsw"
axis = "data_path"
held = ["image", "size", "generation"]
equal_work = "gsw-identities"
attribution = "same-binary"
attribution_note = "r8g for the copies, c8g for lith; the lith arm did not finish"

[[not_swept]]
axis = "chip"
reason = "Graviton4 only, because the variable is the data path"

[[not_swept]]
axis = "workers"
reason = "A smaller vCPU count was not run, because thread count was held fixed to keep the tool's run unchanged"

[[dataset]]
id = "tomography-real: the whole BBii scan, 42.4 GB of zips (Zenodo DOI)"
tier = "durable-id"
pins = "../tomography-real/pins.sha256"
note = "re-staged by tomography-real's own stage-inputs.sh; matched the committed pins again"

[[dataset]]
id = "s3://noaa-gfs-bdp-pds one whole 0.25-degree GFS cycle, 418 objects, 113.1 GB"
tier = "roda"
pins = "../gfs-thickness-real/gfs-cycle.sha256"
note = "re-staged by gfs-thickness-real's own stage-inputs.sh; matched the committed pins again"

[[dataset]]
id = "GIAB HG002 30x BAM (63.9 GB) + hs37d5 reference (3.2 GB)"
tier = "roda"
pins = "../structural-variants-real/pins.sha256"
note = "structural-variants-real's staged inputs; the 30x BAM is derived by its 00-prep"

[[dataset]]
id = "Argo GDAC archive, 30,230 files, 215.1 GB"
tier = "roda"
pins = "../gsw-real/argo.sha256"
note = "gsw-real's staged inputs"

