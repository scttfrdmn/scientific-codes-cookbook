# --- checks: "What held, per arm" (outcome keys are the arms, not chips: Graviton4 only)
[[check]]
id = "tomography-arms"
claim = "tomography: inputs vs `pins.sha256`; every `ok_` assertion (slice map, three centres, 2,160/2,160 FRC, invariance, astra FBP/CGLS)"
kind = "identity"
observed = "pass, identical (only `gridrec_s_per_slice` 0.068 vs 0.070)"
outcome = "pass"

[[check]]
id = "gfs-arms"
claim = "gfs: 418 files vs source MD5; `gfs-cycle.sha256` == committed; 155,240 messages vs `.idx`; thickness ≤ 2% above ground; `GFS THICKNESS REAL OK`"
kind = "pin"
observed = "pass; `summary.json` identical on all 24 non-timing keys"
outcome = "pass"

[[check]]
id = "manta-arms"
claim = "manta: inputs vs pins; END/SVLEN convention on every record; sentinel"
kind = "identity"
observed = "pass, `711477cd…`; VCF byte-identical to the tuned arm"
outcome = "pass"

[[check]]
id = "delly-arms"
claim = "delly: inputs vs pins; MAD 90, 776,849 discordant pairs; BGZF BCF"
kind = "identity"
observed = "pass; BCF identical to the tuned arm byte for byte, and to today's except `##fileDate`"
outcome = "pass"

[[check]]
id = "gsw-pins"
claim = "gsw: 30,230 inputs vs pins"
kind = "pin"
observed = "pins pass through lith"
outcome = "pass"

[[check]]
id = "gsw-identities"
claim = "gsw: TEOS-10 check values; every involution; `GSW ARGO OK`"
kind = "identity"
observed = "argo.py did not complete, so its identities were not reached"
outcome = { today = "pass", tuned-copy = "pass", lith = "not-run" }

[[trap]]
id = "lith-vs-copy-cli-default-transfer"
scope = "platform"
symptom = "spawn's stage-in copies at 179-293 MB/s"
blames = "the copy itself"
cause = "aws s3 cp at the CLI default (10 requests, 8 MiB parts)"
fix = "preferred_transfer_client = crt, target_bandwidth = the box's peak NIC, 16 MiB parts: 1.53-2.68 GB/s on every box"
cost = "billed $/result 14-89% higher (tomography 29%, gfs 65%, manta 30%, delly 14%, gsw 89%)"
refs = ["spawn#1256"]

[[trap]]
id = "lith-vs-copy-empty-s3-section"
scope = "tool"
symptom = "exit 255 on every `aws s3` command (the canary's \"default\" rows)"
cause = "an empty `s3 =` section in an AWS CLI config file fails every `aws s3` command"
fix = "omit the section; arm.sh's baselines supply the default figure"

[[trap]]
id = "lith-vs-copy-cost-limit-no-container-log"
scope = "method"
symptom = "the first gsw lith arm, stopped by its cost_limit at $2.01, left no container log"
cause = "the arm ran its own docker run on the host; the container's output was not streamed anywhere spawn uploads"
fix = "arm.sh now streams the container log"
cost = "$2.01"

[[trap]]
id = "lith-vs-copy-many-readers-one-object"
scope = "method"
symptom = "manta 7.6x slower through lith; gsw did not finish under a $1.33 cap"
cause = "many readers each take a slice of one object; an 8 GiB tier on a small box cannot hold what the next reader wants (gsw cause likely, not diagnosed)"
fix = "copy (tuned) for many-reader shapes; byte amplification (4.6x, 10.0x, >= 3.7x) says which shape you are in"
cost = "$3.34 for the two gsw lith attempts"

[[upstream]]
ref = "spawn#1256"
role = "cited"
note = "the CRT-client stage-in fix this measures"
