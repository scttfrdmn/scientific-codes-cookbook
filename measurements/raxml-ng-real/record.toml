# measurements/raxml-ng-real/record.toml
schema = 1
result_unit = "one gene-family tree: the adaptive ML search (13 starts) plus 20 bootstrap replicates and supports, PF01255.25 seed, 919 sequences x 533 columns"

[[dataset]]
id = "Pfam 38.2 seed alignment PF01255.25 (Prenyltransf), extracted from EBI's Pfam-A.seed.gz"
tier = "versioned-release"
pins = "pins.sha256"
from_recipe = "measurements/iqtree-real"
note = "iqtree-real streamed Pfam-A.seed.gz, checked EBI's md5 and pinned the extracted family; this measurement reads that one object"

[[run]]
instance = "c8g.2xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-20"
date_source = "git"
workers = 8                     # --threads 8 --workers 1
wall_s = 30812
billed_s = 30934
usd_hr = 0.319
compute_usd = 2.7306
billed_usd = 2.7414
peak_gib = 0.74
peak_kind = "rss"
note = "search 14,320 s + 20 bootstraps 16,492 s; aarch.bio arm64 build runs the SSE3 kernel"

[[run]]
instance = "c8i.2xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-20"
date_source = "git"
workers = 8
wall_s = 24394
billed_s = 24511
usd_hr = 0.3748
compute_usd = 2.54
billed_usd = 2.5521
peak_gib = 0.79
peak_kind = "rss"
note = "search 11,448 s + bootstraps 12,946 s; bioconda x86 build, AVX2 kernel"

[[run]]
instance = "c8a.2xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-20"
date_source = "git"
workers = 8
wall_s = 9361
billed_s = 9449
usd_hr = 0.4311
