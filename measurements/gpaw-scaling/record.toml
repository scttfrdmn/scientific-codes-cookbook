# --- checks ---------------------------------------------------------------------------------
[[check]]
id = "rank-independent-energy"
claim = "the extrapolated energy is −380.305329 eV on five of seven rungs and −380.305360 on the other two, 3.1e-5 eV apart. More ranks change the speed, not the answer."
kind = "invariance"
bound = "<1e-4 eV (legible-r5 smoke check, 4 vs 8 ranks)"
observed = "−380.305329 (n = 1, 2, 4, 16, 48) / −380.305360 (n = 8, 32); 3.10e-05 eV"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "world-size"
claim = "`gpaw.mpi.world.size` reads back 4 and 8"
kind = "rank-count"
bound = "exactly 4 and exactly 8"
observed = "4 and 8 (legible-r5 only; the sweep rungs' RANKS may be echoed, not read back)"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "natoms"
claim = "natoms want 64 (2x2x2 supercell of the 8-atom conventional cell)"
kind = "identity"
bound = "64"
observed = "64"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "energy-physical"
claim = "energy_physical want -7..-4 (bulk Si LDA)"
kind = "band"
bound = "-7..-4 eV/atom"
observed = "-5.9423 eV/atom"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "knee-ok"
claim = "`timing.txt` records `RANKS` (the count launched) and, for 16–48, `OK True`"
kind = "reported"
observed = "OK True on n = 16, 32, 48"
outcome = "reported"
across_chips = "n/a"
