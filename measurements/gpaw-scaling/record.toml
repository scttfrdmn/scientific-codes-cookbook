# measurements/gpaw-scaling/record.toml -- GPAW 25.7.0 on 64-atom bulk Si, 1 -> 48 MPI ranks
# (OMP_NUM_THREADS=1), Graviton4, 2026-09-09, us-east-1. Written from scratch at schema 2.
# INSTANCE SIZES ARE NOT RECORDED: the README says only "the session record says c8g throughout".
# So every row is c8g.unrecorded: the family is the README's, the size is not guessed, no vCPUs are
# derived, and no $ (no usd_hr). The 64/96-rank failures have no surviving artifact: the rows carry the
# README's claim, not a file. results/legible-r5/ (the 2026-09-07 recipe run) is check evidence
# only (the rank-count guard), not a run row: its box is not recorded either.
schema = 2
result_unit = "one GPAW SCF energy of 64-atom bulk Si (PW 400 eV, LDA, 4x4x4 MP)"

[workload]
size = { atoms = 64, kpoints = 64, bands = 158 }
note = "2x2x2 supercell of the 8-atom conventional cell; 4 irreducible k-points; OMP_NUM_THREADS=1 throughout"

[timing]
wall = "timing.txt WALL_SEC (the script's own timer; the script was not kept)"

[[series]]
id = "ranks"
axis = "workers"
held = ["image", "family", "size"]
equal_work = "rank-independent-energy"
attribution = "same-binary"
verdict = { shape = "wall", at = 48, through = 96, on = "wall" }
note = "618.0 s -> 22.3 s, 27.7x at 48 ranks (58% efficiency); the 64- and 96-rank failures are the session record's and the sizing page's account, with no artifact here"

[[dataset]]
id = "bulk Si 2x2x2 supercell built in-script (ASE 3.29.0), GPAW's bundled Si.LDA setup"
tier = "built"
unpinned = "the input script was written to /tmp in the session and not kept; the system is fully described by results/legible-r5/gpaw-8.log"

