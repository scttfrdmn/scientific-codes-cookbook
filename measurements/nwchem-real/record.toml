# measurements/nwchem-real/record.toml -- one family (c8g), three experiments: rank sweep,
# right-sized boxes, packing. The README prices nothing, so no $ fields.
schema = 1
result_unit = "one caffeine B3LYP/6-31G* single-point energy (217 basis functions)"

[[dataset]]
id = "caffeine (24 atoms) at B3LYP/6-31G*, geometry and basis inline in the spec"
tier = "built"
from_recipe = "nwchem"
note = "nothing staged: the molecule is the spec; basis sets ship in the env"

