# --- checks: asserted on every rung (results/*.txt) --------------------------------------
[[check]]
id = "rank-count"
claim = "nproc read from NWChem's own output equals the rank count launched"
kind = "rank-count"
bound = "== ranks launched"
observed = "1, 2, 4, 8, 16"
outcome = "pass"

[[check]]
id = "basis-functions"
claim = "217 basis functions, from NWChem, not from the input file"
kind = "identity"
bound = "217"
observed = "217"
outcome = "pass"

[[check]]
id = "converged"
claim = "SCF reached an energy (a converged exit, not a parsed number from a dead run)"
kind = "sentinel"
observed = "yes"
outcome = "pass"

[[check]]
id = "serial-eq-4rank"
claim = "serial and 4-rank agree"
kind = "invariance"
bound = "< 1e-6 Ha"
observed = "|−625.538048227205 − −625.538048181779| = 4.54e-08 Ha"
outcome = "pass"

[[check]]
id = "dft-energy"
claim = "dft_energy (B3LYP/6-31G*, caffeine)"
kind = "band"
bound = "-625.538048 +/-1e-5"
observed = "-625.538048227205 Ha"
outcome = "pass"

[[check]]
id = "packing-contention"
claim = "each job inside a packed set vs the same R alone on a right-sized box"
kind = "reported"
observed = "within 0.0–6.5%"
outcome = "reported"

[[check]]
id = "packing-cores-busy"
claim = "16 cores busy in all five packing configurations (the evidence the binding worked)"
kind = "reported"
observed = "avg_cores 14.96–15.87"
outcome = "reported"

[[trap]]
id = "nwchem-concurrent-mpiexec-binding"
scope = "tool"
symptom = "no error: eight concurrent 2-rank jobs pile all sixteen ranks onto cores 0 and 1 while fourteen cores sit idle, and the wall time collapses"
blames = "packing contention ('packing contends, as expected')"
cause = "each concurrent mpiexec believes it owns the machine and binds rank k to core k"
fix = "mpiexec --bind-to none; check avg_cores"

