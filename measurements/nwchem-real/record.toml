# measurements/nwchem-real/record.toml -- one family (c8g), three experiments: rank sweep,
# right-sized boxes, packing. The README prices nothing, so no $ fields (and no billed basis).
# Schema 2: three series (rank sweep on one box, right-sized boxes, packing J x R at 16 cores).
# The 16-rank rank-sweep and right-sized rows are one configuration run twice (attempt r1/r2).
schema = 2
result_unit = "one caffeine B3LYP/6-31G* single-point energy (217 basis functions)"

[[dataset]]
id = "caffeine (24 atoms) at B3LYP/6-31G*, geometry and basis inline in the spec"
tier = "built"
from_recipe = "nwchem"
note = "nothing staged: the molecule is the spec; basis sets ship in the env"

[workload]
size = { basis_functions = 217 }
note = "one caffeine B3LYP/6-31G* SCF to -625.538048 Ha; OMP_NUM_THREADS=1 throughout, nothing staged"

[timing]
wall = "the NWChem run(s), timed in-task; for a packed row, wall for all J concurrent jobs"

[[series]]
id = "rank-sweep"
axis = "workers"
held = ["instance", "image", "size"]
equal_work = "dft-energy"
attribution = "same-binary"
note = "5.33x at 16 ranks, 33.3% efficiency; the marginal return per doubling rises (1.28 -> 1.71) while efficiency falls. The README calls the knee-at-16 reading defensible but the wrong question (see packing)"

[[series]]
id = "rightsized"
axis = "workers"
held = ["family", "image", "size"]
equal_work = "dft-energy"
attribution = "same-binary"
note = "ranks matched to the box: 95-98.5% core utilisation, except 1 rank on 2 vCPU (50.0%, no 1-vCPU box); utilisation is the wrong metric"

[[series]]
id = "packing"
axis = "concurrent"
held = ["instance", "image", "size", "workers"]
equal_work = "dft-energy"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 16, on = "throughput" }
note = "J jobs x R ranks on 16 cores, --bind-to none: per calculation 25.00 -> 9.19 s, 2.72x the 1x16 throughput; each job within 0.0-6.5% of its cost alone. wall_s is for all J jobs"

