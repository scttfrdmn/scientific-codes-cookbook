# measurements/polish-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "one polish of the whole E. coli CFT073 Flye draft from ERR12813217 (racon or medaka; the README prices each step separately)"

[[dataset]]
id = "ENA ERR12813217 (PRJEB51164, E. coli CFT073 R10.4.1, Dorado 0.5.3 sup@v4.3.0), dumped from the AWS Open Data .sra"
tier = "roda"
pins = "pins.sha256"
note = "ERR12813217.sra and the dumped FASTQ; read/base counts checked against ENA's (397,033 / 2,544,407,444)"

[[dataset]]
id = "Sanderson et al. 2024 Trycycler reference + paper's Flye+Medaka 100x assembly, figshare 10.6084/m9.figshare.25472167.v1"
tier = "durable-id"
pins = "results/graviton4-once/fetched/data.sha256"

[[dataset]]
id = "medaka r1041_e82_400bps_sup_v4.3.0_model_pt.tar.gz from medaka's repository at v2.2.2"
tier = "versioned-release"
pins = "pins.sha256"

[[dataset]]
id = "Flye draft.fa + minimap2 ov.paf, built once on Graviton4"
tier = "built"
pins = "pins.sha256"

