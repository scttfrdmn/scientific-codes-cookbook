[[check]]
id = "read-counts"
claim = "reads == ENA's read_count / base_count"
kind = "reference"
bound = "the dump of RODA's .sra is the whole run"
observed = "397,033 / 2,544,407,444"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "flye-completed"
claim = "Flye completed"
kind = "sentinel"
bound = "INFO: Final assembly: in its log"
observed = "1 circular contig, 5,236,920 bp, 504×"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "medaka-completed"
claim = "medaka completed"
kind = "sentinel"
bound = "Polished assembly written to in its log"
observed = "1 contig"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "scorer-planted"
claim = "scorer: 1,000 substitutions + 100 deletions planted in the truth score exactly 1,100"
kind = "identity"
bound = "the metric is exact edit distance, so a planted count is recovered exactly"
observed = "1,100 (1,000 / 0 / 100)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "scorer-rotation"
claim = "scorer: the truth rotated by 1,234,567 bp and reverse-complemented scores 0"
kind = "invariance"
bound = "a circular genome has no fixed start or strand"
observed = "0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "chromosome-placed"
claim = "every assembly has a contig for the chromosome"
kind = "identity"
bound = "minimap2 asm5 places it"
observed = "4/4"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "medaka-improves"
claim = "medaka: fewer errors than the draft"
kind = "reference"
bound = "the polisher's job"
observed = "10 vs 27"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "racon-improves"
claim = "racon: fewer errors than the draft"
kind = "reference"
bound = "the recipe's claim"
observed = "FAILS: 411 vs 27"
outcome = "fail"
across_chips = "identical"

[[check]]
id = "score-draft"
claim = "Flye draft vs the Trycycler truth: errors, Q"
kind = "reported"
observed = "27 errors, Q 52.9"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "score-racon"
claim = "racon, one round vs the Trycycler truth: errors, Q"
kind = "reported"
observed = "411 errors, Q 41.1"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "score-medaka"
claim = "medaka vs the Trycycler truth: errors, Q"
kind = "reported"
observed = "10 errors (1 / 4 / 5), Q 57.2"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "score-paper"
claim = "the paper's own Flye + Medaka, 100× vs the Trycycler truth"
kind = "reported"
observed = "599 errors, Q 39.4"
outcome = "reported"

[[check]]
id = "consensus-bytes"
claim = "racon.fa and medaka.fa, Intel and AMD vs Graviton4"
kind = "reported"
observed = "byte-identical"
outcome = "reported"
across_chips = "identical"

[[cross_code]]
with = "published:doi:10.6084/m9.figshare.25472167.v1"
same_bytes = false
metric = "exact Levenshtein distance to the paper's Trycycler reference (built from R9.4.1 + Illumina reads, not these)"
check = "medaka-improves"

[[trap]]
id = "polish-racon-worsens-flye"
scope = "method"
symptom = "racon: fewer errors than the draft FAILS: 411 vs 27"
blames = "racon or the chip"
cause = "Flye already polishes its own assembly; one default racon round on reads this accurate undoes some of that (234 bp shorter, +384 errors); the plasmid fixture's infix metric did not penalise a short output"
fix = "run medaka on a Flye assembly, not racon"

[[trap]]
id = "polish-medaka-task-failed-state"
scope = "method"
symptom = "spawn records each 04-medaka task as failed"
blames = "medaka"
cause = "score.py exits 1 on the racon claim, after medaka's own checks have passed"
fix = "none: the failure is the finding, so the spec keeps the assertion"

[[trap]]
id = "polish-medaka-model-not-bundled"
scope = "image"
symptom = "the image bundles only hac_v6.0.0 and sup_v5.2.0"
cause = "the basecaller-matched r1041_e82_400bps_sup_v4.3.0 model is not in the image"
fix = "00-fetch stages it from medaka's repository at v2.2.2, pinned by sha256, and medaka is given the file"

[[trap]]
id = "polish-ena-ftp-drop"
scope = "data"
symptom = "ENA's FTP served 1.1 GB in 38 minutes and then dropped the connection"
cause = "ENA FTP throughput/connection limits"
fix = "dump the reads from the AWS Open Data .sra and check counts against ENA's"
