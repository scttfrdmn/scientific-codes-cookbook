# measurements/polish-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: every billed figure is spawn's completion window (results/billed-windows.txt). Per chip,
# 03-racon + 04-medaka share attempt r1, so the generator sums them to the README's "billed $ (both)"
# (0.1068 / 0.1163 / 0.0984). The once-only draft and overlap carry their own task windows and no
# attempt: they are shared by every chip, not part of one chip's polish.
schema = 2
result_unit = "one polish of the whole E. coli CFT073 Flye draft from ERR12813217 (racon or medaka; the README prices each step separately)"

[workload]
size = { reads = 397033, bases = 2544407444, genome_bp = 5236926 }
note = "a whole R10.4.1 GridION run (486x) of one isolate; Flye drafts once on Graviton4, every chip then polishes the same draft from the same reads and overlaps"

[timing]
wall = "the tool's own wall in-task (flye / minimap2 / racon / medaka_consensus)"
billed_basis = "spawn-task"

[[series]]
id = "chip-racon"
axis = "chip"
held = ["input", "workers", "layout", "generation"]
equal_work = "consensus-bytes"
attribution = "same-version-other-build"
attribution_note = "aarch.bio's builds on Graviton4, bioconda's on Intel and AMD; Intel's 8 vCPUs are 4 cores with SMT"

[[series]]
id = "chip-medaka"
axis = "chip"
held = ["input", "workers", "layout", "generation"]
equal_work = "consensus-bytes"
attribution = "same-version-other-build"
attribution_note = "torch runs OpenBLAS (neoversev2) on Graviton4 and MKL with AVX512 dispatch on both x86 chips; medaka gives PyTorch 2 intra-op threads at -t 8; Intel's 8 vCPUs are 4 cores with SMT"

[[dataset]]
id = "ENA ERR12813217 (PRJEB51164, E. coli CFT073 R10.4.1, Dorado 0.5.3 sup@v4.3.0), dumped from the AWS Open Data .sra"
tier = "roda"
pins = "pins.sha256"
note = "ERR12813217.sra and the dumped FASTQ; read/base counts checked against ENA's (397,033 / 2,544,407,444)"

[[dataset]]
id = "Sanderson et al. 2024 Trycycler reference + paper's Flye+Medaka 100x assembly, figshare 10.6084/m9.figshare.25472167.v1"
tier = "durable-id"
pins = "results/graviton4-once/fetched/data.sha256"

[[dataset]]
id = "medaka r1041_e82_400bps_sup_v4.3.0_model_pt.tar.gz from medaka's repository at v2.2.2"
tier = "versioned-release"
pins = "pins.sha256"

[[dataset]]
id = "Flye draft.fa + minimap2 ov.paf, built once on Graviton4"
tier = "built"
pins = "pins.sha256"

