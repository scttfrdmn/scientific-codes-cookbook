task = "01-draft"
instance = "m8g.2xlarge"
purpose = "primary"
results = "results/graviton4-once/draft/"
host = "results/graviton4-once/draft/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 8
ranks = 1
threads_per_rank = 8
billed_s = 1416
billed_usd = 0.1412
avg_cores = 4.08
wall_s = 1343
usd_hr = 0.3590
compute_usd = 0.134
peak_gib = 4.75
peak_kind = "rss"
note = "Flye draft, run once and shared by every chip's polish (its $ is the draft's, not a polish); README prints billed $0.141, the task window is 1,416 s (results/billed-windows.txt)"

[[run]]
