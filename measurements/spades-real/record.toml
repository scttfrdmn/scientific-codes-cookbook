# measurements/spades-real/record.toml -- #118 backfill.
schema = 1
result_unit = "one whole-isolate assembly: DRR171213 (E. coli K-12 MG1655, 760,683 MiSeq 2x300 pairs) with spades.py --isolate"

[[dataset]]
id = "DRR171213 (PRJDB8030, library Ecoli_MG1655_NN), RODA .sra converted to FASTQ.gz by 00-prep"
tier = "roda"
pins = "pins.sha256"
note = "the .sra and both FASTQ.gz are pinned; pair and base counts checked against ENA read_count / base_count"

[[dataset]]
id = "RefSeq GCF_000005845.2 (U00096.3, 4,641,652 bp)"
tier = "durable-id"
pins = "pins.sha256"
note = "md5 checked against NCBI's md5checksums.txt (results/prep/ncbi-md5checksums.txt)"

[[run]]
instance = "c8g.2xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-18"
date_source = "git"
workers = 8
wall_s = 1182
billed_s = 1242
usd_hr = 0.319
compute_usd = 0.1047
billed_usd = 0.1101
peak_gib = 4.39
note = "peak is cgroup anon (README 'peak RSS'; SPAdes logs 4,641 MB); cgroup memory.peak 10.8 GiB counts work-dir page cache, so peak_kind is unset. Work dir peaked 18.2-18.4 GB on the root disk"

[[run]]
instance = "c8i.2xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-18"
date_source = "git"
workers = 8
wall_s = 1057
billed_s = 1109
usd_hr = 0.3748
compute_usd = 0.1101
billed_usd = 0.1155
peak_gib = 4.39
note = "bioconda SPAdes 4.3.0; peak as on Graviton4 (cgroup anon)"

[[run]]
instance = "c8a.2xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-18"
date_source = "git"
workers = 8
wall_s = 1023
billed_s = 1066
usd_hr = 0.4311
compute_usd = 0.1225
billed_usd = 0.1276
peak_gib = 4.39
note = "bioconda SPAdes 4.3.0; peak as on Graviton4 (cgroup anon)"

# --- checks: '## What held at scale, on all three chips' -----------------------------
[[check]]
id = "staged-reads"
claim = "staged reads"
kind = "identity"
bound = "pairs == ENA read_count, bases == ENA base_count"
observed = "760,683 / 450,083,225"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "reference-md5"
claim = "reference"
kind = "pin"
bound = "md5 == NCBI's md5checksums.txt; one 4,641,652 bp sequence"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "completion"
claim = "completion"
kind = "sentinel"
bound = "spades.py exit 0 and SPAdes pipeline finished in spades.log"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "genome-fraction"
claim = "genome fraction"
kind = "reference"
bound = "≥ 95% of U00096.3 (QUAST)"
observed = "98.599%"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mismatch-indel-rate"
claim = "mismatches / indels per 100 kbp"
kind = "reference"
bound = "≤ 10 each"
observed = "1.11 / 0.17 (51 mismatches, 8 indels)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "total-length"
claim = "total length (≥ 500 bp)"
kind = "reference"
bound = "within 5% of 4,641,652"
observed = "4,589,418"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "contigs-byte-identical"
claim = "contigs.fasta"
kind = "identity"
bound = "byte-identical on all three chips"
observed = "fa4a10ef… on all three, 1 distinct"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "assembly-stats"
claim = "Also observed, not asserted: contigs, N50, NGA50, misassemblies"
kind = "reported"
observed = "228 contigs (83 ≥ 500 bp), N50 178,400, NGA50 176,019, 2 misassemblies"
outcome = "reported"
across_chips = "identical"

[[cross_code]]
with = "published:RefSeq-GCF_000005845.2"
same_bytes = false
metric = "QUAST genome fraction, mismatches and indels per 100 kbp, total length against the closed MG1655 reference"
tolerance_basis = "loose on purpose: a resequenced MG1655 lab stock is not the 1997 reference strain"
check = "genome-fraction"

[[trap]]
id = "spades-workdir-overflows-tmpfs"
scope = "platform"
symptom = "No space left on device (SPAdes fails at K77)"
cause = "the work directory peaks at 18.2-18.4 GB (per-k graphs and k-mer index spill), four times SPAdes' RAM, against the 8 GiB /tmp tmpfs of a 16 GiB box"
fix = "put -o on the container's root disk (disk_gib: 60) and keep /tmp for staging"
