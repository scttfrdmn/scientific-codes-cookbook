# measurements/metaphlan-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
# The README prices billed $ for the whole two-sample task and compute $ per sample (even / log),
# with no per-sample bill. The record's unit is the task; per-sample compute $ are in each run's note.
result_unit = "the two-sample task: ERR2984773 (D6300 even) and ERR2935805 (D6310 log) profiled one after the other on one box"

[[dataset]]
id = "RODA s3://sra-pub-run-odp/sra/{ERR2984773,ERR2935805} (ENA PRJEB29504, Nicholls et al. 2019 ZymoBIOMICS D6300 / D6310 shotgun runs), dumped to FASTQ by 00-prep"
tier = "roda"
pins = "pins.sha256"
note = ".sra objects, the FASTQ.gz dumps and the reads >= 70 bp counts are all pinned"

[[dataset]]
id = "MetaPhlAn mpa_vJun23_CHOCOPhlAnSGB_202403 markers + bowtie2 index"
tier = "versioned-release"
pins = "pins.sha256"
from_recipe = "metaphlan"

[[dataset]]
id = "Zymo truth tables: zymo_d6300.tsv (the recipe's) and zymo_d6310.tsv (Zymo's D6310 composition, with must_detect)"
tier = "built"
pins = "pins.sha256"

[[run]]
instance = "r8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-18"
date_source = "git"
workers = 16
wall_s = 1313
billed_s = 1658
usd_hr = 0.9426
billed_usd = 0.4341
peak_gib = 22.2
peak_kind = "rss"
note = "even 338 s / log 975 s; compute $/sample 0.0885 / 0.2553 (README cell); task compute $ not printed, so compute_usd omitted"

[[run]]
instance = "r8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-18"
date_source = "git"
workers = 16
wall_s = 1352
billed_s = 1687
usd_hr = 1.1114
billed_usd = 0.5208
peak_gib = 22.2
peak_kind = "rss"
note = "even 347 s / log 1,005 s; compute $/sample 0.1071 / 0.3103; bowtie2 ran its baseline build (no x86-64-v3)"

[[run]]
instance = "r8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-18"
date_source = "git"
workers = 16
wall_s = 934
billed_s = 1163
usd_hr = 1.2781
billed_usd = 0.4129
peak_gib = 22.2
peak_kind = "rss"
note = "even 248 s / log 686 s; compute $/sample 0.0880 / 0.2435; bowtie2 ran its baseline build (no x86-64-v3)"

# checks: the README's "What held at scale, on all three chips" rows; observed = the even cell
[[check]]
id = "reads-processed"
claim = "reads processed == reads ≥ 70 bp in the FASTQ"
kind = "conservation"
observed = "17,571,462"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "ena-counts"
claim = "FASTQ pairs and bases == ENA's `read_count`, `base_count`"
kind = "reference"
observed = "yes"
outcome = "pass"

[[check]]
id = "abundance-sum"
claim = "`UNCLASSIFIED` + kingdoms == 100"
kind = "conservation"
bound = "tol 1.5e-6 (the printed rounding of the summed terms)"
observed = "100.000001 (tol 1.5e-6)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "clade-sums"
claim = "every clade == the sum of its children"
kind = "conservation"
bound = "half a unit in the last place, per term"
observed = "42 parents, worst 1e-6"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "required-species"
claim = "**required Zymo species detected**"
kind = "reference"
observed = "8/8 bacteria (even); 2/2 (89.1%, 8.9%) (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "unexpected-species"
claim = "**unexpected species above 1%**"
kind = "reference"
bound = "0"
observed = "0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "bowtie2-hits"
claim = "Each run's bowtie2 hits, sorted, are byte-identical on all three chips"
kind = "identity"
observed = "840,789 marker hits (even) and 1,968,073 (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "profile-bytes"
claim = "Every profile value is identical"
kind = "reported"
observed = "even body byte-identical on all three; log: AMD lists the merged S. cerevisiae clade's two additional_species in the other order; score.tsv byte-identical everywhere"
outcome = "reported"
across_chips = "identical"

[[trap]]
id = "metaphlan-mislabelled-mock"
scope = "data"
symptom = "A sample titled \"zymo mock community\" was not one: ERR12710526 profiles to a gut-like community, 15 species above 1%, and only E. coli of the D6300 eight"
cause = "all 18 runs in study PRJEB73321 carry the same title"
fix = "confirm the product number from its paper before you use a defined mixture as truth"

[[trap]]
id = "metaphlan-bowtie2-x86-baseline"
scope = "image"
symptom = "Failed to launch x86-64-v3 version, staying with default"
cause = "bioconda's x86 bowtie2 falls back to its baseline build, so neither x86 chip ran bowtie2's AVX2 build"
fix = "none applied; the cross-chip comparison is of builds as well as chips"
