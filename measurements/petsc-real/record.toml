# measurements/petsc-real/record.toml -- #118 backfill.
# Schema 2: billed is the EC2 window, CloudTrail RunInstances -> Terminate (README: "Billed is EC2
# launch to termination"), reproduced to within 1 s in results/billed-windows.txt.
schema = 2
result_unit = "all six SuiteSparse matrices, each solved four ways (MUMPS LDLT, SuperLU_DIST LU, CG+GAMG, CG+BoomerAMG) and checked"

[workload]
size = { matrices = 6 }
note = "six SuiteSparse SPD matrices (0.53-1.59 M rows, 3.7-77.7 M nonzeros), each solved by MUMPS LDLT, SuperLU_DIST LU, CG+GAMG and CG+BoomerAMG under 16 MPI ranks; BoomerAMG on audikw_1 is 45-59% of the tool wall"

[timing]
wall = "the six mpiexec solves, including the matrix load; the serial conversion (19-28 s) is not counted"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "layout", "size", "generation"]
equal_work = "cross-chip-integers"
attribution = "same-version-other-build"
attribution_note = "the recipe's aarch.science fem-cfd image on Graviton4, the env's linux-64 twin (petsc 3.25.5, MUMPS 5.8.2, SuperLU_DIST 9.2.1, hypre 3.2.0) on Intel and AMD; OpenBLAS picks neoversev2 on Graviton4, Cooperlake on both x86 chips"

[[not_swept]]
axis = "workers"
reason = "One rank count (16), one rtol (1e-8), one planted solution. No knee sweep. Rank and thread scaling for a sparse solve is a separate measurement from this one."

[[dataset]]
id = "SuiteSparse Matrix Collection ids 1853 parabolic_fem, 1423 apache2, 1883 ecology2, 1403 thermal2, 1421 G3_circuit, 1252 audikw_1 (Matrix Market archives)"
tier = "durable-id"
pins = "pins.sha256"
note = "fetched once on AWS from the collection's original University of Florida host (the TAMU host refuses AWS downloads since 2026-10-14); kept only if size and entry count match the published values"

[[run]]
id = "chip-r8g"
in = ["chip"]
instance = "r8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 16
ranks = 16
threads_per_rank = 1
wall_s = 585
billed_s = 768
usd_hr = 0.9426
compute_usd = 0.153
billed_usd = 0.201
peak_gib = 99.7
peak_kind = "cgroup-memory.peak"
note = "largest single rank ru_maxrss 18.6-19.0 GiB across chips (audikw_1)"

[[run]]
id = "chip-r8i"
in = ["chip"]
instance = "r8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 16
ranks = 16
threads_per_rank = 1
wall_s = 797
billed_s = 948
usd_hr = 1.1114
compute_usd = 0.246
billed_usd = 0.293
peak_gib = 104.1
peak_kind = "cgroup-memory.peak"
note = "fem-cfd env linux-64 twin; cgroup peak includes the env install"

[[run]]
id = "chip-r8a"
in = ["chip"]
instance = "r8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 16
ranks = 16
threads_per_rank = 1
wall_s = 490
billed_s = 582
usd_hr = 1.2781
compute_usd = 0.174
billed_usd = 0.207
peak_gib = 103.5
peak_kind = "cgroup-memory.peak"
note = "fem-cfd env linux-64 twin; cgroup peak includes the env install"

# --- checks: '## What held at scale' (worst over 6 matrices x 3 chips) ---------------
[[check]]
id = "matrix-shape"
claim = "rows and nonzeros equal the collection's published values"
kind = "reference"
observed = "6 of 6 exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mpi-ranks"
claim = "PETSc reports 16 ranks"
kind = "rank-count"
bound = "== 16"
observed = "16"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mumps-inertia"
claim = "MUMPS LDLᵀ inertia is (0, 0, n)"
kind = "identity"
bound = "(0, 0, n)"
observed = "(0, 0, n) on all 18"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "backward-stable"
claim = "both factorizations backward stable: ‖b−Ax‖₁ / (‖A‖₁‖x‖₁ε) < 30"
kind = "band"
bound = "< 30 (LAPACK dpot02/dget02 threshold)"
observed = "0.614"
outcome = "pass"

[[check]]
id = "cg-residual"
claim = "CG's converged reason > 0 and the recomputed ‖b−Ax‖/‖b‖ ≤ 1e-8"
kind = "band"
bound = "≤ 1e-8"
observed = "9.67e-9"
outcome = "pass"

[[check]]
id = "direct-vs-planted"
claim = "The two direct codes land within 9.0e-12 of x* and within 1.7e-11 of each other"
kind = "reported"
observed = "9.0e-12; 1.7e-11"
outcome = "reported"

[[check]]
id = "cross-chip-integers"
claim = "The integers are identical: ranks, rows, nonzeros and all six inertias."
kind = "identity"
observed = "identical"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "cross-chip-fixed-point"
claim = "Every solve is the same fixed point: |x_A·w − x_B·w| ≤ (‖x_A−x*‖ + ‖x_B−x*‖)‖w‖"
kind = "band"
bound = "ratio ≤ 1"
observed = "worst ratio 1.3e-3 (direct, thermal2 MUMPS), 2.4e-7 (CG, ecology2 BoomerAMG)"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "worst ratio to the forward-error bound 1.3e-3 for the direct solves and 2.4e-7 for CG; BoomerAMG byte-identical Intel vs AMD on all six"

[[check]]
id = "krylov-iterations"
claim = "Every Krylov iteration count is identical on all three chips, audikw_1's 830 and 1,401 included."
kind = "reported"
observed = "830 (GAMG), 1,401 (BoomerAMG) on audikw_1"
outcome = "reported"
across_chips = "identical"

[[trap]]
id = "petsc-boomeramg-defaults-indefinite"
scope = "tool"
symptom = "KSP_DIVERGED_INDEFINITE_PC at iteration 2 (CG + BoomerAMG on audikw_1, PETSc defaults)"
cause = "BoomerAMG's PETSc defaults break CG on the 3-D elasticity matrix; neither smoother nor coarsening change alone fixes it"
fix = "an 'elasticity' profile: l1-scaled hybrid SOR smoothing together with HMIS coarsening, ext+i interpolation and strong threshold 0.7 (found by hypre_probe.py over seven settings)"
cost = "the first Graviton4 run failed as designed, plus the probe"
refs = ["results/hypre-probe.txt"]

[[trap]]
id = "petsc-suitesparse-tamu-refuses-aws"
scope = "data"
symptom = "the collection's Texas A&M file host has refused every download since 2026-10-14 (the first fetch hit the 403)"
cause = "the host's notice blames excessive downloads from jobs on AWS"
fix = "fetch each archive once from the original University of Florida host, check size and entry count against the published values, read the bucket copy thereafter"
cost = "one failed fetch"

[[trap]]
id = "petsc-mpiexec-eats-stdin"
scope = "tool"
symptom = "mpiexec consumed the matrix list on stdin"
cause = "mpiexec forwards its stdin to rank 0, so the first mpiexec swallows the rest of the matrix list and the loop ends after one matrix, exit 0 (run.sh comment)"
fix = "every command in the loop reads /dev/null"
cost = "found by a Graviton4 sizing run"

[[trap]]
id = "petsc-mumps-inertia-icntl24"
scope = "tool"
symptom = "no parallel inertia from MUMPS"
cause = "PETSc needs ICNTL(13)=1 and ICNTL(24)=1 for MUMPS to give a parallel inertia"
fix = "set ICNTL(13)=1 and ICNTL(24)=1 on the MUMPS Cholesky solver"
cost = "found by a Graviton4 sizing run"
