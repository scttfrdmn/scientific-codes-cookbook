# --- checks: '## The identities, at scale, on all three chips' (claim = observable, bound = assertion)

[[check]]
id = "query-pin"
claim = "query, labels"
kind = "pin"
bound = "sha256 == task 00's pin"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "nextclade-dataset-pin"
claim = "Nextclade dataset"
kind = "pin"
bound = "sha256 == the recipe's pin; tag self-reported"
observed = "`2026-09-07--17-10-15Z`"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "rows"
claim = "rows"
kind = "identity"
bound = "**one per genome, no repeats**, both tools, both runs"
observed = "100,000 / 2,000"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "versions"
claim = "versions"
kind = "pin"
bound = "**pangolin 4.4, `PUSHER-v1.38` on every row**"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "usher-histogram"
claim = "UShER histogram"
kind = "conservation"
bound = "**`L(a/b)` counts sum to b, call is in it, `conflict == (b−a)/b`**"
observed = "101,949 rows, 0 violations"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "qc-unassigned"
claim = "QC"
kind = "identity"
bound = "**fail ⇒ `Unassigned`**"
observed = "51 fails, all Unassigned"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "is-designated"
claim = "`is_designated`"
kind = "identity"
bound = "**== the aligned-sequence md5 is in pangolin-data's `lineages.hash.csv`**"
observed = "exactly the 96,540"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "batch-thread-invariance"
claim = "**batch + thread invariance**"
kind = "invariance"
bound = "first 2,000 alone at 1 thread **== their rows** in the 100k run at 8"
observed = "identical, both tools"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "nextclade-totals"
claim = "Nextclade totals"
kind = "conservation"
bound = "**== its own lists**: subs, dels, ins, missing, non-ACGTN, unknown aa, aa subs/dels, private = rev + labeled + unlabeled"
observed = "100,000 rows, 0 violations"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "nextclade-coverage"
claim = "Nextclade coverage"
kind = "identity"
bound = "**== (end − start + 1 − missing − nonACGTN) / 29903, bit for bit**"
observed = "100,000 rows"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "alias-tables"
claim = "alias tables"
kind = "identity"
bound = "**v1.38 (image) ⊆ v1.41, unchanged**"
observed = "561 of 561"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "pangolin-vs-designation"
claim = "**pangolin vs designation**"
kind = "reference"
bound = "**hierarchy-compatible ≥ 0.95**"
observed = "**0.99755** (exact 0.97986)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "nextclade-vs-pangolin"
claim = "Nextclade vs pangolin"
kind = "cross-code"
bound = "hierarchy-compatible ≥ 0.80 (the recipe's floor)"
observed = "0.99696 (exact 0.93247)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "nextclade-vs-designation"
claim = "Nextclade vs designation"
kind = "reported"
bound = "observation"
observed = "0.99565 (exact 0.92505)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "hash-label-vs-designation"
claim = "hash table's label vs `lineages.csv`"
kind = "reported"
bound = "observation"
observed = "0.99994 (exact 0.99940)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "cross-chip-identical"
claim = "pangolin's whole report (every column of all 100,000 rows), the 2,000-genome run, and Nextclade's whole TSV (every column, all 100,000 rows) have the same canonical sha256 on Graviton4, Intel and AMD. So do all eight agreement tables"
kind = "identity"
observed = "[identical]"
outcome = "pass"
across_chips = "identical"

[[trap]]
id = "lineage-usher-sampled-ompi"
scope = "image"
symptom = "usher-sampled is not installed"
blames = "a missing usher-sampled binary"
cause = "the image's `usher-sampled` is linked against Open MPI, whose singleton start-up aborts when no `ssh`/`rsh` exists, which is true in the container; pangolin's `usher-sampled --help` probe fails and it falls back to the original `usher`"
fix = "export OMPI_MCA_plm_rsh_agent=false; pangolin.sh fails if the message appears"
cost = "the 2,000 genomes took 1,688 s that way and 43 s with the variable set; $0.33 of the $1.10 spend"

[[trap]]
id = "lineage-usher-runs-twice"
scope = "image"
symptom = "the `usher_to_report` rule prints `usher_inference`'s shell output and takes as long as it did, on every chip and in every run"
cause = "fits UShER being executed twice under this image's snakemake 9.23 (not established)"
fix = "none: reported here, not worked around"

[[trap]]
id = "lineage-designation-cache-lookup"
scope = "tool"
symptom = "96,540 genomes (96.5%) are byte-identical, after alignment, to the designated sequence, and pangolin's default mode would just return the label from its hash table"
cause = "pangolin's designation cache answers designated sequences by lookup, so scoring against designations tests the lookup, not the caller"
fix = "--skip-designation-cache"

[[trap]]
id = "lineage-memory-peak-page-cache"
scope = "platform"
symptom = "The container's `memory.peak` reached 27–28 GiB"
blames = "pangolin's memory use"
cause = "almost all page cache for the GB-scale intermediates on the root disk; pangolin's largest process peaks at 4–5 GiB"
fix = "size by the process RSS, not memory.peak (smaller boxes were not tried)"
