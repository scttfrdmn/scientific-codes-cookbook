tier = "versioned-release"
pins = "results/choose/inputs.sha256"

[[dataset]]
id = "Nextstrain open INSDC release 2026-10-17 (s3://nextstrain-data, by S3 object version): sequences.fasta.zst, metadata.tsv.zst, cog_uk_accessions.tsv.zst"
tier = "durable-id"
pins = "results/choose/inputs.sha256"

[[dataset]]
