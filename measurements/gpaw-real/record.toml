# --- checks: the in-task asserts in results/ and the invariance the README states --------
[[check]]
id = "decomposition-invariance"
claim = "energy_spread_eV want < 0.0001 (decomposition invariance)"
kind = "invariance"
bound = "< 0.0001"
observed = "0.000000"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "All six x86 runs converge in 27 iterations to −219.541414 eV. That is the Graviton number to every printed decimal"

[[check]]
id = "ranks"
claim = "ranks_used want 16  (gpaw.mpi.world.size, not a serial fallback)"
kind = "rank-count"
bound = "== ranks launched"
observed = "16"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "atoms"
claim = "atoms want 36"
kind = "identity"
bound = "36"
observed = "36"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "scf-converged"
claim = "scf_iterations (present only on a converged exit)"
kind = "sentinel"
observed = "27"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "energy"
claim = "Every run below converges in 27 SCF iterations to −219.541414 eV with a Fermi level of 2.050224 eV"
kind = "reported"
observed = "-219.541414"
outcome = "reported"
across_chips = "fixed-point"
across_chips_evidence = "−219.541414 eV on Graviton4, Intel and AMD, rank-sweep spread 0.000000 eV"

[[check]]
id = "control-16-ranks"
claim = "The 16-rank row is the control ... they land 2.2% apart"
kind = "reported"
observed = "452.2 s vs 442.5 s"
outcome = "reported"

[[trap]]
id = "gpaw-resized-box-scaling"
scope = "method"
symptom = "4 → 16 speedup 3.27× (81.7%) on right-sized boxes against 2.71× (67.8%) on the same box"
blames = "parallel scaling"
cause = "a scaling study that resizes the instance at each rung is not measuring scaling: four ranks on a 16-vCPU box get the bandwidth of twelve idle cores (+17.9%)"
fix = "Hold the box fixed, or report both"

[[trap]]
id = "gpaw-intel-smt-ranks"
scope = "platform"
symptom = "On Intel, ranks 9–16 buy nothing: 282.8 s at 8 ranks, 285.9 s at 16"
cause = "the 16-vCPU Intel box is 8 cores x 2 hyperthreads, and this bandwidth-bound SCF gets nothing from the second thread"
fix = "Size by cores, not vCPUs"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "spawn 0.139.1's wrapper leaves under 1 KB of EC2's 16 KiB user data; knee.task.json stages knee.sh (sha256 in pins.sha256)"
