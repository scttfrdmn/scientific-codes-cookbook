# measurements/gpaw-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: no row carries a billed figure; the x86 same-box tasks' spawn windows (one task ran all
# three rank rungs) are in results/billed-windows.txt and are shared by their rows.
schema = 2
result_unit = "one converged SCF (Pt(111) 3x3x4 slab, PW 400 eV, 4x4x1 k, PBE, 36 atoms)"

[workload]
size = { atoms = 36, scf_iterations = 27 }
note = "plane-wave DFT on a periodic slab, MPI over plane waves and k-points; OMP_NUM_THREADS=1"

[timing]
wall = "the SCF wall only"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "workers", "size"]
equal_work = "energy"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "wall" }
note = "2.33x over four generations; Graviton3 -> 4 is the weak step, 1.08x for a higher hourly rate"

[[series]]
id = "samebox-gv4"
axis = "workers"
held = ["image", "instance", "size"]
equal_work = "decomposition-invariance"
attribution = "same-binary"
note = "4 -> 16 is 2.71x (67.8%) on one 16-vCPU box: the scaling number"

[[series]]
id = "rightsized-gv4"
axis = "workers"
held = ["image", "family", "generation", "size"]
equal_work = "energy"
attribution = "same-binary"
note = "4 -> 16 is 3.27x (81.7%) on boxes sized to the ranks: the purchasing number, which includes the bandwidth of idle cores"

[[series]]
id = "samebox-intel"
axis = "workers"
held = ["image", "instance", "size"]
equal_work = "decomposition-invariance"
attribution = "same-binary"
verdict = { shape = "knee", at = 8, through = 16, on = "wall" }
note = "8 cores x 2 hyperthreads: ranks 9-16 buy nothing (282.8 s at 8, 285.9 s at 16); 1.61x (40%) 4 -> 16"

[[series]]
id = "samebox-amd"
axis = "workers"
held = ["image", "instance", "size"]
equal_work = "decomposition-invariance"
attribution = "same-binary"
note = "16 full cores: 2.42x (60.5%) 4 -> 16"

[[series]]
id = "chip-16"
axis = "chip"
held = ["workers", "layout", "size", "generation"]
equal_work = "energy"
attribution = "same-version-other-build"
attribution_note = "the dft env's linux-64 twin, same GPAW 25.7.0 but a different build (OpenBLAS Cooperlake on x86, neoversev2 on Graviton4); the Intel/AMD gap is the chips, the ARM/x86 gap includes the build"
note = "at 16 ranks AMD is 3.0x Graviton4 and 1.9x Intel, and the cheapest SCF measured"

[[dataset]]
id = "Pt(111) 3x3x4 slab, 36 atoms, built by ase in knee.sh"
tier = "built"
pins = "pins.sha256"            # knee.sh (the builder) and host.sh

