# measurements/plink2-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is spawn's completion window (README: "wrapper start to stage-out done") for the
# p19 rows and the AMD p2 row. The Graviton4 and Intel p2 rows print 1,213 / 2,395 s, which matches
# neither their spawn window (1,206 / 2,389 s) nor CloudTrail's (1,246 / 2,447 s): unattributed
# (results/billed-windows.txt). p2 and p19 are separate tasks; p19 is the PLINK 1.9 cross-check.
schema = 2
result_unit = "one genome-wide run of the workflow: 1000 Genomes Phase 3 chr1-22, 2,504 samples, VCF import to PC-adjusted GWAS"

[workload]
size = { variants = 77818345, samples = 2504 }
note = "1000 Genomes Phase 3 chr1-22 (14.6 GB of VCF): VCF import, merge, counts/HWE/missingness, QC, LD pruning, --pca 10 approx, --glm with 10 PCs; the task's awk identity checks over 78 M rows run after"

[timing]
wall = "p2 rows: the union of PLINK 2's own Start/End over its 75 logs (results/toolwall.txt), not the task's awk checks; p19 rows: wall_task"
billed_basis = "spawn-task"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "counts-vs-vcf"
attribution = "same-version-other-build"
attribution_note = "the same PLINK 2 v2.0.0-a.7.8 on all three; the x86 image is bioconda's, with a BusyBox userland that makes the non-PLINK identity checks 1,508 s (Intel) / 1,161 s (AMD) against 446 s on arm64 -- billed, not PLINK 2 wall"

[[dataset]]
id = "RODA s3://1000genomes/release/20130502/ALL.chr{1..22}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.vcf.gz + integrated_call_samples_v3.20130502.ALL.panel (doi:10.1038/nature15393)"
tier = "roda"
pins = "stage-inputs.sh"
note = "the sha256 for all 23 objects are committed inside stage-inputs.sh (not a separate manifest file) and checked on the box; the same objects recipes/plink's real run reads"

