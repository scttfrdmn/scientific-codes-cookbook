# measurements/bismark-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is spawn's completion windows (results/billed-windows.txt). Each per-task row is
# one window; each chip's aggregate row's billed_s is the sum of its four (basis sum-of-tasks). The per-task rows carry `task` but no
# `attempt`, because the aggregate rows (which also carry the tool wall and compute $) are kept.
schema = 2
result_unit = "one whole RRBS sample (ENCFF000LYO) through both aligners and both callers"

[workload]
size = { reads = 31569432, read_length = 36 }
note = "the whole trimmed RRBS run (42,372,813 raw single-end GAIIx reads) against all of GRCh38, through Bismark and bwa-meth, both called by MethylDackel; four single-tool tasks per chip with S3 between them"

[timing]
wall = "the README's tool wall, the main path: Bismark align + extract, sort, bwa-meth align + sort and the three MethylDackel calls; not the --multicore check"
billed_basis = "spawn-task"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "size", "generation"]
equal_work = "bam-records"
attribution = "same-version-other-build"
attribution_note = "aarch.bio's images on Graviton4, bioconda's on Intel and AMD; sort runs on the 2xlarge of each family"

[[dataset]]
id = "ENCODE ENCFF000LYO (GM12878 RRBS replicate 1, ENCSR000DFT), whole run"
tier = "roda"
pins = "pins.sha256"
note = "Illumina 1.5 re-encoded to Phred+33 and trimmed once by prep-trim.sh; the trimmed fastq (31,569,432 reads) is pinned too"

[[dataset]]
id = "GRCh38 no-alt analysis set (195 sequences)"
tier = "versioned-release"
pins = "pins.sha256"
from_recipe = "measurements/minimap2-real"

[[dataset]]
id = "Bismark and bwa-meth GRCh38 indices"
tier = "built"
pins = "results/staging/index.sha256"
note = "built once on arm64 by 00-prep-bismark/00-prep-bwameth; bwa-meth index manifest is results/staging/bwameth-index.sha256"

# Billed $/result is not on these rows: billed covers four tasks, one of them (sort) on m8*.2xlarge
# at a different rate, so a single $/hr cannot reproduce it. The per-task rows below carry it.
[[run]]
id = "chip-m8g"
in = ["chip"]
instance = "m8g.4xlarge"
purpose = "primary"
date = "2026-10-18"
date_source = "git"
host = "results/arm64/bismark/host.txt"
wall_s = 1166
billed_s = 2169
billed_basis = "sum-of-tasks"
usd_hr = 0.7181
compute_usd = 0.2318
results = "results/arm64/"
note = "billed $/result 0.4186 = the sum of the four per-task rows below (sort on m8g.2xlarge). Peak RSS is per step (9.8 / 29.3 / 15.4 GiB), not one run value"

[[run]]
id = "chip-m8i"
in = ["chip"]
instance = "m8i.4xlarge"
purpose = "cross-chip"
date = "2026-10-18"
date_source = "git"
host = "results/x86_64/bismark/host.txt"
wall_s = 1439
billed_s = 2481
billed_basis = "sum-of-tasks"
usd_hr = 0.8467
compute_usd = 0.3374
results = "results/x86_64/"
note = "billed $/result 0.5655 = the sum of the four per-task rows below (sort on m8i.2xlarge)"

[[run]]
