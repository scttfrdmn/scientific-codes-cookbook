# measurements/neuroimaging-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "one subject (NFBS / Enhanced Rockland ses-BAS1 DIFF_137_AP diffusion scan)"
results_per_run = 123

[[dataset]]
id = "s3://fcp-indi/data/Projects/RocklandSample/RawDataBIDSLatest/sub-*/ses-BAS1/dwi/ (the 123 subjects in subjects.txt, 492 files, 9.21 GB)"
tier = "roda"
pins = "dwi.sha256"
note = "the prefix says 'Latest', so the pin is dwi.sha256, computed on AWS by pin.task.json and asserted on every box"

