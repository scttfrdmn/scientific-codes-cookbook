# --- checks: "What held at scale, on all three chips"
[[check]]
id = "subjects-complete"
claim = "all subjects complete, 137 volumes each"
kind = "sentinel"
bound = "123 / 123"
observed = "123 / 123"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "dtifit-fa"
claim = "**DIPY OLS vs `dtifit`, FA** — modes matched (below)"
kind = "cross-code"
bound = "< 1e-6"
observed = "8.508e-08"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "8.508e-08 on all three chips; DIPY FA vs Graviton4 1.2e-11 (OLS), dtifit FA 1.19e-07 (1 float32 ulp)"

[[check]]
id = "dtifit-md-eig"
claim = "DIPY OLS vs `dtifit`, MD (relative) / eigenvalues (÷ MD)"
kind = "cross-code"
bound = "< 1e-6"
observed = "5.959e-08 / 1.501e-07"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "5.959e-08 / 1.501e-07 on all three chips; DIPY MD vs Graviton4 6.3e-16 mm²/s"

[[check]]
id = "planted-tensor"
claim = "**a tensor planted at every brain voxel**, at the subject's real gradient table, recovered to its closed-form FA"
kind = "reference"
bound = "< 1e-10 (OLS and WLS)"
observed = "1.5e-11 / 3.3e-11 (G4); 1.1e-11 / 3.3e-11 (Intel, AMD)"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "OLS 1.5e-11 (G4) vs 1.1e-11 (Intel, AMD), against a 1e-10 bound"

[[check]]
id = "rotation-invariance"
claim = "**FA and MD invariant under rotating the gradient table**"
kind = "invariance"
bound = "< 1e-10"
observed = "FA 1.7e-11, MD 4.1e-13 (G4); 1.6e-11, 2.1e-13 (Intel, AMD)"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "FA 1.7e-11 (G4) vs 1.6e-11 (Intel, AMD); MD 4.1e-13 vs 2.1e-13"

[[check]]
id = "fslmaths-mask"
claim = "`fslmaths -Tmin -bin` mask == numpy's all-volumes-positive mask"
kind = "cross-code"
bound = "identical"
observed = "123 / 123"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "afni-mean"
claim = "AFNI `3dTstat -mean` vs numpy"
kind = "cross-code"
bound = "< 1e-6 relative"
observed = "6.695e-08"
outcome = "pass"
across_chips = "identical"

# --- "Fixed point or path, across chips" (asserted by compare.py, Intel and AMD vs Graviton4)
[[check]]
id = "xchip-mask"
claim = "median-Otsu brain mask"
kind = "identity"
bound = "identical"
observed = "123 / 123 byte-identical"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "xchip-md"
claim = "DIPY MD (OLS / WLS)"
kind = "identity"
bound = "< 1e-12 mm²/s"
observed = "6.3e-16 / 2.8e-15"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Intel and AMD vs Graviton4: 6.3e-16 / 2.8e-15 mm²/s; no DIPY map byte-identical across architectures"

[[check]]
id = "xchip-fa"
claim = "DIPY FA where MD ≥ 1e-4 mm²/s (OLS / WLS)"
kind = "identity"
bound = "< 1e-9"
observed = "1.2e-11 / 7.4e-12"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Intel and AMD vs Graviton4: 1.2e-11 / 7.4e-12; over every voxel 5.6e-9, at MD 1.3e-9 mm²/s"

[[check]]
id = "xchip-dtifit"
claim = "`dtifit` positive mask / FA / L1–L3"
kind = "identity"
bound = "identical / ≤ 1e-6"
observed = "identical / 1.19e-07 (1 float32 ulp) / ≤ 8.9e-08 of max"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "FA 1.19e-07 (1 float32 ulp), L1-L3 ≤ 8.9e-08 of max; Intel and AMD byte-identical in every output"

[[check]]
id = "medians"
claim = "Reported, not asserted: median FA in the mask 0.178 (OLS) / 0.179 (WLS), median MD 7.20e-4 mm²/s"
kind = "reported"
observed = "0.178 / 0.179; 7.20e-4 mm²/s"
outcome = "reported"

[[cross_code]]
with = "recipes/fsl"
same_bytes = true
metric = "max |FA diff|, MD relative, eigenvalues / MD, DIPY OLS vs dtifit, over positive-definite unclipped brain voxels"
tolerance_basis = "16 float32 ulps: dtifit computes FA in single precision and writes float32 maps, and 8.5e-8 is about one ulp"
check = "dtifit-fa"

[[trap]]
id = "neuroimaging-dtifit-signal-floor"
scope = "tool"
symptom = "DIPY vs dtifit max FA difference 2.831e-02 (the naive comparison)"
blames = "one of the two tensor fits"
cause = "dtifit's OLS fits once, estimates S0, raises every sample ≤ 1% of S0 to 1% of S0 and fits again; binds in 20,060 voxels (0.10% of brain, mostly CSF); undocumented, read from dtifit.cc"
fix = "match the 1%-of-S0 signal floor (6.639e-06) and the bvec renormalisation (8.508e-08 with both)"

[[trap]]
id = "neuroimaging-dtifit-no-eigenvalue-clip"
scope = "tool"
symptom = "dtifit reports FA > 1 in 15,907 voxels"
cause = "dtifit does not clip negative eigenvalues; DIPY clips them at 1e-6 / −min(design matrix), ≈ 6.7e-10 mm²/s, which also makes rotation invariance fail there by up to 9.7e-4"
fix = "exclude those voxels (0.16%) as convention, not fit; compare over positive-definite unclipped voxels"
