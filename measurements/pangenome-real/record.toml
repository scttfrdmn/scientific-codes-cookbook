# measurements/pangenome-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "one sample's chromosome indexed, mapped and checked: HG002 chr20 (9,127,222 pairs) against the HPRC v1.1 chr20 d9 graph"

[[dataset]]
id = "s3://human-pangenomics/pangenomes/freeze/freeze1/minigraph-cactus/hprc-v1.1-mc-grch38/hprc-v1.1-mc-grch38.chroms/chr20.d9.vg (S3 version 0wTd0vbZPssWXgkhAVEc94YeX8C1DHHo)"
tier = "roda"
pins = "pins.sha256"

[[dataset]]
id = "NIST GIAB HG002 Illumina HiSeq 2x250 novoalign GRCh38 BAM, chr20 slice"
tier = "durable-id"
pins = "pins.sha256"
from_recipe = "measurements/phasing-real"
note = "md5-checked by GIAB, staged by phasing-real; the task checks it against phasing-real's pin"

[[dataset]]
id = "HG002 chr20 FASTQ pair (r1/r2.fq.gz) and novoalign placements, written by 00-prep (samtools collate | fastq)"
tier = "built"
pins = "pins.sha256"
note = "results/prep/ holds the FASTQ conservation check"

[[dataset]]
id = "GRCh38 chr20.fa"
tier = "versioned-release"
pins = "pins.sha256"

[[run]]
instance = "m8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
date = "2026-10-20"
date_source = "run"
