billed_usd = 0.199
peak_gib = 3.2
peak_kind = "vmhwm"
note = "index 423 s + giraffe 246 s"

[[run]]
instance = "m8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
date = "2026-10-20"
date_source = "run"
workers = 16
threads_per_core = 2
wall_s = 607
billed_s = 1411
usd_hr = 0.8467
compute_usd = 0.143
billed_usd = 0.332
peak_gib = 3.2
peak_kind = "vmhwm"
note = "index 334 s + giraffe 273 s; billed window long because of BusyBox awk in the checks"

[[run]]
instance = "m8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
date = "2026-10-20"
date_source = "run"
workers = 16
threads_per_core = 1
wall_s = 547
billed_s = 1176
usd_hr = 0.9738
compute_usd = 0.148
billed_usd = 0.318
peak_gib = 3.2
peak_kind = "vmhwm"
note = "index 385 s + giraffe 162 s"

# --- checks: "The checks, at scale, on all three chips"; observed is every chip's ---------
[[check]]
id = "inputs"
claim = "inputs"
kind = "pin"
bound = "sha256 **==** `pins.sha256`, scripts included; the BAM **==** phasing-real's pin"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "held-out"
claim = "held-out sample"
kind = "identity"
bound = "no HG002 path in the graph"
observed = "46 samples, none HG002"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "reference-path"
claim = "**reference path**"
kind = "identity"
bound = "the graph's one `GRCh38#chr20` path, normalised, has sha256 **==** `chr20.fa`'s"
observed = "`24427012…`, the recipe's own value"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fastq-conservation"
claim = "FASTQ conservation"
kind = "conservation"
bound = "2 × pairs + singletons **==** primary records in the BAM; mates pair by name"
observed = "18,289,203"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "every-read-written"
claim = "every read written"
kind = "conservation"
bound = "GAF records **==** 2 × pairs; mates adjacent; one name per pair"
observed = "18,254,444"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "cs-arithmetic"
claim = "**`cs:Z` arithmetic**"
kind = "identity"
bound = "in every mapped record, the difference string consumes exactly the query span (cols 3–4) and the target span (cols 8–9)"
observed = "0 exceptions in 18,226,925"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "path-bounds"
claim = "path bounds"
kind = "identity"
bound = "every target span lies inside its path"
observed = "0 exceptions"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "surjection"
claim = "surjection"
kind = "conservation"
bound = "primary SAM records **==** 2 × pairs"
observed = "18,254,444"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "join-accounting"
claim = "join accounting"
kind = "conservation"
bound = "reads joined to novoalign's record **==** 2 × pairs − surject's mate-less records"
observed = "18,178,130 = 18,254,444 − 76,314"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "vs-novoalign"
claim = "**vs novoalign**"
kind = "cross-code"
bound = "where both have MAPQ ≥ 30, first base (POS less the leading clip) within 5 bp: **≥ 0.98**"
observed = "**0.9980** (17,458,373 of 17,493,028)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "across-chips"
claim = "across chips"
kind = "identity"
bound = "sorted GAF and sorted surjected table identical"
observed = "`b2f503f6…`, `a17b8ee5…` on all three"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "raw-pos-agreement"
claim = "On raw POS the agreement is 0.9861."
kind = "reported"
observed = "0.9861"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "giraffe-places-more"
claim = "Giraffe places reads that novoalign does not."
kind = "reported"
observed = "99.85% of reads map; 213,048 reads novoalign left unmapped get MAPQ ≥ 30"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "index-bytes"
claim = "The index files differ, and that is reported, not asserted."
kind = "reported"
observed = "GBZ: one hash on four Graviton4 runs, another on Intel and AMD (42 KB size difference); distance, minimizer and zipcode indexes: four hashes from four Graviton4 builds"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "GBZ stable per build but differs Graviton4 vs x86 by 42 KB; the three multi-threaded indexes differ run to run on one chip; the alignments do not change"

[[cross_code]]
with = "published:NIST-GIAB-HG002-HiSeq-2x250-novoalign-GRCh38"
same_bytes = true
metric = "where both have MAPQ ≥ 30, unclipped first base (POS less the leading clip) within 5 bp"
tolerance_basis = "the 0.98 floor minimap2↔bwa carries in recipes/minimap2; comparing unclipped starts removes the soft-clipping difference"
check = "vs-novoalign"

[[trap]]
id = "pangenome-surject-no-mate-bit"
scope = "tool"
symptom = "vg surject -i writes 76,314 records (0.42%) with no mate bit at all: flag 0, 16 or 4, no 0x1/0x40/0x80"
cause = "every read the SAM leaves unmapped, by Giraffe or by surjection off the GRCh38 path, is written without mate bits, with its mate"
fix = "count them, keep them out of the join, and hold the join to that exact count; the GAF itself pairs every read (fn:Z / fp:Z)"

[[trap]]
id = "pangenome-raw-pos-measures-clipping"
scope = "method"
symptom = "Giraffe vs novoalign agreement 0.9861 on raw POS"
blames = "the aligners"
cause = "the two aligners clip differently at the start, so a raw-POS comparison measures soft-clipping"
fix = "compare unclipped starts (POS less the leading clip): 0.9980"

[[trap]]
id = "pangenome-gaf-header-lines"
scope = "tool"
symptom = "GAF output carries two header lines"
cause = "vg giraffe -o gaf writes header lines into the GAF"
fix = "skip them when counting GAF records"

[[trap]]
id = "pangenome-busybox-awk-sort"
scope = "image"
symptom = "streamed checks took 256 + 209 s on Intel against 60 + 40 s on Graviton4"
cause = "the x86 images' BusyBox awk is slow, and BusyBox sort holds the whole 9.3 GB GAF in memory"
fix = "64 GiB box sized for the checks, not for vg (which never passed 3.2 GiB)"
