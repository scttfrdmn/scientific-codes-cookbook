# measurements/bcftools-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is the EC2 window (CloudTrail RunInstances -> Terminate) on all three chips,
# to within 1 s (results/billed-windows.txt). Dates are the git dates results/ landed; the runs
# themselves were 2026-10-18 (arm64, Intel) and 2026-10-21 (AMD).
schema = 2
result_unit = "the whole verified run: chromosomes 20, 21 and 22 of 1000 Genomes Phase 3 (2,504 samples) normalised, annotated, filtered, concatenated and merged, with every check"

[workload]
size = { records = 4021926, samples = 2504 }
note = "chromosomes 20, 21 and 22 of 1000 Genomes Phase 3 (775 MB of bgzipped VCF), one task running norm, fill-tags, stats, filter, annotate, concat and split/merge in sequence; streams, 16-19 MiB RSS"

[timing]
wall = "the README's 'task compute': run.sh's whole workload, every operation and check, excluding boot and staging"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "concat-roundtrip"
attribution = "same-version-other-build"
attribution_note = "bcftools 1.24 on both images, but they link different htslib builds (1.23.1 arm64, 1.24 x86), so a step timing is chip and htslib; the census column also runs GNU vs BusyBox awk. Intel vs AMD is the same image"

[[dataset]]
id = "RODA s3://1000genomes/release/20130502/ALL.chr{20,21,22}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.vcf.gz"
tier = "roda"
pins = "../plink-real/vcf.sha256"
from_recipe = "measurements/plink-real"
note = "read from plink-real's staged inputs/plink-real/ prefix, one copy of the bytes"

[[dataset]]
id = "RODA s3://1000genomes/release/20130502/integrated_call_samples_v3.20130502.ALL.panel"
tier = "roda"
pins = "pins.sha256"
note = "copied from stage-inputs.sh's pins.sha256 heredoc; checked in-task"

[[dataset]]
id = "hs37d5.chr20-22.fa: contigs 20-22 cut verbatim from RODA technical/reference/phase2_reference_assembly_sequence/hs37d5.fa.gz"
tier = "built"
pins = "pins.sha256"
note = "copied from stage-inputs.sh's pins.sha256 heredoc (with the source hs37d5.fa.gz); checked in-task"

[[run]]
id = "chip-c8g"
in = ["chip"]
instance = "c8g.2xlarge"
purpose = "primary"
results = "results/arm64/"
date = "2026-10-17"
date_source = "git"
workers = 4
ranks = 1
threads_per_rank = 4
threads_per_core = 1
wall_s = 3750
billed_s = 3887
usd_hr = 0.319
compute_usd = 0.3323
billed_usd = 0.3444
peak_gib = 0.01582
peak_kind = "rss"

[[run]]
id = "chip-c8i"
in = ["chip"]
instance = "c8i.2xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
date = "2026-10-17"
date_source = "git"
workers = 4
ranks = 1
threads_per_rank = 4
threads_per_core = 2
wall_s = 3553
billed_s = 3646
usd_hr = 0.3748
compute_usd = 0.3699
billed_usd = 0.3796
peak_gib = 0.01787
peak_kind = "rss"

[[run]]
id = "chip-c8a"
in = ["chip"]
instance = "c8a.2xlarge"
purpose = "cross-chip"
results = "results/amd/"
spawn_version = "0.139.1"
date = "2026-10-20"
date_source = "git"
workers = 4
ranks = 1
threads_per_rank = 4
threads_per_core = 1
wall_s = 2997
billed_s = 3101
usd_hr = 0.4311
compute_usd = 0.3589
billed_usd = 0.3713
peak_gib = 0.01807
peak_kind = "rss"
note = "billed is EC2 launch to termination; command staged as a sha256-checked file (spawn#1246)"

# checks: the README's "What held at scale, on all three chips" rows (94 asserts in checks.tsv)
[[check]]
id = "pins"
claim = "staged bytes == pinned sha256"
kind = "pin"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "stats-census"
claim = "`stats` records and multiallelic sites == a text count of the input (`gzip -dc | awk`)"
kind = "identity"
observed = "1,812,841 / 1,105,538 / 1,103,547 records"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "norm-counters"
claim = "`norm` read every record, split exactly the multiallelic ones, removed nothing"
kind = "identity"
observed = "split 8,972 / 6,374 / 6,348; realigned 2,403 / 1,659 / 1,520"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "records-per-allele"
claim = "records out == ALT alleles in, every record biallelic"
kind = "identity"
observed = "1,822,268 / 1,112,228 / 1,110,240"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "ac-conserved"
claim = "Σ AC conserved through the split"
kind = "conservation"
observed = "317,433,531 / 231,209,651 / 204,816,071"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "ac-an-published"
claim = "AC and AN recomputed from genotypes == the consortium's published tags, **every split record**"
kind = "reference"
observed = "0 mismatches"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "superpop-af"
claim = "super-population AF recomputed (`-S` from the release panel) == published `EAS/AMR/AFR/EUR/SAS_AF`"
kind = "reference"
bound = "printed to 4 decimals"
observed = "max |diff| 5e-5 = the print precision"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "stats-classes"
claim = "`stats` SNPs, MNPs == census; indels + others == census"
kind = "identity"
observed = "SNPs 1,751,797 / 1,063,228 / 1,064,502"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "filter-common-snps"
claim = "`view -v snps -i 'AF>=0.01'` == an awk count of the same predicate"
kind = "identity"
observed = "271,047 / 174,989 / 174,442"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "annotate-roundtrip"
claim = "strip ID + 3 AF tags, restore with `annotate -a sites.vcf.gz` == original columns (md5)"
kind = "identity"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "concat-roundtrip"
claim = "`concat` records == Σ per-chromosome; `view -r` of each chromosome == the input, byte-identical text with all genotypes"
kind = "identity"
observed = "4,044,736"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "split-merge-roundtrip"
claim = "chr22 split into two 1,252-sample halves, `merge -m none` == every genotype of every record (md5), same sample order"
kind = "identity"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[trap]]
id = "bcftools-other-not-indel"
scope = "method"
symptom = "a check that counts indels by length disagrees with `stats` by exactly those records"
cause = "bcftools files 22 / 19 / 21 non-symbolic alleles as \"other\", not indel -- complex replacements with no shared base, like `A → TT` or `ATAATA → T` at chr20:8208842"
fix = "compare indels + others against the census, and assert the listed non-symbolic \"other\" records are the whole difference"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "the AMD leg's resolved spec no longer fit EC2's 16 KiB user data; command staged as a sha256-checked file and outputs staged out as one directory"
