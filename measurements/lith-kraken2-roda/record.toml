note = "Python S3 depth sweep on the sustained-15 Gb NIC (plateau 905.1/s) and the kraken2 thread ladder (4/8/16/32 threads, plus 32 after drop_caches: 139.909 s cold vs 1.771 s warm)"

[[run]]
instance = "r8g.xlarge"
purpose = "diagnostic"
region = "us-west-1"
date = "2026-10-04"
date_source = "git"
results = "results/canary-cross-region.txt"
note = "canary, placed in us-west-1 against the us-west-2 bucket unasked; 1.52 MiB/s cross-region. Its throughput numbers are void"

[[run]]
