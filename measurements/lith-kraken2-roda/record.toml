# measurements/lith-kraken2-roda/record.toml -- drafted by the #118 extraction, then authored.
# An access-pattern study, not a recipe sweep: eleven probe launches, all Graviton, one chip.
schema = 1
result_unit = "one 1M-read human WGS sample (SRR062634) classified against the full 1.1 TiB RefSeq-Complete DB on local NVMe"

[[dataset]]
id = "RODA kraken2 RefSeq-Complete v205 (us-west-2), hash.k2d 1,189,091,671,800 bytes"
tier = "roda"
pins = "pins.sha256"
note = "hash.k2d, taxo.k2d and opts.k2d (the runtime set) hashed in place at the RODA bucket (us-west-2); hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "SRA SRR062634 (human WGS reads), 10k / 100k / 1M-read ladder"
tier = "durable-id"
pins = "../bwa-real/pins.sha256"
note = "the ladder subsets SRR062634_1 from inputs/bwa-real/; hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

# --- the kraken2 result: copy the runtime set to NVMe, then a read-count ladder -------
[[run]]
instance = "r8gd.8xlarge"
purpose = "primary"
date = "2026-10-04"
date_source = "git"
workers = 32
wall_s = 510
usd_hr = 2.3514
compute_usd = 0.3331
results = "results/kraken2-cost-ladder.txt"
note = "wall_s is the 1M rung's wall (1m_wall_s), on which compute $ 0.3331 is priced; kraken2's own processing time is 483.2 s. Same box: copy 1563 s / $1.0209, whole ladder $1.5643 for 2.11M reads"

[[run]]
instance = "r8gd.8xlarge"
purpose = "diagnostic"
date = "2026-10-04"
date_source = "git"
wall_s = 1561
usd_hr = 2.3514
compute_usd = 1.0196
results = "results/nvme-r8gd-8xl.txt"
note = "copy of the 1107.6 GiB runtime set to NVMe at max_concurrent_requests 64 (wall_s = copy wall); also the lith mount 4 KiB probe (7.9/s, 23x amplification) and the single-threaded NVMe probe (5,412/s)"

[[run]]
instance = "r8gd.8xlarge"
purpose = "diagnostic"
date = "2026-10-04"
date_source = "git"
wall_s = 1686
usd_hr = 2.3514
compute_usd = 1.1012
note = "copy at max_concurrent_requests 128 (wall_s = copy wall); no results file committed for this launch"

[[run]]
instance = "r8gd.8xlarge"
