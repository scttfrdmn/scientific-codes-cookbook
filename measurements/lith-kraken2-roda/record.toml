# --- checks: no checks table; the identities and observations the prose states -------
[[check]]
id = "repeat-rung-identity"
claim = "the two 100k rungs returned exactly 99,291 classified and 709 unclassified"
kind = "identity"
bound = "exact"
observed = "99,291 / 709 both rungs"
outcome = "pass"

[[check]]
id = "classified-sanity"
claim = "98.6–99.3% classified is the sanity check that matters: these are human reads and human is in RefSeq Complete"
kind = "reported"
observed = "98.64%, 99.29%, 99.30%, 99.29%"
outcome = "reported"

[[check]]
id = "mount-visible"
claim = "files visible / `stat` on `hash.k2d`"
kind = "identity"
observed = "9 of 9 / `1,189,091,671,800` bytes"
outcome = "pass"

[[check]]
id = "cold-warm"
claim = "identical 100k-read work, cold vs warm (32 threads, drop_caches between)"
kind = "reported"
observed = "139.9 s cold, 1.77 s warm: 98.7% I/O wait"
outcome = "reported"

[[check]]
id = "mount-amplification"
claim = "NIC bytes across exactly 200 probes"
kind = "reported"
observed = "17 MiB total = 91 KiB per probe = 23×"
outcome = "reported"

[[check]]
id = "coalescing-density-control"
claim = "at sparse density (119 MB apart) the identical coalescing sweep"
kind = "reported"
observed = "1.0× — 773.8 → 779.9 lookups/s"
outcome = "reported"

[[check]]
id = "go-depth-errors"
claim = "Go range GETs at depth 8192"
kind = "reported"
observed = "34,456.5/s (141 MB/s, 0 errors)"
outcome = "reported"

[[trap]]
id = "lith-kraken2-out-of-region-placement"
scope = "platform"
symptom = "InvalidInstanceID.NotFound"
blames = "a dead box (read twice as \"the shell died\" while kraken2 was still faulting)"
cause = "two runs were placed in us-west-1 against the us-west-2 bucket, unasked-for and silent; cross-region the same work pulled 1.52 MiB/s against 107–146 MB/s"
fix = "check the region before concluding anything; put the no-tool baseline (aws s3 cp on the same box) in the probe first"
refs = ["lith#362", "lith#365"]

[[trap]]
id = "lith-kraken2-launch-command-no-log-staging"
scope = "platform"
symptom = "P3 was lost"
cause = "spawn launch --command does not stage logs out (spawn#643's pre-stop flush is a task run feature)"
fix = "a probe must stream its result"
refs = ["spawn#643"]

[[trap]]
id = "lith-kraken2-container-uid-output"
scope = "platform"
symptom = "Unable to open file: /w/out-10k.kraken, reason: Permission denied"
cause = "chown-ing the NVMe mount to the instance user is not enough: the container runs as the image's user"
fix = "chmod 1777 the output dir"

[[trap]]
id = "lith-kraken2-launch-command-errexit"
scope = "platform"
symptom = "each script exited before the line that would have reported why; `$-` == `ehB` before any user `set`"
cause = "spawn launch --command runs under bash -e, and set -uo pipefail does not clear it"
fix = "use set +e explicitly and check statuses by hand"
cost = "the kraken2 figure took five launches, four died to three tangled bugs; three wrong diagnoses"
refs = ["spawn#707"]

[[trap]]
id = "lith-kraken2-heredoc-binds-last-command"
scope = "method"
symptom = "tee writes the script's own source into the results file"
cause = "`python3 - 2>&1 | tee <<'PY'`: a heredoc binds to the last command in a pipeline, so Python gets an empty stdin"
fix = "give python3 the heredoc, not the pipeline's last command (the README states the cause; this is its direct reading)"
cost = "one wasted launch"

[[trap]]
id = "lith-kraken2-python-client-ceiling"
scope = "method"
symptom = "S3 random-lookup plateau past depth 256 (788.7/s; 905.1/s with 4x the cores and a sustained NIC)"
blames = "S3, the NIC or PPS"
cause = "the Python/boto3 client: the GIL makes extra cores inert"
fix = "rewrite the probe in Go: 34,456.5/s at depth 8192 on the same instance type, 44x higher"

[[trap]]
id = "lith-kraken2-sdk-debug-logging"
scope = "method"
symptom = "81,920-request rungs collapse to ~500/s with zero errors"
cause = "the SDK logged a DEBUG line per request through tee: 20 MB of output and a serialization point"
fix = "logging.Nop{} and WithClientLogMode(0)"

[[trap]]
id = "lith-kraken2-no-drop-caches-between-rungs"
scope = "method"
symptom = "4→8 threads \"improving\" 27×"
cause = "no drop_caches between rungs, so the first rung warmed the cache and the rest rode it"
fix = "drop_caches before every rung that is meant to be cold"

