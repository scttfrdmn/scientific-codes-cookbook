# --- checks: the README's "Checks hold on both" bullet
[[check]]
id = "splits-run"
claim = "all five splits run"
kind = "sentinel"
bound = "5 of 5"
observed = "working_splits 5"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "ranks-used"
claim = "`ranks_used` equals the ranks launched in every row"
kind = "rank-count"
bound = "== ranks launched"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mean-temperature"
claim = "The mean temperature prints 301.998 K in all fifteen rows on three chips"
kind = "reported"
observed = "301.998 K"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "301.998 K in all fifteen rows on three chips; MD is a path, so that is recorded, not asserted"

[[check]]
id = "best-split"
claim = "best ÷ worst"
kind = "reported"
observed = "1.096 / 1.107 / 1.414"
outcome = "reported"
across_chips = "n/a"

