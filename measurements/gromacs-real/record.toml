# measurements/gromacs-real/record.toml -- drafted by the #118 extraction, then authored.
# The decomposition leg only: the generation ladder lives on recipes/gromacs. README prices in
# $/ns from ns/day, which is not wall x rate, so no row carries a $ figure (usd_hr only).
# Schema 2: each chip ran all five splits in ONE task, so the billed window is shared by five rows
# (results/billed-windows.txt; README prints the x86 windows, 382 s and 242 s).
schema = 2
result_unit = "one simulated nanosecond of benchMEM (81,743 atoms, PME, NPT)"
throughput_unit = "ns/day"
throughput_is_result = true

[workload]
size = { atoms = 81743, steps = 10000 }
note = "benchMEM tpr's own 10,000 steps, CPU nonbonded (-nb cpu), five rank x thread splits at 16 vCPU on one box per chip"

[timing]
wall = "the mpiexec + mdrun call, timed in-script with date +%s ('mdrun only')"
billed_basis = "shared-window"

[[series]]
id = "layout-g4"
axis = "layout"
held = ["image", "instance", "workers", "size"]
equal_work = "splits-run"
attribution = "same-binary"
verdict = { shape = "flat", on = "throughput" }
note = "best / worst 1.096; 16 x 1 and 1 x 16 within 0.4%"

[[series]]
id = "layout-intel"
axis = "layout"
held = ["image", "instance", "workers", "size"]
equal_work = "splits-run"
attribution = "same-binary"
verdict = { shape = "flat", on = "throughput" }
note = "best / worst 1.107; 16 x 1 and 1 x 16 within 0.4%"

[[series]]
id = "layout-amd"
axis = "layout"
held = ["image", "instance", "workers", "size"]
equal_work = "splits-run"
attribution = "same-binary"
note = "the splits span 41% (best / worst 1.414); pure MPI 16 x 1 is 23% faster than pure OpenMP 1 x 16: tune the split on AMD"

[[series]]
id = "chip"
axis = "chip"
held = ["workers", "layout", "size", "generation"]
equal_work = "splits-run"
attribution = "same-version-other-build"
attribution_note = "GROMACS 2026.3 throughout, but Graviton4 ran the previous md digest (OpenBLAS) and x86 the current env's linux-64 twin (MKL, AVX2 build on Intel); Intel's 16 vCPUs are 8 hyperthreaded cores. Intel and AMD run the same build, so their gap is the chips"

[[dataset]]
id = "benchMEM (81,743 atoms, PME, Berendsen NPT) tpr"
tier = "versioned-release"
pins = "datasets.sha256"
from_recipe = "gromacs"
note = "sha256 copied from recipes/gromacs/stage-inputs.sh, which checks it at stage time"

[[run]]
id = "g4-16x1"
in = ["layout-g4", "chip"]
instance = "c8g.4xlarge"
purpose = "core-sweep"
image = "quay.io/aarchsci/md@sha256:1ee941664add6f83b367c012d0cc670ffc837e83ee491125993de72e88c22ab9"
date = "2026-09-30"
date_source = "git"
workers = 16
wall_s = 70
usd_hr = 0.6381
results = "results/decomp.txt"
note = "16 ranks x 1 OpenMP threads, 25.538 ns/day; wall_s is mdrun only. Graviton4 leg, on the previous md digest"
throughput = 25.538
ranks = 16
threads_per_rank = 1
bind = "mpiexec --oversubscribe; mdrun -pin off"

