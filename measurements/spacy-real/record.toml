# --- "Fixed point or path" -------------------------------------------------------------
[[check]]
id = "tokenization-crosschip"
claim = "Tokenization is rule-based and a fixed point: identical on every chip"
kind = "reported"
observed = "tokenization digest matches on all 89,339 articles; 795,195,869 tokens on all three"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "neural-layers-crosschip"
claim = "The neural layers are a path"
kind = "reported"
observed = "at most 0.23% of articles differ in a layer digest (dependency parse: 193 Intel, 205 AMD)"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "articles whose dependency-parse digest differs from Graviton4's: 193 (Intel), 205 (AMD), 113 Intel vs AMD on the same linux-64 build; Intel 3 fewer sentences, AMD one more entity"

[[trap]]
id = "spacy-uas-convention-mismatch"
scope = "method"
symptom = "UAS 0.56 on UD English-EWT gold tokens"
blames = "parser quality"
cause = "spaCy's English parser follows ClearNLP's dependency conventions; UD makes content words heads where ClearNLP makes function words heads (copulas, auxiliaries, case markers)"
fix = "read UAS against UD only as a scorer-agreement check; LAS is not reported, because the label sets differ"
