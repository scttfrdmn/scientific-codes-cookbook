outcome = "reported"
across_chips = "identical"

[[check]]
id = "acc-uas"
claim = "UAS, gold tokens"
kind = "reported"
observed = "0.5643"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "acc-tokens-f1"
