# --- checks: "What is asserted, and what is only reported"; scores in results/*/three-way.txt
[[check]]
id = "snv-recall-q0"
claim = "unfiltered SNV recall ≥ 0.95"
kind = "band"
bound = "≥ 0.95"
observed = "0.9595 / 0.9949 / 0.9955"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "snv-precision-q30"
claim = "`QUAL>=30` SNV precision ≥ 0.98"
kind = "band"
bound = "≥ 0.98"
observed = "0.9900 / 0.9953 / 0.9970"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "three-way-bytes"
claim = "`three-way.txt` is byte-identical on all three chips"
kind = "reported"
observed = "byte-identical"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "indels"
claim = "Indels are reported and never asserted"
kind = "reported"
observed = "F1 0.99395 / 0.98563 / 0.95579 (GATK4 / bcftools / freebayes, q0)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "vcf-records"
claim = "The VCFs are not byte-identical"
kind = "reported"
observed = "x86 GKL changes 51 GATK annotations; bcftools 127,617 calls against 127,616"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "bcftools 127,617 calls (x86) against 127,616 (Graviton4); 51 GATK annotations differ; none reaches a scored count"

[[check]]
id = "freebayes-sample"
claim = "sample == NA12878; no calls off chr20"
kind = "identity"
bound = "NA12878; 0"
observed = "NA12878; 0"
outcome = "pass"

[[cross_code]]
with = "published:GIAB-HG001-v4.2.1"
same_bytes = false
metric = "SNV/indel precision, recall, F1 by POS:REF:ALT inside the high-confidence chr20 regions"
tolerance_basis = "floors are claims every working caller must satisfy, not shaved to the observed values"
check = "snv-recall-q0"
