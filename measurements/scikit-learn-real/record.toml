claim = "logistic stationarity `max|X'(P−Y) + W/C| / n`"
kind = "identity"
bound = "1e-6"
observed = "2.589e-11"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "intercept-conservation"
claim = "`Σ_i p_ik == n_k` per class (unpenalised intercept)"
kind = "conservation"
observed = "1.514e-12 · n"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "1.514e-12 · n (Graviton4, Intel) vs 1.513e-12 · n (AMD)"

[[check]]
