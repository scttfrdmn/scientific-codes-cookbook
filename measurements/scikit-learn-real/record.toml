[[check]]
id = "hgb-determinism"
claim = "HGB fit twice, fixed seed, 8 threads: predict_proba bytes"
kind = "identity"
bound = "exact"
observed = "identical"
outcome = "pass"

[[check]]
id = "rf-determinism"
claim = "RF fit twice: node arrays and predict_proba bytes"
kind = "identity"
bound = "exact"
observed = "identical"
outcome = "pass"

[[check]]
id = "affine-predictions"
claim = "HGB and RF refit on `4X + 1024`: predictions"
kind = "invariance"
bound = "exact"
observed = "bit-identical"
outcome = "pass"

[[check]]
id = "rf-affine-thresholds"
claim = "RF on `4X + 1024`: same trees, thresholds `4t + 1024`"
kind = "invariance"
bound = "exact"
observed = "true"
outcome = "pass"

[[check]]
id = "accuracy-ordering"
claim = "accuracy: majority 0.4876 < logreg < both ensembles, ensembles ≥ 0.90"
kind = "band"
observed = "ok"
outcome = "pass"

# --- across chips (reported) -----------------------------------------------------------
[[check]]
id = "logistic-optimum-cross-chip"
claim = "the logistic optimum across chips"
kind = "reported"
observed = "objective 0.629010187599845 to all 15 printed digits; accuracy 0.725420"
outcome = "reported"
across_chips = "fixed-point"
across_chips_evidence = "coefficients to 1.6e-12 absolute (max |W| 12.2) Graviton4 vs Intel; AMD 5.9e-13 from Intel and 1.7e-12 from Graviton4"

[[check]]
id = "rf-cross-chip"
claim = "random forest across chips: node arrays hash, probabilities hash, accuracy"
kind = "reported"
observed = "identical, accuracy 0.954468"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "hgb-cross-chip"
claim = "HistGradientBoosting probabilities across chips"
kind = "reported"
observed = "test accuracy 0.969760 on all chips"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "probability bytes differ Graviton4 vs x86; Intel and AMD produce the same bytes (c68ec63e…); accuracy 0.969760 on all"

[[check]]
id = "hgb-l2-zero-diagnostic"
claim = "default l2_regularization=0, 100 iterations: training log-loss trace, leaf maximum, accuracy"
kind = "reported"
observed = "0.200 at iteration 40, 0.817 at 100; max leaf 5.7e4; accuracy 0.910088"
outcome = "reported"
across_chips = "identical"

[[trap]]
id = "scikit-learn-hgb-l2-zero-diverges"
scope = "tool"
symptom = "training log-loss falls to 0.200 by iteration 40, then rises — 0.276, 0.358, 0.817 at 100 — while the largest leaf value reaches 5.7e4"
blames = "overfitting (test accuracy alone at a fixed max_iter would read it so)"
cause = "sklearn applies min_samples_leaf to true counts, so leaves of ~20–40 rows whose summed hessian sits just above the 1e-3 floor take huge steps (first rise: 34 rows, G = 2.0, H = 1.05e-3, step −191); LightGBM applies min_data_in_leaf to hessian-estimated counts and does not diverge"
fix = "set l2_regularization (≥ 0.01) for multiclass boosting; or min_hessian_to_split ≥ 0.01, learning_rate=0.05, raw score 0 start, or min_samples_leaf=1"

[[upstream]]
ref = "scikit-learn#17763"
role = "cited"
note = "nearest existing issue (learning rates above 0.1); does not cover this divergence"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "0.139.1's wrapper leaves too little of EC2's 16 KiB user data; AMD leg staged a sha256-checked task.sh"
