claim = "sha256 == scikit-learn 1.9.1's own `fetch_covtype` pin; UCI's archive is the same bytes"
kind = "pin"
observed = "ok"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "class-counts"
claim = "class counts == UCI `covtype.info` (211840, 283301, 35754, 2747, 9493, 17367, 20510)"
kind = "reference"
bound = "exact"
observed = "exact"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "one-hot-encoding"
claim = "every row has exactly one wilderness area and one soil type"
kind = "identity"
observed = "581,012 of 581,012"
outcome = "pass"
across_chips = "identical"

[[check]]
