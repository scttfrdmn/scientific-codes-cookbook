# measurements/snakemake-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "the cohort table: eleven whole FASTQ files (446.0M reads) checked and joined"

[[dataset]]
id = "FASTQs on RODA: 1000 Genomes s3://1000genomes (bwa-real, incl. SRR062634) and SRA (metaphlan-real), as assembled by qc-aggregate-real"
tier = "roda"
pins = "../qc-aggregate-real/inputs.sha256"
from_recipe = "measurements/qc-aggregate-real"
note = "read where the owning measurements staged them; nothing new fetched"

[[dataset]]
id = "ENA FASTQs staged by salmon-real and mageck-real, as assembled by qc-aggregate-real"
tier = "durable-id"
pins = "../qc-aggregate-real/inputs.sha256"
from_recipe = "measurements/qc-aggregate-real"

[[dataset]]
id = "published read/base counts per file: ENA read_count/base_count and the 1000 Genomes .filt count, from qc-aggregate-real's cohort.tsv"
tier = "durable-id"
from_recipe = "measurements/qc-aggregate-real"
note = "stage-inputs.sh uploads one small truth file per FASTQ"

# --- cold run r1: 12 instances per chip; usd_hr is the stats instance's price ------------
[[run]]
instance = "c8g.large"
purpose = "primary"
results = "results/arm64/"
date = "2026-10-20"
date_source = "run"
workers = 2
threads_per_core = 1
wall_s = 326
billed_s = 2134
usd_hr = 0.0798
compute_usd = 0.0072
peak_gib = 0.0244
peak_kind = "vmhwm"
note = "11 x c8g.large + a c8g.medium (0.0399 $/hr) for the join; wall_s is seqkit summed over 11 jobs, billed_s the 12 CloudTrail windows summed; README billed $/result 0.0460 mixes the two rates, so billed_usd is left out; workflow wall 5,881 s"

[[run]]
instance = "c8i.large"
purpose = "cross-chip"
results = "results/x86_64/"
date = "2026-10-20"
date_source = "run"
workers = 2
threads_per_core = 2
wall_s = 362
billed_s = 2216
usd_hr = 0.0937
compute_usd = 0.0094
billed_usd = 0.0577
peak_gib = 0.0244
peak_kind = "vmhwm"
note = "12 x c8i.large (the join too); workflow wall 3,828 s"

[[run]]
instance = "c8a.large"
purpose = "cross-chip"
results = "results/amd/"
date = "2026-10-20"
date_source = "run"
workers = 2
threads_per_core = 1
wall_s = 239
billed_s = 1654
usd_hr = 0.1078
compute_usd = 0.0072
peak_gib = 0.0244
peak_kind = "vmhwm"
note = "11 x c8a.large + a c8a.medium (0.0539 $/hr) for the join; README billed $/result 0.0478 mixes the two rates, so billed_usd is left out; workflow wall 5,009 s"

