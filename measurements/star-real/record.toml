# measurements/star-real/record.toml -- drafted by the #118 extraction, then authored.
# Five data paths for one 28.6 GiB index on one m8g.8xlarge; wall_s = setup + align as the
# README prints it, compute_usd = that at the box's rate (the cross-chip table's "$" figures).
# Schema 2: every row is a spawn launch (raw instance, scripts as --command). The copy -> tmpfs routes
# are `aws s3 cp --recursive` at CLI defaults into /tmp tmpfs, the transfer spawn's stage-in does, so
# data_path = stage-default. Each x86 box billed one EC2 window for all five aligns (shared-window;
# CloudTrail in results/billed-windows.txt).
schema = 2
result_unit = "one alignment of ERR188026 (15.8M reads) against the published 28.6 GiB GRCh38 + Ensembl 116 index"

[workload]
size = { reads = 15800127, index_gib = 28.6 }
note = "one alignment against an immutable 28.6 GiB index; the align is under a minute of real work, so the data path is most of the wall"

[timing]
wall = "setup + align as the README prints it, first read (page cache dropped before each align); steady-state rows are the align alone"

[[series]]
id = "first-read"
axis = "data_path"
held = ["image", "instance", "workers", "layout", "size"]
equal_work = "reads-and-unique"
attribution = "same-binary"
note = "lith mount fastest on the first read (89 s), copy -> local EBS slowest (409 s); mapping 56-58 s in every route"

[[series]]
id = "steady-state"
axis = "data_path"
held = ["image", "instance", "workers", "layout", "size"]
equal_work = "reads-and-unique"
attribution = "same-binary"
note = "the same box aligning another sample, page cache not dropped; EBS warm is fastest only while the cache survives, tmpfs cannot be evicted"

[[series]]
id = "chip-lith"
axis = "chip"
held = ["workers", "layout", "size", "data_path"]
equal_work = "log-final-out"
attribution = "same-version-other-build"
attribution_note = "x86 rows run bioconda's x86 STAR 2.7.11b (the recipe's images_x86_64 pin) and lith 1.1.3's amd64 binary; Intel's 32 vCPUs are 16 cores x 2 threads; the Graviton4 row ran 2026-09-26, the x86 rows 2026-10-21"

[[dataset]]
id = "STAR 2.7.11b index, GRCh38 + Ensembl 116 (28.6 GiB, 16 files), s3://<bucket>/inputs/star-index-GRCh38-116"
tier = "run-output"
from_recipe = "star"
note = "built and published once by build-publish.sh; lith verifies its sha before mounting"

[[dataset]]
id = "ENA ERR188026 (complete run, 15,800,127 reads)"
tier = "durable-id"
pins = "../kallisto-real/reads.md5"
from_recipe = "star"
note = "ENA's fastq_md5 (md5, not sha256) for the same object (inputs/salmon-real/)"

