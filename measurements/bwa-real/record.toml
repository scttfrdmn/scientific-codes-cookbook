# measurements/bwa-real/record.toml -- bwa mem, a whole 1000 Genomes run vs the whole GRCh38 index:
# Graviton generations 2-5, the c8g core knee, and three chips at 16 threads.
# Owner recipe is bwa-samtools (image = its pins). Dates are the completion records' UTC dates (#123).
# Schema 2: every billed window is spawn's completion record (results/billed-windows.txt), matched by
# task id. The cross-chip rows once printed the EC2 window (CloudTrail, same file); restated on spawn's
# window 2026-10-26 (#123), with the EC2 window kept as ec2_s. Peak is the README's
# "peak RSS" = the 1 Hz max of cgroup memory.current (gen/knee) or of memory.stat anon (cross-chip).
# The cross-chip table and recipe-align rows are the 2026-10-24 re-run (#121: SAM to disk).
schema = 2
result_unit = "one alignment: 24,148,993 read pairs (SRR062634, HG00096) against GRCh38_full_analysis_set_plus_decoy_hla"
throughput_unit = "reads/s"

[workload]
size = { read_pairs = 24148993, read_length = 100 }
input_gib = 8.9
note = "embarrassingly parallel over reads against one shared index; bwa mem reads .amb/.ann/.bwt/.pac/.sa only"

[timing]
wall = "bwa's own [main] Real time (gen/knee: SAM to an in-flight awk counter; cross-chip: SAM to disk, nothing else timed)"
billed_basis = "spawn-task"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "workers", "size"]
equal_work = "pre-alt-records"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "billed_usd" }
note = "every newer generation is faster and cheaper per result"

[[series]]
id = "knee"
axis = "workers"
held = ["image", "input", "family", "generation", "size"]
equal_work = "pre-alt-records"
attribution = "same-binary"
verdict = { shape = "no-knee", through = 64, on = "wall" }
note = "no speed knee through 64 (on wall): 3.79x faster on 4x the cores, compute $ +5.7%. The cost minimum is at 16 (on billed; the derived cost knee): billed +40% because 93-97 s of fixed overhead is billed at 4x the rate"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "pre-alt-records"
attribution = "same-version-other-build"
attribution_note = "x86 rows run bioconda's x86 build of the same 0.7.19-r1273 (quay.io/biocontainers); Intel's 16 vCPUs are 8 cores x 2 SMT"

[[series]]
id = "chip-alt"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "alt-aware-records"
attribution = "same-version-other-build"
attribution_note = "the recipe's own 01-align task, ALT-aware: a second clean run per chip"

[[dataset]]
id = "s3://1000genomes technical/reference/GRCh38_reference_genome/GRCh38_full_analysis_set_plus_decoy_hla.fa.{amb,ann,bwt,pac,sa,fai} (the published bwa index)"
tier = "roda"
pins = "pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's; the RODA originals, hashed in place the same day, are identical, and bwa-mem2-real's runs hashed the same .alt/.amb/.ann/.bwt/.pac/.sa (results/*/bwa/results.tsv)"

[[dataset]]
id = "s3://1000genomes phase3/data/HG00096/sequence_read/SRR062634_{1,2}.filt.fastq.gz"
tier = "roda"
pins = "pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's; the RODA originals are identical, and the same sha256s are in qc-aggregate-real/inputs.sha256 and fastp-real's run smoke checks; 1000 Genomes' md5 is in ../bwa-mem2-real/datasets.md5"

