# measurements/bwa-real/record.toml -- bwa mem, a whole 1000 Genomes run vs the whole GRCh38 index:
# Graviton generations 2-5, the c8g core knee, and three chips at 16 threads.
# Owner recipe is bwa-samtools (image = its pins). Dates are the git dates results/ landed.
# The gen/knee sweeps print billed $/result but not billed seconds (only Graviton4's 851 s is
# printed), so their billed $ is in each note, not a field. Peak is the README's "peak RSS" =
# the 1 Hz max of cgroup memory.current (gen/knee) or of memory.stat anon (cross-chip rows);
# neither is in the peak_kind enum, so no peak_kind. The cross-chip table and recipe-align
# rows are the 2026-10-24 re-run (#121: SAM to disk, nothing else timed).
schema = 1
result_unit = "one alignment: 24,148,993 read pairs (SRR062634, HG00096) against GRCh38_full_analysis_set_plus_decoy_hla"

[[dataset]]
id = "s3://1000genomes technical/reference/GRCh38_reference_genome/GRCh38_full_analysis_set_plus_decoy_hla.fa.{amb,ann,bwt,pac,sa,fai} (the published bwa index)"
tier = "roda"
pins = "pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's; the RODA originals, hashed in place the same day, are identical, and bwa-mem2-real's runs hashed the same .alt/.amb/.ann/.bwt/.pac/.sa (results/*/bwa/results.tsv)"

[[dataset]]
id = "s3://1000genomes phase3/data/HG00096/sequence_read/SRR062634_{1,2}.filt.fastq.gz"
tier = "roda"
pins = "pins.sha256"
note = "hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's; the RODA originals are identical, and the same sha256s are in qc-aggregate-real/inputs.sha256 and fastp-real's run smoke checks; 1000 Genomes' md5 is in ../bwa-mem2-real/datasets.md5"

