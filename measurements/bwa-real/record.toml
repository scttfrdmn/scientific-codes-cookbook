# --- checks: the README's stated invariants (no checks table; claims copied from its prose) --
[[check]]
id = "pre-alt-records"
claim = "48,392,167 SAM records and 48,349,411 mapped pre-`.alt`"
kind = "identity"
observed = "48,392,167 / 48,349,411 on every chip and every generation and core count"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "alt-aware-records"
claim = "48,817,006 and 48,774,176 ALT-aware"
kind = "identity"
bound = "assert 48817006 -- EXACT"
observed = "48,817,006 / 48,774,176 on every chip"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "sam-shape"
claim = "a 16,173,608,298-byte SAM (17,325,079,973 ALT-aware) with 3,366 `@SQ` lines on every chip"
kind = "identity"
observed = "16,173,608,298 / 17,325,079,973 bytes, 3,366 @SQ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "pct-mapped"
claim = "99.91% of records map, every run"
kind = "band"
bound = ">= 99.9"
observed = "99.91"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "peak-memory"
claim = "Peak RSS was 8.70–8.71 GiB on all four"
kind = "reported"
observed = "8.70–8.71 GiB (generations); anon RSS 8.68 GiB on every chip"
outcome = "reported"
across_chips = "fixed-point"
across_chips_evidence = "anon_max_gib 8.68 on c8g, c8i and c8a (size-c8{g,i,a}-16t-disk.txt)"

[[check]]
id = "chip-speed-ratios"
claim = "AMD is 1.05× ahead of Graviton4 pre-`.alt` and 1.19× ALT-aware; Intel is 1.43× and 1.22× slower"
kind = "reported"
observed = "ratios move by up to 17% between two clean runs"
outcome = "reported"
across_chips = "n/a"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "align.sh is staged and pinned by sha256 because spawn's wrapper leaves too little of EC2's 16 KiB user data for the inline form"

[[upstream]]
ref = "spawn#1063"
role = "cited"
note = "gen-c8g.task.json's comment cites it: a spec over the 16 KiB user-data limit passes --dry-run, then RunInstances fails; spawn#1246 is the bootstrap-size cause"
