# measurements/plink-real/record.toml -- all of 1000 Genomes Phase 3 autosomes, three chips.
# Schema 2: billed is launch to terminate (README), the CloudTrail window to within 1 s
# (results/billed-windows.txt: cookbook-plink-real-g3 / -x8664-g3 / -amd-1020a). avg_cores is
# results/<chip>/footprint.txt's avg_busy_cores: cgroup cpu.stat over the real.sh window.
schema = 2
result_unit = "one full pipeline run: 22 Phase 3 autosomes imported, QC'd, pruned, PCA'd and scanned with --linear"

[workload]
size = { snps = 77818345, samples = 2504, chromosomes = 22 }
note = "one PLINK per chromosome, 16 in flight; the per-chromosome phase is disk-bound (~75 GB written to the root EBS volume), the --linear scan on 12,057,350 SNPs compute-bound"

[timing]
wall = "all of real.sh (chrom phase + PCA + association)"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "generation"]
equal_work = "records-kept"
attribution = "same-version-other-build"
attribution_note = "PLINK 1.90b7.7: aarch.bio's build on Graviton4, bioconda's linux-64 build (quay.io/biocontainers) on Intel and AMD; m8i's 16 vCPU are 8 cores plus SMT; the per-chromosome phase is disk-bound on every chip"

[[dataset]]
id = "s3://1000genomes/release/20130502/ALL.chr{1..22}.phase3_shapeit2_mvncall_integrated_v5a.20130502.genotypes.vcf.gz"
tier = "roda"
pins = "vcf.sha256"
note = "chr22's hash also checked against a direct RODA download; the same bytes under inputs/plink-real/ are read by plink2-real and bcftools-real"

[[dataset]]
id = "s3://1000genomes/release/20130502/integrated_call_samples_v3.20130502.ALL.panel + noise.txt (Python random.Random(20130502).gauss)"
tier = "built"
pins = "stage-inputs.sh"
note = "the panel is RODA; noise.txt is generated by stage-inputs.sh. Both full sha256s are in the pins.sha256 heredoc inside stage-inputs.sh"

# overhead = billed - tool wall, which the README prints as 204 / 124 / 93 s.
[[run]]
id = "genome-m8g"
in = ["chip"]
instance = "m8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
date = "2026-10-17"
date_source = "git"
workers = 16
wall_s = 2364
billed_s = 2568
usd_hr = 0.7181
compute_usd = 0.4716
billed_usd = 0.5122
peak_gib = 4.98
peak_kind = "rss"
avg_cores = 6.29
note = "chrom / PCA / assoc 1746 / 15 / 515 s; per-chromosome phase disk-bound (4.9 of 16 cores busy, 52% iowait)"

[[run]]
id = "genome-m8i"
in = ["chip"]
instance = "m8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
date = "2026-10-17"
date_source = "git"
workers = 16
threads_per_core = 2            # README: 8 cores plus SMT
wall_s = 2442
billed_s = 2566
usd_hr = 0.8467
compute_usd = 0.5743
billed_usd = 0.6035
peak_gib = 4.86
peak_kind = "rss"
avg_cores = 7.07
note = "chrom / PCA / assoc 1871 / 17 / 429 s"

[[run]]
id = "genome-m8a"
in = ["chip"]
instance = "m8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
date = "2026-10-21"
date_source = "git"
workers = 16
threads_per_core = 1            # README: siblings == cpu cores == 16
wall_s = 2228
billed_s = 2321
usd_hr = 0.9738
compute_usd = 0.6027
billed_usd = 0.6278
peak_gib = 4.96
peak_kind = "rss"
avg_cores = 5.09
note = "chrom / PCA / assoc 1838 / 12 / 272 s"

# --- checks: "What held at scale, on all three chips" -----------------------------------
# README: every output is a fixed point here and agrees byte for byte on all three chips.
[[check]]
id = "input-pins"
claim = "sha256 of all 22 VCFs and the panel == pins"
kind = "pin"
observed = "25 of 25"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "records-kept"
claim = "PLINK keeps exactly the records awk reads as biallelic ACGT SNPs, in order"
kind = "identity"
observed = "77,818,345 = 77,818,345"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "alt-count-eq-ac"
claim = "ALT count `C1` == INFO `AC`, every SNP"
kind = "reference"
observed = "0 mismatches"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "allele-count-eq-an"
claim = "`C1 + C2` == INFO `AN` (5008)"
kind = "conservation"
observed = "0 mismatches"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "superpop-counts"
claim = "per super-population ALT count == round(`<POP>_AF` × N), all 389,091,725 rows"
kind = "reference"
observed = "0 mismatches"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "superpop-sum"
claim = "the five populations' counts sum to `AC`"
kind = "conservation"
observed = "0 mismatches"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "no-missing"
claim = "missing calls, every SNP and sample"
kind = "identity"
observed = "0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "maf-recount"
claim = "`--maf 0.01` keeps exactly the SNPs with min(AC, AN−AC)/AN ≥ 0.01"
kind = "identity"
observed = "12,057,350, 0 disagree"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "eigvec-orthogonal"
claim = "10 eigenvectors: max |cos| over 45 pairs < 1e-5 (6 printed s.f.)"
kind = "identity"
bound = "< 1e-5"
observed = "6.9e-08"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "eigval-descending"
claim = "eigenvalues descending"
kind = "identity"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "linear-rows"
claim = "every QC SNP has a `--linear` row"
kind = "conservation"
observed = "12,057,350"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "planted-snp"
claim = "planted SNP unbeaten once PCs are covariates"
kind = "identity"
observed = "T² 583.2 vs next 70.1"
outcome = "pass"
across_chips = "identical"

# --- observed, not asserted ---------------------------------------------------------------
[[check]]
id = "hwe-pooled-vs-eur"
claim = "HWE at 1e-6 fails 2,659,909 SNPs (22%) pooled, but 69,471 (0.6%) within EUR"
kind = "reported"
observed = "2,659,909 pooled; 69,471 within EUR"
outcome = "reported"

[[check]]
id = "lambda-gc"
claim = "λGC unadjusted and with 10 PCs"
kind = "reported"
observed = "75.69 unadjusted, 1.0003 with 10 PCs; planted SNP ranks 62,679th unadjusted, first with PCs"
outcome = "reported"

[[check]]
id = "pc-centroids"
claim = "PC1 separates AFR (centroid +0.033) from everyone else, and PC2 separates EAS (−0.034) from EUR (+0.026)"
kind = "reported"
observed = "465,311 pruned SNPs"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "adjusted-na"
claim = "8 SNPs, all within 24 kb at chr2:91.80 Mb, come back `NA` from the PC-adjusted model"
kind = "reported"
observed = "8"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "repeated-records"
claim = "4 records appear twice verbatim in the release, for example `8:89329148:G:A`. PLINK keeps both"
kind = "reported"
observed = "4"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "top-hits"
claim = "the top 1,000 adjusted and unadjusted hits"
kind = "reported"
observed = "byte for byte on Graviton4, Intel and AMD"
outcome = "reported"
across_chips = "identical"

[[cross_code]]
with = "published:1000G-phase3-20130502-INFO"
same_bytes = true
metric = "PLINK allele counts vs the release's own INFO AC/AN and per-super-population AF, every SNP"
tolerance_basis = "exact: AF is printed to 4 decimals with N ≤ 1322, so round(AF × N) recovers the integer count"
check = "superpop-counts"

[[trap]]
id = "plink-openblas-threads-per-process"
scope = "tool"
symptom = "the `--linear` scan ran at ~80 SNPs/s per process, against ~4,100/s with `OPENBLAS_NUM_THREADS=1`, showing up as normal ~94% CPU per process"
cause = "PLINK's `--threads 1` does not reach OpenBLAS, which starts a thread per core in every process: 16 chromosome jobs made 256 threads on 16 cores"
fix = "set OPENBLAS_NUM_THREADS=1 whenever PLINK is parallelised by chromosome; read the core count before exporting OMP_NUM_THREADS, since GNU `nproc` honours it"
cost = "~50× on the scan: hours instead of 8.6 minutes"

[[trap]]
id = "plink-corename-probe-missed-usr-local"
scope = "method"
symptom = "this task's own probe looked under `/opt/conda` and missed bioconda's `/usr/local`"
cause = "biocontainers images install under /usr/local, not /opt/conda"
fix = "the corename (Cooperlake on AMD, OpenBLAS 0.3.29) was taken from plink2-real's PLINK 1.9 task on the same image"

[[trap]]
id = "plink-user-data-16k"
scope = "platform"
symptom = "spawn's user data is capped at 16 KiB"
cause = "the inline command the first two chips ran no longer fit"
fix = "stage genome-task.sh and check it against the sha256 in the spec's command"
