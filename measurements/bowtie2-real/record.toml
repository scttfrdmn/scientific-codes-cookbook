# measurements/bowtie2-real/record.toml -- #118 backfill.
schema = 1
result_unit = "one bowtie2 --local alignment of SRR062634 (24,148,993 read pairs) to GRCh38_full_analysis_set_plus_decoy_hla"

[[dataset]]
id = "s3://1000genomes/phase3/data/HG00096/sequence_read/SRR062634_{1,2}.filt.fastq.gz"
tier = "roda"
pins = "../bwa-real/pins.sha256"
note = "read from inputs/bwa-real/; hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "1000genomes GRCh38_full_analysis_set_plus_decoy_hla.fa (3,263,683,042 B)"
tier = "roda"
pins = "../bwa-real/pins.sha256"
note = "read from inputs/bwa-real/ (byte size also asserted in the build task); hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "bt2index.tar (bowtie2-build on GRCh38_full_analysis_set_plus_decoy_hla, 4,320,890,880 B)"
tier = "built"
pins = "pins.sha256"
note = "copied from the README and bt2index.tar.sha256 in the bucket (written by the build task); checked in-task"

[[dataset]]
id = "bwa-real aln.sorted.bam (bwa mem, same reads, same reference)"
tier = "run-output"
from_recipe = "bwa"
note = "measurements/bwa-real sort-small output; input to 02-bwa-crosscheck"

