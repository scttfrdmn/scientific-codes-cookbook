# measurements/bowtie2-real/record.toml -- #118 backfill.
# Schema 2: every row's billed is spawn's completion record (results/billed-windows.txt). The two
# x86 legs' README billed was the EC2 window (1246/761 s, kept as ec2_s) until #123 restated them on
# spawn's 1164/715 s. Dates are the completion records' UTC dates. peak is the task's sampled max
# of the container cgroup's memory.current (the specs' peak_rss_mib), not a process RSS.
schema = 2
result_unit = "one bowtie2 --local alignment of SRR062634 (24,148,993 read pairs) to GRCh38_full_analysis_set_plus_decoy_hla"

[workload]
size = { read_pairs = 24148993 }
note = "embarrassingly parallel over reads against one shared index (bt2index.tar, built once by 00-build-index); SAM streamed through an awk counter, never written"

[timing]
wall = "bowtie2 --local piped to the in-task awk counter, timed in-script (date +%s around the pipe)"
billed_basis = "spawn-task"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "workers", "size"]
equal_work = "primary-records"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "billed_usd" }
note = "2.06x faster and 36.8% cheaper per result Graviton2 -> Graviton5; Graviton3 -> Graviton4 is nearly cost-neutral (1.15x, -5.7%)"

[[series]]
id = "knee"
axis = "workers"
held = ["image", "input", "family", "generation", "size"]
equal_work = "primary-records"
attribution = "same-binary"
verdict = { shape = "no-knee", through = 64, on = "wall" }
note = "no speed knee through 64 (on wall): 4.00x on 4x the cores, 100.1% parallel efficiency, compute $ invariant ($0.1730-0.1737). The cost minimum is at 16 (on billed; the derived cost knee): billed $ rises only because ~84 s of fixed overhead is billed at the higher rate"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "primary-records"
attribution = "same-version-other-build"
attribution_note = "x86 legs run the recipe's pinned biocontainers bowtie2 2.5.5, and its default (not x86-64-v3) binary; c8i's 16 vCPUs are 8 cores with SMT, c8a's and c8g's 16 cores -- the likely reason, not separated by a measurement"

[[dataset]]
id = "s3://1000genomes/phase3/data/HG00096/sequence_read/SRR062634_{1,2}.filt.fastq.gz"
tier = "roda"
pins = "../bwa-real/pins.sha256"
note = "read from inputs/bwa-real/; hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "1000genomes GRCh38_full_analysis_set_plus_decoy_hla.fa (3,263,683,042 B)"
tier = "roda"
pins = "../bwa-real/pins.sha256"
note = "read from inputs/bwa-real/ (byte size also asserted in the build task); hashed 2026-10-25 on AWS, after the measurement's runs: the pin proves today's bytes, not necessarily the run's"

[[dataset]]
id = "bt2index.tar (bowtie2-build on GRCh38_full_analysis_set_plus_decoy_hla, 4,320,890,880 B)"
tier = "built"
pins = "pins.sha256"
note = "copied from the README and bt2index.tar.sha256 in the bucket (written by the build task); checked in-task"

[[dataset]]
id = "bwa-real aln.sorted.bam (bwa mem, same reads, same reference)"
tier = "run-output"
pins = "../bwa-real/outputs.sha256"
from_recipe = "bwa"
note = "measurements/bwa-real sort-small output; input to 02-bwa-crosscheck; hashed 2026-10-28 on AWS, after the runs (object last written 2026-09-30, before them)"

