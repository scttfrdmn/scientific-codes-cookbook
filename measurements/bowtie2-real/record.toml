# --- checks: the identity table, the in-task asserts, the bwa cross-check ---------------
[[check]]
id = "primary-records"
claim = "primary_records 48,297,986 on every run = exactly 2 × 24,148,993 read pairs"
kind = "conservation"
bound = "== 48297986"
observed = "48,297,986"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "primary-mapped"
claim = "primary_mapped"
kind = "reported"
observed = "48,198,738"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "primary-mapq30"
claim = "primary_mapq30"
kind = "reported"
observed = "40,042,364"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "alignment-rate"
claim = "overall alignment rate"
kind = "band"
bound = ">= 90%"
observed = "99.79%"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "index-inspect"
claim = "bowtie2-inspect reading the index back (3,366 sequences) is the gate"
kind = "sentinel"
observed = "3,366 sequences"
outcome = "pass"

[[check]]
id = "reference-bytes"
claim = "GRCh38_full_analysis_set_plus_decoy_hla.fa, 3,263,683,042 B (asserted in the build task)"
kind = "pin"
bound = "== 3263683042 B"
outcome = "pass"

[[check]]
id = "index-sha256"
claim = "the same index tar (sha256-checked in task)"
kind = "pin"
outcome = "pass"

[[check]]
id = "bwa-same-input"
claim = "bwa reports 48,297,986 primary records, exactly bowtie2's count"
kind = "identity"
bound = "== 48297986"
observed = "48,297,986"
outcome = "pass"

[[check]]
id = "chrom-concordance"
claim = "chromosome concordance — asserted, floor 0.999"
kind = "cross-code"
bound = ">= 0.999"
observed = "0.999615"
outcome = "pass"

[[check]]
id = "names-compared"
claim = "names compared (MAPQ≥30 on both sides)"
kind = "band"
bound = "> 10M"
observed = "19,974,019"
outcome = "pass"

[[check]]
id = "same-base"
claim = "same base, exactly"
kind = "reported"
observed = "0.924444"
outcome = "reported"

[[check]]
id = "within-100bp"
claim = "within 100 bp"
kind = "reported"
observed = "0.999563"
outcome = "reported"

[[cross_code]]
with = "measurements/bwa-real"
same_bytes = true
metric = "chromosome concordance over reads MAPQ>=30 on both sides (clip-invariant); position agreement reported as a curve over tolerances"
tolerance_basis = "chromosome assignment does not depend on soft-clipping convention; positional residual is bounded by the 100 bp read length (only 1,044 of 20 million disagree beyond it)"
check = "chrom-concordance"

[[trap]]
id = "bowtie2-softclip-position-metric"
scope = "method"
symptom = "position agreement within 5 bp against a 0.98 floor measured 0.980528 — a 0.05% margin"
blames = "the tools, read as disagreeing 1.9% of the time"
cause = "under --local, SAM POS is the leftmost aligned base, so a different soft-clip count shifts POS while both tools agree on placement; the 5 bp tolerance measured clipping convention"
fix = "assert the clip-invariant claim (same chromosome) and report position agreement as a curve over tolerances"

[[trap]]
id = "bowtie2-vacuity-guard-band"
scope = "method"
symptom = "the guard failed a valid run by 0.13%"
cause = "the vacuity guard required >20,000,000 names compared, a round number chosen without computing the comparable set, which is 19,974,019"
fix = "a 10M guard: unambiguously enough to mean something, nowhere near the observed value"

[[trap]]
id = "bowtie2-early-break-undercount"
scope = "method"
symptom = "the two runs report different chromosome-disagreement counts (6,457 then 7,681) on identical inputs"
blames = "non-determinism"
cause = "the first version broke out of its per-read loop on the first positional failure, masking chromosome disagreements in reads that had both"
fix = "check chromosome across all records before considering position; 7,681 is the correct attribution"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "x86 legs: each resolved spec's command staged as a sha256-checked file and run with bash"

[[upstream]]
