# measurements/cutadapt-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: the README's "task billed" is the EC2 window (CloudTrail RunInstances -> Terminate), to the
# second on all three chips (results/billed-windows.txt); spawn's completion windows are 45-88 s shorter.
schema = 2
result_unit = "one task: both whole runs (ERR2984773 even, ERR2935805 log) trimmed and every read checked"

[workload]
size = { samples = 2 }
note = "8,785,731 + 47,832,553 read pairs (2.65 + 9.66 Gbp) trimmed by the recipe command, then extra runs and check.py over every record; the task bill is mostly checks"

[timing]
wall = "per-sample cutadapt walls (main run, whole-second clock); the rows carry none, one task trims both"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "layout", "generation"]
equal_work = "filters"
attribution = "same-version-other-build"
attribution_note = "cutadapt 5.2: aarch.bio's build on Graviton4, bioconda's on Intel and AMD; output identical on all three"

[[dataset]]
id = "ENA PRJEB29504 ERR2984773_{1,2}.fastq.gz (ZymoBIOMICS D6300 even, MiSeq 2x151, whole run)"
tier = "roda"
pins = "pins.sha256"
note = "RODA .sra -> FASTQ.gz, staged by measurements/metaphlan-real/stage-inputs.sh; metaphlan-real profiles the same bytes"

[[dataset]]
id = "ENA PRJEB29504 ERR2935805_{1,2}.fastq.gz (ZymoBIOMICS D6310 log, HiSeq 1500 2x101, whole run)"
tier = "roda"
pins = "pins.sha256"
note = "RODA .sra -> FASTQ.gz, staged by measurements/metaphlan-real/stage-inputs.sh"

# One task trims both samples. The README's compute $/result is per sample (even / log), each with
# its own wall but no per-sample bill, so wall_s and compute_usd are left out and noted per row.
[[run]]
id = "trim-c8g"
in = ["chip"]
instance = "c8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-18"
date_source = "run"
workers = 16
ranks = 1
threads_per_rank = 16
billed_s = 1126
usd_hr = 0.6381
billed_usd = 0.1996
peak_gib = 0.28
peak_kind = "rss"
note = "walls 21 s even / 74 s log; compute $/result 0.0037 / 0.0131 (per sample, not per task)"

[[run]]
id = "trim-c8i"
in = ["chip"]
instance = "c8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-18"
date_source = "run"
workers = 16
ranks = 1
threads_per_rank = 16
billed_s = 1006
usd_hr = 0.7497
billed_usd = 0.2095
peak_gib = 0.25
peak_kind = "rss"
note = "walls 19 s even / 77 s log; compute $/result 0.0040 / 0.0160 (per sample, not per task)"

[[run]]
id = "trim-c8a"
in = ["chip"]
instance = "c8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-18"
date_source = "run"
workers = 16
ranks = 1
threads_per_rank = 16
billed_s = 941
usd_hr = 0.8622
billed_usd = 0.2254
peak_gib = 0.38
peak_kind = "rss"
note = "walls 12 s even / 45 s log; compute $/result 0.0029 / 0.0108 (per sample, not per task)"

# --- checks: "What held at scale, on all three chips"; observed = even; log ----------------
[[check]]
id = "ena-counts"
claim = "pairs, bases == ENA `read_count`, `base_count`"
kind = "reference"
bound = "== ENA read_count, base_count"
observed = "8,785,731 / 2,653,290,762; 47,832,553 / 9,662,175,706"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "prefix"
claim = "every trimmed read is a prefix of its input, sequence **and** quality"
kind = "identity"
bound = "0 exceptions"
observed = "0 exceptions; 0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "trimmed-lengths"
claim = "per mate, the histogram of removed lengths from the files == the report's `trimmed_lengths`"
kind = "identity"
bound = "0 differ"
observed = "149 lengths, 0 differ; 99, 0 differ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "with-adapter"
claim = "reads with something removed == `read{1,2}_with_adapter`; bases in and out == the files"
kind = "conservation"
bound = "=="
observed = "1,407,649 / 1,378,137; 1,801,335 / 1,771,027"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "no-exact-adapter-left"
claim = "**no untouched read contains the adapter exactly, or ends in an exact adapter prefix ≥ 3 bp**"
kind = "identity"
bound = "0"
observed = "**0 of 14.8M**; **0 of 92.1M**"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "filters"
claim = "main output == the raw pairs with both mates ≥ 10 bp and no `N`, `too_short` first, in order"
kind = "identity"
bound = "=="
observed = "8,778,584 kept, 1,110 + 6,037 filtered; 47,734,403, 2,378 + 95,772"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "j1-equals-j16"
claim = "`-j 1` writes the same records and counts as `-j 16`"
kind = "invariance"
bound = "identical"
observed = "identical (even only; not run on log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "bwa-quality-rule"
claim = "`-q 15,20` on each mate == the BWA rule, written from cutadapt's docs"
kind = "identity"
bound = "0 differ"
observed = "17.6M reads, 3.06M trimmed, 0 differ (even only; not run on log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "bases-balance"
claim = "Bases balance as `in = out + adapter-trimmed + left in filtered pairs`"
kind = "reported"
observed = "2,653,290,762 = 2,572,518,444 + 78,855,000 + 1,917,318 (even), and 9,662,175,706 = 9,593,898,054 + 48,980,685 + 19,296,967 (log)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "mates-agree"
claim = "Both mates agree on the insert in 91–92% of read-through pairs."
kind = "reported"
observed = "1,136,596 of 1,242,808 (even) and 797,317 of 870,472 (log)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "wrong-kit-adapter"
claim = "The wrong kit's adapter fails silently, at scale."
kind = "reported"
observed = "Nextera \"trims\" 188,329 R1 reads and exits 0; all but 241 are 3–9 bp chance matches"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "cross-chip-outputs"
claim = "The SHA-256 of every output record stream (main, `-j 1`, both `-q` runs), both removed-length histograms and every report count match on all three chips."
kind = "reported"
observed = "identical (results/compare.txt)"
outcome = "reported"
across_chips = "identical"
