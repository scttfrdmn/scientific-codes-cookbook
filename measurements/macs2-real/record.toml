# measurements/macs2-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is spawn's completion window (macs2real-gen-*; the x86 legs -x8664-q1 / -amd-q1).
# The Graviton rungs ran 2026-10-08; their date is the git date results landed.
schema = 2
result_unit = "one genome-wide peak call of ENCODE CTCF ChIP-seq ENCFF933NSJ against control ENCFF768XTH (HCT116, GRCh38)"

[workload]
size = { treatment_bytes = 2057454374, control_bytes = 3365735271 }
input_gib = 5.05
note = "one genome-wide macs2 callpeak, -f BAM -g hs -q 0.05; single-threaded by construction"

[timing]
wall = "macs2 callpeak alone, timed in-script (macs2_wall_s)"
billed_basis = "spawn-task"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "workers", "size"]
equal_work = "peak-count"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "billed_usd" }
note = "every generation is faster and cheaper per result; per-step speedup 1.44x, 1.32x, 1.26x"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "peak-count"
attribution = "same-version-other-build"
attribution_note = "x86 rows run bioconda's x86 build of the same MACS2 2.2.9.1 (quay.io/biocontainers); its OpenBLAS 0.3.27 picks Cooperlake on both x86 chips"

[[not_swept]]
axis = "workers"
reason = "MACS2 is single-threaded, so there is no core knee to find -- the generation axis is the whole question here"

[[dataset]]
id = "ENCODE ENCFF933NSJ.bam (treatment, 2,057,454,374 B) and ENCFF768XTH.bam (control, 3,365,735,271 B), s3://encode-public"
tier = "roda"
pins = "datasets.md5"
note = "ENCODE's published md5s (md5, not sha256), copied from stage-inputs.sh; checked in-task"

