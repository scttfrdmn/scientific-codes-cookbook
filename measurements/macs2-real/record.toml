# --- sizing instrument, not a recommendation ----------------------------------------
[[run]]
instance = "m8g.2xlarge"
purpose = "diagnostic"
date = "2026-10-20"
date_source = "git"
threads_per_core = 1
wall_s = 389
peak_gib = 7.6
peak_kind = "rss"
note = "clocking run before the sweep: tmpfs high-water 11.1 GiB against 5.05 GiB staged, which ruled out a 16 GiB box; unpriced in the README"

# --- checks: gen.sh's in-task asserts, plus the reported identity ---------------------
[[check]]
id = "encode-md5"
claim = "the bytes must match ENCODE's own published md5 before any compute"
kind = "pin"
bound = "md5sum -c"
outcome = "pass"

[[check]]
id = "peak-count"
claim = "50,276 peaks"
kind = "identity"
bound = "== 50276"
observed = "50,276"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "q-cutoff"
claim = "zero peaks below the `-q 0.05` cutoff"
kind = "identity"
bound = "0"
observed = "0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "summits"
claim = "summits == peaks"
kind = "identity"
bound = "=="
observed = "50,276"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "narrowpeak-sha256"
claim = "`real_peaks.narrowPeak` is byte-identical on all four generations (and both x86 chips)"
kind = "reported"
observed = "sha256 687b97a9bc39fed53555d7e566dd2d44f49cd926d1b91ebaea3ecc7c1638c54d"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "tmpfs-peak"
claim = "`tmpfs_peak_mib` on every rung"
kind = "reported"
observed = "11,409"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "chr20-vs-recipe"
claim = "whole-genome peaks on chr20 vs the shipped chr20-only recipe"
kind = "reported"
observed = "1,397 vs 1,390"
outcome = "reported"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "0.139.1's wrapper leaves under 1 KB of EC2's 16 KiB user data; gen.sh staged by sha256 instead of inline"

[[upstream]]
ref = "truffle#175"
role = "workaround"
note = "static price table has no Graviton coverage; rungs launched serially"

[[trap]]
id = "macs2-bucket-placeholder-not-substituted"
scope = "platform"
symptom = "stage-in fails on a literal `${COOKBOOK_BUCKET}` bucket name"
cause = "`spawn task run` does not substitute `${COOKBOOK_BUCKET}`"
fix = "pass a spec with the bucket resolved (sed it in before launch)"
