# checks: the README's "The identities, at scale, on all three chips" rows (claim = observable: assertion)
[[check]]
id = "womtool-validate"
claim = "the published WDL: `womtool validate` succeeds, sha256 `607eb8e2…`"
kind = "sentinel"
observed = "Success!"
outcome = "pass"

[[check]]
id = "workflow-succeeded"
claim = "workflow: Cromwell's metadata: `Succeeded`, 16 HaplotypeCaller calls + 1 merge, all `Done`"
kind = "sentinel"
observed = "16 + 1"
outcome = "pass"

[[check]]
id = "scatter-order"
claim = "scatter order: shard *i* was handed interval file *i*"
kind = "identity"
observed = "identical"
outcome = "pass"

[[check]]
id = "shard-vs-direct"
claim = "every shard: GVCF == the same command run directly, same image (body; `##GATKCommandLine` excluded)"
kind = "identity"
observed = "16 of 16"
outcome = "pass"

[[check]]
id = "merged-vs-direct"
claim = "merged GVCF: == `MergeVcfs` of the direct shards"
kind = "identity"
observed = "identical"
outcome = "pass"

[[check]]
id = "header-lines"
claim = "other header lines: no difference besides `##GATKCommandLine`"
kind = "identity"
observed = "0 lines"
outcome = "pass"

[[check]]
id = "cache-identical"
claim = "cache: identical resubmission: 17 of 17 calls are cache hits, output bytes == run 1"
kind = "identity"
observed = "17 / 17"
outcome = "pass"

[[check]]
id = "cache-one-edit"
claim = "cache: one input edited (`@CO` line in shard 0's interval file): exactly shard 0 and the merge re-run, 15 hits; output body == run 1"
kind = "identity"
observed = "15 hits, shard 0 + merge"
outcome = "pass"

[[check]]
id = "merge-conservation"
claim = "merge conservation: merged records == Σ shard records"
kind = "conservation"
observed = "7,653,025 (arm64) / 7,653,033 (x86)"
outcome = "pass"

[[check]]
id = "gvcf-coverage"
claim = "GVCF coverage: every base of the 63,948,766 calling-region bp is in a record, none outside"
kind = "conservation"
observed = "63,948,766 in, 0 out"
outcome = "pass"

[[check]]
id = "records-sorted"
claim = "records: sorted, sample `NA12878` (contigs: observed)"
kind = "identity"
observed = "yes (`chr20` only)"
outcome = "pass"

[[check]]
id = "scatter-conserves"
claim = "scatter (00-intervals): 16 shards conserve the 63,948,766 bp"
kind = "conservation"
observed = "63,948,766"
outcome = "pass"

# reported, not asserted: README calls the Graviton-vs-x86 difference a build difference, "not a path or a fixed point"
[[check]]
id = "cross-chip-calls"
claim = "Graviton4: the same calls, different likelihood arithmetic"
kind = "reported"
observed = "all 152,907 variant sites match the x86 set exactly, all 152,907 genotypes agree, 3 GQs differ; 7,652,193 records byte-identical; Intel and AMD byte-identical"
outcome = "reported"

[[trap]]
id = "cromwell-wdl-pericentromere-shard"
scope = "tool"
symptom = "Shard 7 covers chr20:29–33 Mb, the pericentromere. It takes 4,999 s, while the other fifteen take 172–1,621 s. For the last 56 minutes, 15 of 16 cores sit idle."
cause = "Intel's GKL PairHMM is x86-only; on Graviton every shard runs Java's `LOGLESS_CACHING` on one thread, and repeat-rich active regions hit it hardest"
fix = "Split that region more finely if you run this on Graviton"

[[trap]]
id = "cromwell-wdl-no-docker-socket"
scope = "platform"
symptom = "spawn's container path does not expose the socket"
cause = "Cromwell's local backend starts each task as a sibling container through the host's Docker socket"
fix = "run 01-run as a host task that installs Docker and runs Cromwell's container itself; mkspec.py, not scripts/spec_arch.py, writes the x86 and AMD specs"
