# measurements/cromwell-wdl-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "one sample's chr20 GVCF (NA12878, 36x), made by the workflow"

[[dataset]]
id = "NA12878.chr20.30x.bam (NYGC ERR3239334, chr20)"
