pins = "pins.sha256"
from_recipe = "gatk4"
note = "the BAM gatk4-real built; reused from recipes/gatk4's staged prefix, not copied"

[[dataset]]
id = "GRCh38 reference + dictionary (recipes/gatk4's)"
tier = "run-output"
from_recipe = "gatk4"
note = "reused, not copied; not listed in this dir's pins.sha256"

[[dataset]]
id = "RODA s3://broad-references wgs_calling_regions.hg38.interval_list"
