include required(classpath("application"))
call-caching { enabled = true, invalidate-bad-cache-results = true }
database {
  profile = "slick.jdbc.HsqldbProfile$"
  db {
    driver = "org.hsqldb.jdbcDriver"
    url = "jdbc:hsqldb:file:/tmp/cw/db/cromwell;shutdown=false;hsqldb.tx=mvcc"
    connectionTimeout = 120000
    numThreads = 1
  }
}
backend {
  default = "Local"
  providers {
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        concurrent-job-limit = 16
        run-in-background = true
        root = "/tmp/cw/cromwell-executions"
        runtime-attributes = """
          String? docker
          String? docker_user
        """
        submit = "/usr/bin/env bash ${script}"
        submit-docker = """
          /tmp/cw/bin/docker run --rm -i --user 1000:1000 --cgroup-parent=cwtask.slice -e PATH=/opt/conda/bin:/usr/local/bin:/usr/bin:/bin --entrypoint /bin/bash -v ${cwd}:${docker_cwd} ${docker} ${docker_script}
        """
        filesystems {
          local {
            localization: ["hard-link", "copy"]
            caching { duplication-strategy: ["hard-link", "copy"], hashing-strategy: "file" }
          }
        }
      }
    }
  }
}
