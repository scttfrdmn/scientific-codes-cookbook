# --- checks: the README's "What held at scale, on all three chips" rows -----------------
[[check]]
id = "read-md5"
claim = "reads match the md5s 1000 Genomes publishes in `sequence.index`"
kind = "pin"
observed = "6 of 6 files"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "read-count"
claim = "primary R1 records == published `READ_COUNT`, and R2 the same, per run"
kind = "reference"
observed = "24,148,993 / 24,332,665 / 24,824,114"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "record-conservation"
claim = "records == primary + supplementary + secondary"
kind = "conservation"
observed = "148,188,350 = 146,611,544 + 1,576,806 + 0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "alt-contigs"
claim = "ALT contigs read, both aligners"
kind = "identity"
observed = "3,171"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "sam-body-vs-bwa"
claim = "bwa-mem2 SAM body == bwa's, sha256, per run, `MQ:i` removed from bwa's"
kind = "cross-code"
observed = "3 of 3 runs, 0 lines differ"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "no-mq-tag"
claim = "bwa-mem2 writes no `MQ` tag; bwa writes one on every record"
kind = "identity"
observed = "0 / 148,188,350"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "native"
claim = "bwa-mem2 binary architecture == host"
kind = "native-arch"
observed = "183"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "cross-chip-bytes"
claim = "For each run, bwa's full SAM body hashes the same on Graviton4, Intel and AMD. bwa-mem2's does too, under three different SIMD kernels."
kind = "identity"
observed = "ALL AGREE WITH GRAVITON4"
outcome = "pass"
across_chips = "identical"

[[trap]]
id = "bwa-mem2-busybox-gzip-timed"
scope = "image"
symptom = "The recipe's AMD run took 1,114 s for `SRR062634`, with bwa-mem2 reporting 337 s of compute"
blames = "bwa-mem2 on x86"
cause = "the recipe's timed command pipes the SAM through `gzip -1`, and on x86 that times BusyBox's gzip, not bwa-mem2"
fix = "keep compression off the timed path; put `samtools` or a multithreaded compressor behind it in production"

[[trap]]
id = "bwa-mem2-version-mismatch"
scope = "image"
symptom = "`bwa-mem2 version` prints **2.2.1** from the package bioconda and aarch.bio both call 2.3"
cause = "package version != binary version"
fix = "record the binary's own version (tool_version 2.2.1)"
