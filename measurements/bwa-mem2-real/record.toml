# measurements/bwa-mem2-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed = spawn's completion record (results/<chip>/<tool>/completion.json, to the second), not
# launch-to-terminate as the README words it. avg cores is printed per mem run (3 values), so it is not authored.
schema = 2
result_unit = "one genome aligned (HG00096 low-coverage, 3 runs, 73,305,772 pairs)"

[workload]
size = { read_pairs = 73305772 }
note = "one bwa / bwa-mem2 mem per 1000 Genomes run (SRR062634, SRR062635, SRR062641), each with its own read group, against the whole GRCh38_full_analysis_set_plus_decoy_hla with ALT contigs"

[timing]
wall = "the three mem invocations summed, index load included (align.sh's timings.tsv)"
billed_basis = "spawn-task"

[[series]]
id = "chip-bwa"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "cross-chip-bytes"
attribution = "same-version-other-build"
attribution_note = "x86 rows run bioconda's x86 build of the same bwa (quay.io/biocontainers); Intel's 16 vCPUs are 8 cores x 2 threads"

[[series]]
id = "chip-mem2"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "cross-chip-bytes"
attribution = "same-version-other-build"
attribution_note = "x86 builds dispatch to bwa-mem2.avx512bw (64 lanes of 8-bit SIMD); the arm64 build reports AVX mode at 16 lanes"

[[dataset]]
id = "1000 Genomes s3://1000genomes/phase3/data/HG00096/sequence_read/SRR062634,SRR062635,SRR062641 _{1,2}.filt.fastq.gz"
tier = "roda"
pins = "datasets.md5"
note = "1000 Genomes' published md5s (md5, not sha256), copied from sample.tsv; checked in every task"

[[dataset]]
id = "GRCh38_full_analysis_set_plus_decoy_hla bwa index (the one RODA publishes)"
tier = "roda"
pins = "../bwa-real/pins.sha256"
from_recipe = "measurements/bwa-real"
note = "every task records its sha256; collect.sh requires all three chips to have read the same bytes; the sha256 it points at was hashed 2026-10-25 on AWS, after the measurement's runs: it proves today's bytes, not necessarily the run's"

[[dataset]]
id = "bwa-mem2 index of GRCh38_full_analysis_set_plus_decoy_hla (mem2-index.tar, 17.7 GB)"
tier = "run-output"
pins = "index.sha256"
from_recipe = "bwa-mem2"
note = "recipes/bwa-mem2 00-index tar; sha256 checked identical on all three chips"

[[run]]
id = "bwa-r8g"
in = ["chip-bwa"]
instance = "r8g.4xlarge"
purpose = "primary"
date = "2026-10-20"
date_source = "run"
workers = 16
threads_per_core = 1
wall_s = 2383
billed_s = 2662
usd_hr = 0.9426
compute_usd = 0.624
billed_usd = 0.697
peak_gib = 8.7
peak_kind = "vmhwm"
ranks = 1
threads_per_rank = 16
task = "01-bwa"
results = "results/arm64/bwa/"
note = "bwa; wall = the three mem invocations summed, index load included"

