# measurements/quantum-espresso-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is launch to terminate (README), the CloudTrail window to the second on all three
# chips and on the first Graviton4 run (results/billed-windows.txt).
schema = 2
result_unit = "one whole verified AUSURF112 run: two converged SCFs with forces (pw.x defaults and -nk 2) and the checks"

[workload]
size = { atoms = 112, bands = 800, electrons = 1232, kpoints = 2 }
note = "the QE Foundation's pw.x benchmark, run to a converged SCF with forces twice per task: defaults and -nk 2"

[timing]
wall = "both pw.x runs (defaults + -nk 2), the task's tool_wall_s"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "layout", "generation"]
equal_work = "cross-chip"
attribution = "same-version-other-build"
attribution_note = "the recipe's dft image on Graviton4, its linux-64 twin on Intel and AMD; conda-forge OpenBLAS 0.3.34 selects neoversev2 on Graviton4 and Cooperlake on both x86 chips; Intel's 16 vCPU are 8 cores x 2 threads"

[[not_swept]]
axis = "size"
reason = "AUSURF112 fits one 32 GiB node; the benchmark's other inputs either need many nodes (CNT10POR8, 1,532 atoms on 800 processes in its reference output) or, like GRIR443, are the same kind of run at larger scale"

[[dataset]]
id = "QEF/benchmarks @ eff15189: AUSURF112/ausurf.in + Au.pbe-nd-van.UPF"
tier = "durable-id"
pins = "inputs.sha256"
note = "run.sh edits electron_maxstep 2 -> 100 and conv_thr = 1.d-8, recorded in each run's input-edits.diff"

[[run]]
id = "scf-c8g"
in = ["chip"]
instance = "c8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-19"
date_source = "run"             # pw-A.out: starts on 19Oct2026
workers = 16
ranks = 16
threads_per_rank = 1
wall_s = 6271
billed_s = 6467
usd_hr = 0.6381
compute_usd = 1.112
billed_usd = 1.146
peak_gib = 23.4
peak_kind = "cgroup-memory.peak"
note = "defaults SCF 2,941 s (27 iterations, $0.521); largest rank ru_maxrss 1.37-1.55 GiB across chips"

[[run]]
id = "scf-c8i"
in = ["chip"]
instance = "c8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 16
ranks = 16
threads_per_rank = 1
wall_s = 3684
billed_s = 3826
usd_hr = 0.7497
compute_usd = 0.767
billed_usd = 0.797
peak_gib = 28.0
peak_kind = "cgroup-memory.peak"
note = "defaults SCF 1,784 s ($0.372); x86 cgroup peak includes the env install's page cache"

[[run]]
id = "scf-c8a"
in = ["chip"]
instance = "c8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 16
ranks = 16
threads_per_rank = 1
wall_s = 1667
billed_s = 1782
usd_hr = 0.8622
compute_usd = 0.399
billed_usd = 0.427
peak_gib = 28.0
peak_kind = "cgroup-memory.peak"
note = "defaults SCF 795 s ($0.190)"

[[run]]
id = "first-c8g"
instance = "c8g.4xlarge"
purpose = "diagnostic"
date = "2026-10-19"
date_source = "run"
workers = 16
ranks = 16
threads_per_rank = 1
billed_s = 6527
superseded_by = "scf-c8g"
note = "first Graviton4 run ($1.16): science passed, checks read an XML the benchmark never writes; same energies, forces and iteration counts, defaults SCF 2,941.9 s. README prints no task wall or billed seconds; billed_s is its CloudTrail window (results/billed-windows.txt), whose $ at 0.6381/hr is the README's $1.16; no usd_hr on this row, so no billed_usd"

# --- checks: the README's "What held at scale, on all three chips" rows (check.py) ----
[[check]]
id = "mpi-ranks"
claim = "QE 7.5, 16 MPI processes reported by `pw.x`"
kind = "rank-count"
bound = "== 16 launched"
observed = "16 / 16"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "npool"
claim = "`npool` = 1 and 2"
kind = "identity"
observed = "1, 2"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "system"
claim = "112 atoms, 800 bands, 1,232 electrons"
kind = "identity"
observed = "✓"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "scf-converged"
claim = "SCF converged, estimated accuracy < 1e-8 Ry"
kind = "sentinel"
bound = "< 1e-8 Ry"
observed = "8.3e-9 / 5.4e-9"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "energy-decomposition"
claim = "|E(defaults) − E(-nk 2)| < 1e-6 Ry"
kind = "invariance"
bound = "< 1e-6 Ry (100 × conv_thr)"
observed = "3.0e-8"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "forces-decomposition"
claim = "max |ΔF| ≤ the two runs' SCF corrections"
kind = "invariance"
bound = "≤ the summed Total SCF correction (5.8e-4 + 4.5e-4 Ry/au)"
observed = "3.1e-5 ≤ 1.0e-3"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "cross-chip"
claim = "collect.py: the same bounds between chips, against Graviton4 (total energy, all 336 force components, Fermi level)"
kind = "identity"
observed = "every check met at zero: −11427.09402180 Ry defaults, −11427.09402183 with pools, on all three chips"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "net-force-fermi"
claim = "net force on the slab; Fermi level under both decompositions (reported, not asserted)"
kind = "reported"
observed = "≤ 3e-8 Ry/au; 0.7845 eV both"
outcome = "reported"

[[check]]
id = "scf-path"
claim = "per-iteration energies and accuracy estimates across chips"
kind = "reported"
observed = "same 27 and 29 iterations; all identical except iteration 4's energy"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "iteration 4's energy differs in its last printed digit (1e-8 Ry) between the arm64 and x86 builds, both decompositions; Intel == AMD in every printed value"

[[trap]]
id = "quantum-espresso-ausurf-writes-no-xml"
scope = "method"
symptom = "the first Graviton4 run's science passed but its checks read an XML file the benchmark never writes"
cause = "the benchmark's disk_io = 'none' writes no XML"
fix = "read pw.x's output instead; rerun all three chips on the new spec"
cost = "$1.16"
