workers = 16
wall_s = 467
billed_s = 800
usd_hr = 0.7181
compute_usd = 0.093
billed_usd = 0.16
peak_gib = 0.4082
peak_kind = "rss"
note = "peak is the largest laspy worker ru_maxrss (418 MiB); the box cgroup memory.peak, 28.8 GiB, is mostly page cache of the 27.7 GB written"

[[run]]
instance = "m8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 16
wall_s = 651
billed_s = 1034
usd_hr = 0.8467
compute_usd = 0.153
billed_usd = 0.243
peak_gib = 0.4258
peak_kind = "rss"
note = "pointcloud env x86 twin. Worker ru_maxrss 436 MiB; box cgroup memory.peak 30.9 GiB"

[[run]]
instance = "m8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 16
wall_s = 389
billed_s = 660
usd_hr = 0.9738
compute_usd = 0.105
billed_usd = 0.179
