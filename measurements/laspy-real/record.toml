# measurements/laspy-real/record.toml -- #118 backfill.
schema = 1
result_unit = "the whole CA_LassenNP_2020 project (128 tiles, 4,642,900,288 points) split, written and checked"

[[dataset]]
id = "RODA s3://usgs-lidar/Projects/CA_LassenNP_LowerBearCreekHUC10_2020_D20/CA_LassenNP_2020/LAZ/ (128 objects, 26,173,428,355 B)"
tier = "roda"
pins = "pins.tsv"
note = "requester-pays; copied S3 to S3 by stage-inputs.sh. RODA listing in src.tsv; per-tile sha256 and MD5 in pins.tsv"

[[dataset]]
id = "USGS EPT ept-sources/manifest.json for CA_LassenNP_2020"
tier = "roda"
pins = "pins.sha256"
note = "as pinned by pointcloud-real"

[[dataset]]
id = "USGS CA_LassenNP_2020.vpc"
tier = "roda"
pins = "pins.sha256"

