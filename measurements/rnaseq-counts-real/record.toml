billed_s = 154
usd_hr = 0.3748
compute_usd = 0.0027
billed_usd = 0.016
peak_gib = 0.78
peak_kind = "vmhwm"
note = "featureCounts -T 8"

[[run]]
instance = "c8a.2xlarge"
purpose = "cross-chip"
results = "results/amd/featurecounts/"
host = "results/amd/featurecounts/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 8
wall_s = 17
billed_s = 124
usd_hr = 0.4311
compute_usd = 0.002
billed_usd = 0.0148
peak_gib = 0.78
peak_kind = "vmhwm"
note = "featureCounts -T 8"

