# measurements/rnaseq-counts-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is the spawn completion window, exactly (results/billed-windows.txt), although the
# README describes it as launch to terminate. featureCounts -T 1 ran in the -T 8 task: shared window.
# wall and peak (VmHWM) are each script's timing.txt.
schema = 2
result_unit = "one sample's verified count table (ERR188026, 15,800,127 pairs, 78,941 Ensembl 116 genes), per counting tool"

[workload]
size = { read_pairs = 15800127, genes = 78941 }
note = "one STAR-aligned BAM (2.9 GB, staged to tmpfs) counted per gene against the whole Ensembl 116 GTF"

[timing]
wall = "the counting command alone, timed in-script (timing.txt wall_s)"
billed_basis = "spawn-task"

[[series]]
id = "chip-fc-t8"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "cross-chip-bytes"
attribution = "same-version-other-build"
attribution_note = "subread 2.1.1: aarch.bio on Graviton4, bioconda's x86 build on Intel and AMD; Intel's 8 vCPUs are 4 cores x 2 threads"
note = "for featureCounts the boot is the bill: the chips differ by $0.001 per sample"

[[series]]
id = "chip-fc-t1"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "cross-chip-bytes"
attribution = "same-version-other-build"
attribution_note = "as chip-fc-t8"

[[series]]
id = "chip-htseq"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "cross-chip-bytes"
attribution = "same-version-other-build"
attribution_note = "HTSeq 2.1.2: aarch.bio on Graviton4, bioconda's x86 build on Intel and AMD; r8i.large is one core x 2 threads"
note = "HTSeq is one Python process; AMD is 1.71x faster than Graviton4 and Intel and the cheapest per result"

[[series]]
id = "threads-c8g"
axis = "workers"
held = ["image", "instance", "input", "size"]
equal_work = "fc-threads"
attribution = "same-binary"
note = "featureCounts -T 8 then -T 1 in one task on one box; counts and summary byte-identical"

[[series]]
id = "threads-c8i"
axis = "workers"
held = ["image", "instance", "input", "size"]
equal_work = "fc-threads"
attribution = "same-binary"
note = "featureCounts -T 8 then -T 1 in one task on one box; counts and summary byte-identical"

[[series]]
id = "threads-c8a"
axis = "workers"
held = ["image", "instance", "input", "size"]
equal_work = "fc-threads"
attribution = "same-binary"
note = "featureCounts -T 8 then -T 1 in one task on one box; counts and summary byte-identical"

[[dataset]]
id = "ENA ERR188026_{1,2}.fastq.gz (complete Geuvadis run)"
tier = "durable-id"
pins = "results/align/pins.txt"
note = "ENA fastq_md5 (md5, not sha256), checked on the box before alignment"

[[dataset]]
id = "Ensembl release-116 GRCh38.116.gtf.gz"
tier = "versioned-release"
pins = "inputs.sha256"
note = "also checked against Ensembl's CHECKSUMS sum in results/align/pins.txt"

[[dataset]]
id = "star-real's STAR index inputs/star-index-GRCh38-116/"
tier = "built"
pins = "results/align/index.sha256"
from_recipe = "measurements/star-real"

[[dataset]]
id = "STAR alignment of ERR188026 (reads.bam, ReadsPerGene.out.tab, Log.final.out), built once on Graviton4 by task 0"
tier = "built"
pins = "inputs.sha256"
note = "every counting task, on every chip, reads these same bytes"

# --- featureCounts -T 8; the billed window covers both thread counts ------------------------
[[run]]
id = "fc-t8-c8g"
in = ["chip-fc-t8", "threads-c8g"]
instance = "c8g.2xlarge"
purpose = "primary"
results = "results/arm64/featurecounts/"
host = "results/arm64/featurecounts/host.txt"
date = "2026-10-19"
date_source = "run"
workers = 8
ranks = 1
threads_per_rank = 8
wall_s = 26
billed_s = 168
usd_hr = 0.3191
compute_usd = 0.0023
billed_usd = 0.0149
peak_gib = 0.78
peak_kind = "vmhwm"
note = "featureCounts -T 8; container memory.peak 5.5 GB, mostly page cache"

[[run]]
id = "fc-t8-c8i"
in = ["chip-fc-t8", "threads-c8i"]
instance = "c8i.2xlarge"
purpose = "cross-chip"
