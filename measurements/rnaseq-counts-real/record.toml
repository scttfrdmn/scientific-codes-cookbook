# --- checks: "The identities, at scale, on all three chips"; observed is every chip's ------
[[check]]
id = "input-pins"
claim = "reads vs ENA / GTF vs Ensembl"
kind = "pin"
bound = "md5 / `sum` == published"
observed = "yes"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "star-input-pairs"
claim = "STAR input pairs"
kind = "reference"
bound = "== ENA `read_count`"
observed = "15,800,127"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "htseq-conservation"
claim = "HTSeq: genes + every `__` class"
kind = "conservation"
bound = "**== input pairs**"
observed = "15,800,127"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "star-readspergene-conservation"
claim = "STAR ReadsPerGene, each of 3 columns"
kind = "conservation"
bound = "**== input pairs**"
observed = "15,800,127"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "htseq-eq-star"
claim = "**HTSeq vs STAR GeneCounts (unstranded)**"
kind = "cross-code"
bound = "**identical, every gene**"
observed = "**0 of 78,941 differ**"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "htseq-classes-eq-star"
claim = "HTSeq `__no_feature` / `__ambiguous` / `__alignment_not_unique` / `__not_aligned`"
kind = "cross-code"
bound = "**== STAR's `N_` rows**"
observed = "448,202 / 2,202,143 / 898,248 / 291,590"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "unique-eq-star"
claim = "HTSeq unique classes, featureCounts assigned + no-features + ambiguity"
kind = "conservation"
bound = "**== STAR uniquely mapped**"
observed = "14,610,289"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-unmapped"
claim = "featureCounts unmapped"
kind = "conservation"
bound = "**== STAR unmapped + too-many-loci**"
observed = "291,590"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-multimapping"
claim = "featureCounts multimapping records"
kind = "band"
bound = "in [2, 10] × STAR multi-loci"
observed = "2,555,038 (2.84×)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-gene-sum"
claim = "featureCounts gene sum"
kind = "conservation"
bound = "**== its Assigned**"
observed = "12,637,595"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-threads"
claim = "featureCounts `-T 8` vs `-T 1`"
kind = "invariance"
bound = "**byte-identical counts and summary**"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-htseq-genes-differing"
claim = "featureCounts vs HTSeq: genes differing"
kind = "reported"
bound = "observation"
observed = "9,436"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "fc-ge-htseq"
claim = "**featureCounts ≥ HTSeq on every differing gene**"
kind = "identity"
bound = "**all**"
observed = "9,436 of 9,436"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-htseq-difference-is-ambiguity"
claim = "**Σ(featureCounts − HTSeq)**"
kind = "conservation"
bound = "**== HTSeq ambiguous − featureCounts ambiguity**"
observed = "677,651 == 677,651"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "no-feature-equal"
claim = "no-feature pairs, featureCounts vs HTSeq"
kind = "cross-code"
bound = "**equal**"
observed = "448,202"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fc-htseq-spearman"
claim = "Spearman, featureCounts vs HTSeq"
kind = "reported"
bound = "observation"
observed = "0.9901 (25,675 genes)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "star-stranded"
claim = "STAR stranded columns, forward / reverse"
kind = "reported"
bound = "observation"
observed = "7,393,223 / 7,387,405 (1.0008)"
outcome = "reported"
across_chips = "n/a"

[[check]]
id = "cross-chip-bytes"
claim = "`fc_counts.tsv` (`73c46d8b…`), the featureCounts summary, `htseq_counts.tsv` (`c2db026c…`) and both check files are byte-identical on Graviton4, Intel and AMD"
kind = "identity"
bound = "byte-identical"
observed = "identical (results/crosschip.txt)"
outcome = "pass"
across_chips = "identical"

[[cross_code]]
with = "measurements/star-real"
same_bytes = true
metric = "per-gene counts, HTSeq -s no vs STAR GeneCounts unstranded column, plus the four unassigned classes"
tolerance_basis = "exact: STAR's manual says its counts coincide with htseq-count's defaults (with -s no and secondary alignments ignored)"
check = "htseq-eq-star"

[[trap]]
id = "rnaseq-counts-fc-multimapper-records"
scope = "tool"
symptom = "featureCounts reports 2,555,038 multimapping for 898,248 multi-mapped pairs"
cause = "featureCounts' multimapper class counts alignment records, not pairs; adding --primary changed no count"
fix = "run the conservation identity through STAR's own log instead"

