# measurements/gfs-thickness-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "the whole verified cycle: every check, on all 209 forecast hours of gfs.20251001/00 at 0.25°"

[[dataset]]
id = "s3://noaa-gfs-bdp-pds/gfs.20251001/00/atmos/gfs.t00z.pgrb2.0p25.f{000…384} and .idx (418 objects, 113,141,207,953 B)"
tier = "roda"
pins = "gfs-cycle.sha256"
note = "source MD5s (single-part ETags) in gfs-cycle.md5; sha256s computed in-task after the MD5 check, identical on all three chips. Same cycle recipes/gfs-thickness reads at 1°"

# --- peak RSS is a compound "worker / container" cell, so peak_gib is omitted ----------
[[run]]
instance = "r8g.8xlarge"
purpose = "primary"
date = "2026-10-19"
date_source = "git"
workers = 32
host = "results/arm64/host.txt"
wall_s = 127.6
billed_s = 829
usd_hr = 1.8851
compute_usd = 0.0668
billed_usd = 0.4341
results = "results/arm64/"
note = "README peak RSS cell '2.68 / 56.1 GiB' (worker / container); host.txt prints memory.peak_gib 55.34, not 56.1. Stage-in 477 s"

[[run]]
instance = "r8i.8xlarge"
purpose = "cross-chip"
date = "2026-10-19"
date_source = "git"
workers = 32
host = "results/x86_64/host.txt"
wall_s = 222.5
billed_s = 1007
usd_hr = 2.2227
compute_usd = 0.1374
billed_usd = 0.6217
results = "results/x86_64/"
note = "README peak RSS cell '2.69 / 57.7 GiB' (worker / container). Stage-in 645 s; 32 processes on 16 cores x 2 SMT"

[[run]]
instance = "r8a.8xlarge"
purpose = "cross-chip"
date = "2026-10-19"
date_source = "git"
workers = 32
host = "results/amd/host.txt"
wall_s = 124.1
billed_s = 822
usd_hr = 2.5562
compute_usd = 0.0881
billed_usd = 0.5837
results = "results/amd/"
note = "README peak RSS cell '2.69 / 47.7 GiB' (worker / container). Stage-in 515 s"

# --- checks: "What held at scale, on all three chips" ----------------------------------
[[check]]
id = "source-md5"
claim = "418 staged files == the MD5 that S3 serves at source (single-part ETags); sha256 recorded"
kind = "pin"
observed = "418 / 418, identical `gfs-cycle.sha256`"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "messages-vs-idx"
claim = "eccodes decodes 155,240 messages == 155,240 `.idx` records"
kind = "identity"
bound = "=="
observed = "equal, every hour"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "byte-tiling"
claim = "every message starts at the `.idx` byte offset; messages tile each file exactly to its last byte"
kind = "conservation"
observed = "209 / 209"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "endstep"
claim = "every message's `endStep` == the `.idx` forecast end-hour == the file's hour; reference time 2025-10-01 00Z"
kind = "identity"
observed = "155,240 / 155,240"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "names-two-decoders"
claim = "every TMP/RH/HGT isobaric record is the eccodes field the inventory names, at that pressure"
kind = "identity"
observed = "0 mismatches"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "bitmap-missing"
claim = "1,038,240 points per message; missing values == the bitmap count wherever one exists"
kind = "conservation"
observed = "5,260,523,634 bitmap-missing points, all accounted for"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "cfgrib-levels"
claim = "cfgrib's `t`, `r`, `gh` share one 33-level vector, and every level is bit-identical to eccodes' own decode"
kind = "identity"
observed = "209 × 99 fields identical"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "thickness-vs-numpy"
claim = "MetPy's grid thickness == an independent numpy trapezoid in ln p"
kind = "identity"
observed = "max rel 8.6e-16"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "grid-vs-profile"
claim = "MetPy's grid call == its documented 1-D profile call on 205 columns per hour"
kind = "identity"
observed = "max rel 3.9e-16"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "hypsometric"
claim = "hypsometric thickness vs the file's own Z500 − Z1000, every column with surface pressure ≥ 1000 hPa"
kind = "identity"
bound = "≤ 2% (discretisation)"
observed = "max 0.745% (f015, 38.0°N 61.25°W); p99 ≤ 0.051%; median 0.0066%"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "theta-involution"
claim = "θ(p,T) → T(p,θ) over the whole 3-D field"
kind = "invariance"
observed = "max 5.7e-14 K over 7.16e9 values"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "below-ground"
claim = "Below ground, where the surface pressure is under 1000 hPa (45% of columns: continents, ice sheets), GFS's 1000 hPa temperature and height are extrapolated"
kind = "reported"
observed = "up to 4.43% (median 0.016%)"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "decode-crosschip"
claim = "Decode (fixed point): byte-identical on all three"
kind = "reported"
observed = "one sha256 over all 1.6e11 decoded values, 2f03901b… on Graviton4, Intel and AMD"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "thickness-crosschip"
claim = "Thickness: Intel == AMD bit for bit, both ≠ Graviton4 in the last bits"
kind = "reported"
observed = "162,675 (0.075%) of 216,992,160 differ; max 2.7e-12 m, 3 ulp"
outcome = "reported"
across_chips = "fixed-point"
across_chips_evidence = "Graviton4 vs either x86: 162,675 of 216,992,160 differ, max 2.7e-12 m, 3 ulp (relative 4.7e-16); Intel == AMD on every value. Closed-form, no difference grows (README: 'not a path')"

[[trap]]
id = "gfs-thickness-below-ground-extrapolation"
scope = "data"
symptom = "hypsometric thickness disagrees with the file's Z500 − Z1000 by up to 4.43%, outside the recipe's 2% bound"
blames = "MetPy"
cause = "where surface pressure is under 1000 hPa (45% of columns), GFS's 1000 hPa temperature and height are extrapolated; a property of the extrapolation, not of MetPy"
fix = "mask to columns with surface pressure ≥ 1000 hPa; the mask is part of the claim"
