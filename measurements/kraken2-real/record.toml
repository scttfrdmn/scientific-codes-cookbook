# measurements/kraken2-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "both Zymo mock-community runs (ERR2984773 even + ERR2935805 log) classified in one task"

[[dataset]]
id = "ENA PRJEB29504 ERR2984773 + ERR2935805 (ZymoBIOMICS D6300 even / D6310 log, Nicholls et al. 2019), whole runs"
tier = "roda"
pins = "pins.sha256"
from_recipe = "measurements/metaphlan-real"
note = "the same staged bytes metaphlan-real profiles (RODA -> FASTQ.gz)"

[[dataset]]
id = "k2_standard_08gb_20250402"
tier = "versioned-release"
pins = "pins.sha256"
from_recipe = "kraken2"

[[dataset]]
id = "zymo.tsv (ZymoBIOMICS D6300 / D6310 compositions)"
tier = "durable-id"
