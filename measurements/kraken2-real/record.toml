# checks table in '## What held at scale, on all three chips': columns ['claim', 'why it must hold', 'even', 'log']
[[check]]
id = "read-count"
claim = "pairs processed == ENA `read_count`"
kind = "conservation"
observed = "8,785,731 (even); 47,832,553 (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "base-count"
claim = "Mbp kraken2 prints == ENA `base_count`"
kind = "conservation"
observed = "2653.29 (even); 9662.18 (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "books"
claim = "classified + unclassified == processed"
kind = "conservation"
observed = "8,133,504 + 652,227 (even); 40,267,635 + 7,564,918 (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "report-vs-log"
claim = "report root / unclassified rows == the log's two counts"
kind = "identity"
observed = "yes (even); yes (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "clade-tree"
claim = "every clade == its taxon reads + its children's clades"
kind = "conservation"
observed = "5,309 clades, 0 off (even); 7,194, 0 off (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "per-read-tally"
claim = "per-read output, tallied by taxid == report's taxon reads"
kind = "identity"
observed = "3,438 taxids, 0 off (even); 4,700, 0 off (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "closed-list"
claim = "unexpected genera above 1% of classified"
kind = "reference"
bound = "above 1% of classified"
observed = "0 (largest Mycobacterium 0.18%) (even); 0 (0.025%) (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "top8-zymo"
claim = "top 8 genera == the 8 Zymo bacteria"
kind = "reference"
observed = "yes (even)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "top3-log-order"
claim = "top 3 genera, in order == 89.1% > 8.9% > 0.89%"
kind = "reference"
observed = "Listeria > Pseudomonas > Bacillus (log)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "per-read-bytes"
claim = "per-read output (941 MB even, 3.98 GB log) and each report: same sha256 on all three chips"
kind = "reported"
observed = "identical"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "vs-metaphlan"
claim = "Against MetaPhlAn on the same bytes: both find all 8 bacteria in the even run"
kind = "reported"
observed = "MetaPhlAn Bacillus 0.055%; kraken2 11.8%"
outcome = "reported"

[[cross_code]]
with = "measurements/metaphlan-real"
same_bytes = true
metric = "the 8 Zymo bacteria found in the even run (observation; the two estimate different quantities)"
check = "vs-metaphlan"
