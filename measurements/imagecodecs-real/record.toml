# measurements/imagecodecs-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "the whole cohort: 160 annotated CAMELYON16 slides, 321 GB, every tile transcoded to JPEG XL and rebuilt"

[[dataset]]
id = "RODA s3://camelyon-dataset/CAMELYON16/ (the 160 annotated slides and their LZW tumour masks)"
tier = "roda"
pins = "pins.sha256"
note = "pins.sha256 pins the cohort manifest slides.tsv (measurements/pathology-real's, read from its staged copy), which carries the publisher's md5 for every image and mask; the md5s are checked over the streamed bytes in-task. Streamed in place, never copied"

[[run]]
instance = "c8g.16xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 64
wall_s = 2429
billed_s = 2492
usd_hr = 2.5523
compute_usd = 1.722
billed_usd = 1.767
peak_gib = 0.5166               # 529 MiB, largest single worker; box cgroup peak 13.2-15.0 GB
peak_kind = "rss"

[[run]]
instance = "c8i.16xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 64
wall_s = 3187
billed_s = 3237
usd_hr = 2.9987
compute_usd = 2.655
billed_usd = 2.696
peak_gib = 0.5225               # 535 MiB
peak_kind = "rss"

[[run]]
instance = "c8a.16xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-21"
date_source = "run"
workers = 64
wall_s = 1940
billed_s = 1979
usd_hr = 3.4487
compute_usd = 1.858
billed_usd = 1.896
peak_gib = 0.5215               # 534 MiB
peak_kind = "rss"

# --- checks: '## What held at scale' (asserted per slide by real.py; same on all three chips) ---
[[check]]
id = "publisher-md5"
claim = "image and mask match the publisher's md5"
kind = "pin"
bound = "provenance"
observed = "320 / 320 objects"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "tile-grid"
claim = "page format, tile grid = ⌈H/t⌉·⌈W/t⌉, tile ranges disjoint and inside the file"
kind = "identity"
bound = "the TIFF is what it says"
observed = "1,653 WSI and 1,443 mask pages"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "splice-decodes"
claim = "**the spliced stream decodes to tifffile's own pixels**"
kind = "identity"
bound = "pruning the tables is a header edit, not an image edit"
observed = "**14,352,374 / 14,352,374 tiles**"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "jxl-roundtrip"
claim = "**`jpegxl_decode_jpeg(jpegxl_encode_jpeg(s)) == s`**"
kind = "identity"
bound = "JPEG XL's lossless JPEG recompression"
observed = "**14,352,374 / 14,352,374, 0 refused**"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "tiff-tile-recovered"
claim = "the TIFF tile is recovered byte for byte from the rebuilt stream"
kind = "identity"
bound = "the archive can be restored"
observed = "14,352,374 / 14,352,374"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mask-lzw-two-decoders"
claim = "**mask tiles: imagecodecs' LZW == libtiff's (through Pillow)**"
kind = "cross-code"
bound = "two independent LZW decoders"
observed = "**3,256,103 tiles, 0 differ** (11,096,060 sparse)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "pixel-codecs-roundtrip"
claim = "16 lossless pixel codecs round-trip every 1,024th level-0 tile, `array_equal`"
kind = "identity"
bound = "lossless means identical"
observed = "10,574 tiles × 16, 0 differ"
outcome = "pass"
across_chips = "identical"

# --- across chips (compare.py) ---
[[check]]
id = "decoded-rgb-cross-chip"
claim = "decoded RGB, sha256 over every tile of every page"
kind = "identity"
bound = "integer decode, asserted"
observed = "160 / 160 identical"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "jxl-bitstream-cross-chip"
claim = "JPEG XL bitstream sha256"
kind = "reported"
observed = "0 / 160"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "0 / 160 slides' JPEG XL sha256 match Graviton4 vs x86; +5,061 B of 237.69 GB (+2 ppm), per slide −1,185 to +2,031 B; Intel == AMD bit for bit"

[[check]]
id = "libjxl-vs-turbo-decode"
claim = "libjxl's pixel decode vs libjpeg-turbo, |diff| histogram (every tile from level 2 up)"
kind = "reported"
observed = "62.78% exact, 95.31% within 1, 98.95% within 2, at most 32 apart"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "within 2: 98.953% vs 98.952% (float path)"

[[check]]
id = "archive-saving"
claim = "JPEG tile data → JPEG XL, every byte recoverable"
kind = "reported"
observed = "320.67 GB → 237.69 GB, 1.349×"
outcome = "reported"

