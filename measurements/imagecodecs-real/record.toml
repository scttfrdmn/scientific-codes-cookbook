[[trap]]
id = "imagecodecs-libjxl-refuses-splice"
scope = "tool"
symptom = "`jpegxl_encode_jpeg` rejects it with `JXL_ENC_ERR_GENERIC` on every tile (a TIFF tile with all of JPEGTables spliced in, which libjpeg-turbo decodes)"
cause = "an unreferenced quantisation table (CAMELYON16's tables define 0 and 1, tiles use only 0), and on the 95 Radboud slides a table defined twice (a stripped overview image defines its own)"
fix = "splice only the tables a tile references and does not define itself; jpegtran -copy none is accepted but re-codes the entropy data, so the rebuild would not be the TIFF's"
