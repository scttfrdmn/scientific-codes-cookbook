# --- checks: the four in-task assertions in results/smoke-check-*.txt -----------------
[[check]]
id = "read-count"
claim = "reads_before want exactly 48297986 (== bwa's primary records, 48817006 total - 519020 suppl.)"
kind = "identity"
bound = "exact"
observed = "48297986"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "filter-conservation"
claim = "accounted_for want == reads_before [CONSERVATION]"
kind = "conservation"
bound = "exact"
observed = "48297986"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mates-paired"
claim = "out2_reads want == out1 (mates stay paired)"
kind = "identity"
bound = "exact"
observed = "22772943"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "outputs-passed"
claim = "out1+out2 want == passed_filter"
kind = "identity"
bound = "exact"
observed = "45545886"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "q30-rate"
claim = "q30_rate (observation)"
kind = "reported"
observed = "0.90576"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "dup-rate"
claim = "fastp_dup_rate 0.00274475 (observation; sequence-based, not picard's 0.008684 by position)"
kind = "reported"
outcome = "reported"
across_chips = "identical"

[[upstream]]
