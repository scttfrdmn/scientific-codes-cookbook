# measurements/fastp-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: the x86 rows' billed is the EC2 window (CloudTrail, results/billed-windows.txt, to the
# second). The Graviton4 rows' 226 s reproduces no surviving window (spawn: 154 s c8g, 162 s m8g):
# unattributed. tmpfs_peak_gib is the smoke check's tmpfs_peak_used_mb / 1024.
schema = 2
result_unit = "one complete SRR062634 run QC'd and trimmed (48,297,986 reads, 4.83 Gbp)"

[workload]
size = { reads = 48297986, bases = 4829798600, read_length = 100 }
input_gib = 3.6
note = "gzip decompression and recompression around a cheap per-read filter; input and ~3.4 GiB of output both live in host /tmp (tmpfs = half of RAM), which picks the box"

[timing]
wall = "fastp's wall, timed in-task (smoke check wall_s)"
billed_basis = "ec2"

[[series]]
id = "threads-graviton4"
axis = "workers"
held = ["image", "input", "size", "generation"]
equal_work = "filter-conservation"
attribution = "same-binary"
attribution_note = "8 threads on m8g.2xlarge vs 16 on c8g.4xlarge: the family changes with the core count, because both need 32 GiB for staging"
verdict = { shape = "cost-climbs", through = 16, on = "billed_usd" }
note = "8 -> 16 threads bought 1.16x; the 8-vCPU m box is 44% cheaper"

[[series]]
id = "threads-intel"
axis = "workers"
held = ["image", "input", "size", "generation"]
equal_work = "filter-conservation"
attribution = "same-binary"
attribution_note = "m8i.2xlarge vs c8i.4xlarge; Intel's 8 vCPU is 4 cores x 2 hyperthreads"
verdict = { shape = "cost-climbs", through = 16, on = "billed_usd" }
note = "8 -> 16 threads bought 1.79x; even so c8i does not pay for itself"

[[series]]
id = "threads-amd"
axis = "workers"
held = ["image", "input", "size", "generation"]
equal_work = "filter-conservation"
attribution = "same-binary"
attribution_note = "m8a.2xlarge vs c8a.4xlarge"
verdict = { shape = "cost-climbs", through = 16, on = "billed_usd" }
note = "8 -> 16 threads bought 1.45x"

[[series]]
id = "chip-8t"
axis = "chip"
held = ["input", "workers", "layout", "size", "generation"]
equal_work = "filter-conservation"
attribution = "same-version-other-build"
attribution_note = "aarch.bio's arm64 image on Graviton4; bioconda's linux/amd64 build of fastp 1.3.6 on both x86 chips"

[[series]]
id = "chip-16t"
axis = "chip"
held = ["input", "workers", "layout", "size", "generation"]
equal_work = "filter-conservation"
attribution = "same-version-other-build"
attribution_note = "aarch.bio's arm64 image on Graviton4; bioconda's linux/amd64 build of fastp 1.3.6 on both x86 chips"

[[dataset]]
id = "SRA SRR062634 (complete run, 100 bp paired)"
tier = "roda"
pins = "../bwa-real/pins.sha256"
from_recipe = "bwa-samtools"
note = "RODA s3://1000genomes SRR062634_{1,2}.filt.fastq.gz as staged by bwa-samtools (fastp reads bwa's reads); R1/R2 sha256 printed in each results/smoke-check-*.txt but no committed manifest; the sha256 it points at was hashed 2026-10-25 on AWS, after the measurement's runs: it proves today's bytes, not necessarily the run's"

[[run]]
id = "c8g-16t"
in = ["threads-graviton4", "chip-16t"]
instance = "c8g.4xlarge"
purpose = "primary"
results = "results/smoke-check-c8g4xl-16t.txt"
date = "2026-10-01"
date_source = "git"
workers = 16
threads_per_core = 1
wall_s = 31
billed_s = 226
usd_hr = 0.6381
billed_usd = 0.0401
ranks = 1
threads_per_rank = 16
tmpfs_peak_gib = 6.9492
billed_basis = "unattributed"
note = "tmpfs peak 7,116 MB (staging high-water mark, not process memory; no peak_kind fits)"

