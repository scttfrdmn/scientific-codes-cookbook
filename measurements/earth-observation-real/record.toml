# measurements/earth-observation-real/record.toml -- r2, all three chips. Every run exits 1 on the
# BOA-offset guard (one scene, Element84/earth-search#66), reported failing on purpose.
schema = 1
result_unit = "one tile-year composited (Sentinel-2 L2A 11SKA, 2024: 153 scenes, 31.9 GB) plus every check"

[[dataset]]
id = "s3://sentinel-cogs/sentinel-s2-l2a-cogs/11/S/KA/2024/ (B04, B08, SCL of 153 scenes)"
tier = "roda"
pins = "pins.sha256"
note = "read in place over HTTPS, hashed in-task; the path is not immutable (seven S2C scenes' bands dated 2026)"

[[dataset]]
id = "Earth Search STAC items for the 153 scenes (sentinel-cogs <scene>/<id>.json)"
tier = "roda"
pins = "pins.sha256"
note = "the reference (ESA's published percentages, raster:bands, boa_offset_applied); copied to the bucket S3-to-S3"

[[run]]
instance = "r8g.4xlarge"
purpose = "primary"
spawn_version = "0.142.0"
date = "2026-10-24"
workers = 16
host = "results/arm64/host.txt"
wall_s = 106.1
billed_s = 286
usd_hr = 0.9426
compute_usd = 0.0278
billed_usd = 0.0749
peak_gib = 59.1
peak_kind = "cgroup-memory.peak"
results = "results/arm64"
note = "exit 1: the offset guard fails on S2C_11SKA_20241206_1_L2A; every output written and staged"

[[run]]
instance = "r8i.4xlarge"
purpose = "cross-chip"
spawn_version = "0.142.0"
date = "2026-10-24"
workers = 16
host = "results/x86_64/host.txt"
wall_s = 148.1
billed_s = 291
usd_hr = 1.1114
compute_usd = 0.0457
billed_usd = 0.0898
peak_gib = 59.7
peak_kind = "cgroup-memory.peak"
results = "results/x86_64"
note = "exit 1, same scene; 16 workers on 8 SMT cores"

[[run]]
instance = "r8a.4xlarge"
purpose = "cross-chip"
spawn_version = "0.142.0"
date = "2026-10-24"
workers = 16
host = "results/amd/host.txt"
wall_s = 104.6
billed_s = 281
usd_hr = 1.2781
compute_usd = 0.0371
billed_usd = 0.0998
peak_gib = 51.6
peak_kind = "cgroup-memory.peak"
results = "results/amd"
note = "exit 1, same scene"

[[check]]
id = "pins"
claim = "459 band objects + 153 STAC items match sha256 pins"
kind = "pin"
bound = "exact"
observed = "612/612"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "grid-vs-item"
claim = "every raster's shape, EPSG and transform == its item's `proj:*`"
kind = "reference"
bound = "exact"
observed = "459/459"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "one-grid"
claim = "one CRS and transform for the whole year"
kind = "identity"
bound = "exact"
observed = "1"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "rasterio-eq-tifffile"
claim = "rasterio == tifffile + imagecodecs, every pixel"
kind = "cross-code"
bound = "exact"
observed = "459 rasters, 41.5 G px"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "windowed-reads-conserve"
claim = "block-windowed reads conserve the full read (SCL histogram, B04 sum)"
kind = "conservation"
bound = "exact"
observed = "306/306"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "esa-percentages"
claim = "ESA's 1,764 published percentages, from the pixels"
kind = "reference"
bound = "5e-7 + 4·2^-24·value"
observed = "worst 0.99 of the bound"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "veg-red-positive"
claim = "median red reflectance over ESA vegetation > 0, offset chosen per item from the flag"
kind = "identity"
bound = "> 0 on every scene with vegetation"
observed = "fails: 129 of 130 (S2C_11SKA_20241206_1_L2A: -0.0572)"
outcome = "fail"
across_chips = "identical"

[[check]]
id = "ndvi-range"
claim = "NDVI from reflectance within [−1, 1]"
kind = "identity"
bound = "[-1, 1]"
observed = "153/153"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "composite-count-conserves"
claim = "Σ composite count == Σ per-scene clear observations"
kind = "conservation"
bound = "exact"
observed = "6,074,075,564"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "composite-where-observed"
claim = "composite finite exactly where the count is > 0"
kind = "identity"
bound = "exact"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "cog-roundtrip"
claim = "both COGs read back equal by rasterio and by tifffile"
kind = "cross-code"
bound = "exact"
observed = "every px"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "order-veg-over-bare"
claim = "p10(vegetation) > p90(not_vegetated)"
kind = "reported"
bound = "—"
observed = "127 of 129 scenes"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "water-ndvi-negative"
claim = "mean NDVI(water) < 0"
kind = "reported"
bound = "—"
observed = "65 of 76; defined on 98.31% of ESA-water 20 m px"
outcome = "reported"
across_chips = "identical"

[[upstream]]
ref = "Element84/earth-search#66"
role = "cited"
note = "boa_offset_applied false on an item whose DNs are already offset; our S2C_11SKA_20241206_1 case is added there. The cause of the failing guard."

[[upstream]]
ref = "scttfrdmn/scientific-codes-cookbook#120"
role = "cited"
note = "the double-applied offset this run corrects"
