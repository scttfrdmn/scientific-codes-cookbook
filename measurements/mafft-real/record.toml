# measurements/mafft-real/record.toml -- drafted by the #118 extraction, then authored.
# The README prices two modes per chip ("L-INS-i --threadit 0 / threaded refinement"), each with
# its own tool wall, so each chip has two run rows. Billed $/result is left out of every row: it is
# tool wall + that chip's overhead, and the README gives the overhead only as a 34-47 s range.
# Schema 2: one task per chip ran all five alignments, so every row's billed basis is the shared
# spawn window (results/billed-windows.txt: 1283 / 1405 / 1015 s, as the README prints).
# peak_gib is the 5 s max of memory.stat anon (real.sh), the same on every row of a chip.
schema = 2
result_unit = "one L-INS-i alignment of the whole Pfam 38.2 PF01255.25 seed (919 sequences), in the row's refinement mode"

[workload]
size = { sequences = 919, residues = 207712 }
note = "one task per chip aligns the family five times (L-INS-i --threadit 0 twice, threaded refinement twice, --auto once); a row is the mean of a mode's two runs"

[timing]
wall = "one mafft invocation, timed in-script (mean of the mode's two runs)"

[[series]]
id = "chip-linsi"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "linsi-reproducible"
attribution = "same-version-other-build"
attribution_note = "MAFFT 7.525: aarch.bio's arm64 build on Graviton4, bioconda's x86 build on Intel and AMD; Intel's 8 vCPU are 4 cores x 2 SMT"
note = "--threadit 0: a serial refinement, 1.28-1.50 cores busy"

[[series]]
id = "chip-mt"
axis = "chip"
held = ["input", "size", "workers", "layout", "generation"]
equal_work = "none: threaded refinement follows a different path on every run (six runs, six alignments)"
attribution = "same-version-other-build"
attribution_note = "MAFFT 7.525: aarch.bio's arm64 build on Graviton4, bioconda's x86 build on Intel and AMD; Intel's 8 vCPU are 4 cores x 2 SMT"
note = "threaded refinement: all 8 vCPU busy"

[[dataset]]
id = "Pfam 38.2 PF01255.25 (Prenyltransf) seed, gaps removed: pf01255.25_unaligned.fa"
tier = "versioned-release"
pins = "pins.sha256"
from_recipe = "measurements/iqtree-real"
note = "extracted from iqtree-real's staged Pfam-A.seed.gz; md5 checked against EBI's md5_checksums"

[[dataset]]
id = "Pfam 38.2 PF01255.25 curated seed alignment: pf01255.25_ref.fa"
tier = "versioned-release"
pins = "pins.sha256"
note = "the SP/TC reference; byte-identical to iqtree-real's pf01255.25_seed.fa once uppercased and . -> -"

