# measurements/transcript-assembly-real/record.toml -- drafted by the #118 extraction, then authored.
schema = 1
result_unit = "one sample's assembly, checked: Geuvadis ERR188026 (15.8M pairs) through StringTie (de novo + guided) or gffcompare"

[[dataset]]
id = "ENA ERR188026_{1,2}.fastq.gz (complete Geuvadis run)"
tier = "durable-id"
unpinned = "pinned by ENA's fastq_md5, checked on the box (results/align/pins.txt); no sha256 manifest"
note = "same reads as salmon-real, star-real and rnaseq-counts-real"

[[dataset]]
id = "Ensembl 116 Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"
tier = "versioned-release"
unpinned = "checked against Ensembl release-116 CHECKSUMS (BSD sum, results/align/pins.txt); no sha256 manifest"

[[dataset]]
id = "Ensembl 116 GRCh38.116.gtf.gz (646,577 transcripts)"
tier = "versioned-release"
pins = "ref.sha256"

[[dataset]]
id = "HISAT2 --dta index GRCh38_116, built once on Graviton4 (task 00)"
tier = "built"
pins = "results/align/index.sha256"

[[dataset]]
id = "ERR188026.hisat2.bam (+ .bai, junctions.tsv, chrom.sizes), built once on Graviton4 (tasks 00, 01)"
tier = "built"
pins = "inputs.sha256"

# --- shared alignment and sort, Graviton4 only -------------------------------------------
[[run]]
instance = "m8g.4xlarge"
purpose = "primary"
results = "results/align/"
host = "results/align/host.txt"
date = "2026-10-20"
date_source = "run"
workers = 16
note = "hisat2-build 520 s at 6.2 GiB and alignment 133 s at 4.5 GiB, $0.156 billed: two walls in one task and no billed seconds printed, so no wall or $ fields"

[[run]]
instance = "r8g.2xlarge"
purpose = "primary"
results = "results/sort/"
threads_per_core = 1
date = "2026-10-20"
date_source = "run"
workers = 8
wall_s = 55
note = "sorting and junction extraction; $0.021 billed printed without billed seconds, so omitted"

