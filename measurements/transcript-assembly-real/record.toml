[[check]]
id = "input-pins"
claim = "reads / genome / GTF"
kind = "pin"
bound = "md5 / sum / sha256 == published pin"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "hisat2-pairs"
claim = "hisat2 pairs"
kind = "reference"
bound = "== ENA read_count"
observed = "15,800,127"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "bam-primary"
claim = "BAM primary records"
kind = "conservation"
bound = "== 2 × input pairs"
observed = "31,600,254"
outcome = "pass"
across_chips = "n/a"

[[check]]
id = "transcript-structure"
claim = "transcripts (de novo / guided)"
kind = "identity"
bound = "structure valid: span == exon span, exons sorted and disjoint, within chromosome, multi-exon stranded"
observed = "28,999 / 85,818, all valid"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "denovo-introns-read-spanned"
claim = "de novo introns spanned by no read"
kind = "identity"
bound = "0 (every intron is a CIGAR N in the BAM)"
observed = "0 of 116,972"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "tpm-fpkm-constant"
claim = "TPM vs cov, FPKM vs cov"
kind = "identity"
bound = "one constant per assembly, every transcript, within print rounding"
observed = "yes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "fpkm-cov-modes"
claim = "FPKM/cov, de novo vs guided"
kind = "invariance"
bound = "equal (it is a property of the BAM, not of the assembly)"
observed = "0.451816409387 vs …382 (1.2e-11)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "thread-invariance"
claim = "-p 8 vs -p 1"
kind = "invariance"
bound = "same transcripts, same cov/FPKM/TPM (ids and order set aside)"
observed = "identical, both modes"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "gffcompare-rows"
claim = "gffcompare tmap rows / query mRNAs / class-code sum"
kind = "conservation"
bound = "== transcripts"
observed = "28,999 / 85,818"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "gffcompare-introns"
claim = "gffcompare query introns / reference introns"
kind = "identity"
bound = "== independent count"
observed = "116,972 / 698,582"
outcome = "pass"
across_chips = "identical"

[[check]]
