observed = "identical on all three"
outcome = "pass"
across_chips = "identical"

[[trap]]
id = "transcript-assembly-stringtie-thread-order"
scope = "tool"
symptom = "the GTF's sha256 differs between -p 8 runs"
blames = "a non-deterministic assembly"
cause = "at -p 8 the record order and the STRG numbering follow which bundle finishes first"
fix = "compare StringTie outputs by content in canonical form (ids dropped, records sorted), never with diff"

[[trap]]
id = "transcript-assembly-tpm-not-1e6"
scope = "tool"
symptom = "TPMs don't sum to 1e6 (995,439.9 de novo)"
cause = "TPM = cov × 1e6 / C with C = 1,306,215, larger than the printed transcripts' total cov: the normaliser includes coverage not in the output"
fix = "assert the per-assembly constant, report the sum"

[[trap]]
id = "transcript-assembly-gffcompare-min-intron"
scope = "tool"
symptom = "an assembled transcript across OAZ1's or OAZ2's 1 bp frameshift gap is = to gffcompare but has no match under a naive intron chain"
blames = "gffcompare's counts"
cause = "gclib treats a gap of 4 bp or less as no intron (GFF_MIN_INTRON = 4, gff.h); Ensembl 116 has 57 such gaps"
fix = "apply gffcompare's own short-intron rule in the independent count"
