# measurements/gw-real/record.toml -- GW150914: PyCBC search of the GWOSC hour + Bilby PE vs GWTC-2.1.
# Three chips at r1, then seven Graviton4 diagnostic arms/probes for the quantile-test miss, and
# re-runs of arms 1-3 on the arms.py pin that added the seed override (results/reverify/).
# The 5-SE quantile test is asserted and fails on every chip (and every arm); left failing on
# purpose, so status derives as fail-reported. Dates are the git dates results/ landed.
# Diagnostic rows' "task time" in the README is the billed window; wall_s is phases.txt's.
# Schema 2: billed_s is spawn's completion-record window on every row (results/billed-windows.txt,
# equal to the README's figures to the second). Layout: 64 single-threaded multiprocessing workers
# serving one dynesty sampler (one BLAS thread each), recorded as ranks 1 x threads 1 x concurrent 64,
# obspy-real's convention for a process pool. The sampler arms are series on axis "size", with the
# varied sampler setting as size_key (nlive / naccept / maxmcmc are in workload.size): the schema has
# no sampler-setting axis, and a size axis is the only numeric one that is not the box. Their
# verdict "flat" is on the ANSWER (mean tail mass against the published 0.05), not on wall or $,
# which roughly double with the setting; verdict.on has no value for that, so it is left unset.
# Repeats carry attempt = the spawn task-id nonce; arm 4b (sampler seed 20261024) is recorded as a
# second attempt of the nlive=1000 configuration, which is how the README uses it (two seeds,
# run-to-run SD), so n = 2 there. phase_s.tool is phases.txt's (search + PE on the chip rows).
schema = 2
result_unit = "one event: GW150914 searched over the GWOSC hour and fully characterised (15-parameter PE with calibration)"

[workload]
size = { events = 1, nlive = 500, naccept = 60, maxmcmc = 5000, calibration_curves = 250 }
note = "PyCBC search over 4,096 s of H1 and L1 strain (946-template bank), then Bilby/dynesty PE: IMRPhenomXPHM, 15 BBH parameters, calibration marginalised over 250 response curves, acceptance-walk, 64 pool processes, seeded"

[timing]
wall = "chip rows: search + PE, each timed in run.sh (phases.txt search_wall_s + pe_wall_s); arm rows: arms.sh's whole wall (phases.txt wall_s)"
billed_basis = "spawn-task"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "layout", "size", "generation"]
equal_work = "none: the sampler is a path (check sampler-path), 20.46M likelihood calls on Graviton4 against 20.12M on x86 from the same seed; the data and likelihood are the same on every chip (noise-evidence identical)"
attribution = "same-version-other-build"
attribution_note = "x86 runs the gw env's locked linux-64 twin (envs-x86_64/gw-ab3a5857bd21), same versions; Intel's 64 vCPUs are 32 cores x 2 threads; Intel == AMD in every output (one build), so two independent sampler paths, not three"
note = "Graviton4 cheapest at $3.17 billed; AMD fastest (3,543 s billed) at $3.39; Intel $3.86"

[[series]]
id = "naccept"
axis = "parameter"
size_key = "naccept"
held = ["image", "instance", "workers", "layout", "data_path", "generation"]
equal_work = "none: an arm changes a sampler setting, so the work is not held; data, priors, likelihood and seed are r1's"
attribution = "same-binary"
verdict = { shape = "flat", through = 120, on = "answer" }
note = "flat on the answer: raising naccept 60 -> 120 changes nothing, because every walk is already capped at maxmcmc=5000 (20.53M calls against r1's 20.46M, same time; mean tail mass 0.0369, in the spread at r1's settings). The re-run on the new arms.py pin reproduced 20,534,663 calls and quantiles.tsv exactly"

[[series]]
id = "maxmcmc"
axis = "parameter"
size_key = "maxmcmc"
held = ["image", "instance", "workers", "layout", "data_path", "generation"]
equal_work = "none: an arm changes a sampler setting, so the work is not held (39.12M calls, 1.91x r1); data, priors, likelihood and seed are r1's"
attribution = "same-binary"
verdict = { shape = "flat", through = 10000, on = "answer" }
note = "flat on the answer: doubling the walk cap doubles the accepted steps per chain and the tails do not move (mean tail mass 0.0396, inside the 0.037-0.040 of the three runs at r1's settings, against the published 0.05). The re-run reproduced quantiles.tsv and walks.tsv exactly"

[[series]]
id = "nlive"
axis = "parameter"
size_key = "nlive"
held = ["image", "instance", "workers", "layout", "data_path", "generation"]
equal_work = "none: an arm changes a sampler setting, so the work is not held (40.06M and 39.51M calls); data, priors and likelihood are r1's"
attribution = "same-binary"
verdict = { shape = "flat", through = 1000, on = "answer" }
note = "flat on the answer, at the precision the runs give: two seeds at nlive=1000 give mean tail mass 0.0422 and 0.0400 (mean 0.0411) against 0.0385 for the three runs at r1's settings, a shift of 0.0026 +- 0.0015 (1.7 SE), not established, and 0.009 short of 0.05 either way. The tails are not shown to move under 2x chains or 2x nlive, over two seeds"

