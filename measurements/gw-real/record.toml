# measurements/gw-real/record.toml -- GW150914: PyCBC search of the GWOSC hour + Bilby PE vs GWTC-2.1.
# Three chips at r1, then seven Graviton4 diagnostic arms/probes for the quantile-test miss, and
# re-runs of arms 1-3 on the arms.py pin that added the seed override (results/reverify/).
# The 5-SE quantile test is asserted and fails on every chip (and every arm); left failing on
# purpose, so status derives as fail-reported. Dates are the git dates results/ landed.
# Diagnostic rows' "task time" in the README is the billed window; wall_s is phases.txt's.
schema = 1
result_unit = "one event: GW150914 searched over the GWOSC hour and fully characterised (15-parameter PE with calibration)"

[[dataset]]
id = "GWOSC O1 strain, event GW150914-v4: H-H1_LOSC_16_V1 / L-L1_LOSC_16_V1-1126256640-4096 (PE) and the _4_V1 4 kHz files (search)"
tier = "durable-id"
pins = "inputs.sha256"
note = "fetched on AWS by 00-fetch.task.json; L1 has 774,144 NaN samples outside science"

[[dataset]]
id = "GWTC-2.1 PE release v2, doi:10.5281/zenodo.6513631: IGWN-GWTC2p1-v2-GW150914_095045_PEDataRelease_mixed_nocosmo.h5, run C01:IMRPhenomXPHM"
tier = "durable-id"
pins = "inputs.sha256"
note = "the published posterior, config, PSDs and ln_noise_evidence; checked against Zenodo's md5 at fetch"

