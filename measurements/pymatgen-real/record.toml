# measurements/pymatgen-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is the EC2 window (launch to terminate; CloudTrail, results/billed-windows.txt).
# avg_cores is footprint.txt's avg_cores_whole_task (cgroup over the whole task).
schema = 2
result_unit = "the whole Materials Project 2025-09-25 release analysed: every phase diagram, symmetry and match"

[workload]
size = { materials = 210579, thermo_docs = 400163, phase_diagrams = 58315 }
note = "a multiprocessing.Pool of 16 single-threaded workers (OPENBLAS_NUM_THREADS=1); phase diagrams ~56% of the run"

[timing]
wall = "real.py, the whole release (tool wall)"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation", "layout"]
equal_work = "cross-chip"
attribution = "same-version-other-build"
attribution_note = "x86 runs the dft env's linux-64 twin (pymatgen 2026.8.30, spglib 2.7.0 on all chips); Intel's 16 vCPUs are 8 cores x 2 threads"

[[dataset]]
id = "RODA s3://materialsproject-build/collections/2025-09-25/{summary,thermo}/ (21 + 2,917 jsonl.gz, 1,040,234,151 bytes)"
tier = "roda"
pins = "inputs.sha256"
note = "the prefix alone does not pin the bytes (summary objects carry a 2025-12-17 modification time); the per-file sha256 manifest does"

[[run]]
id = "chip-c8g"
in = ["chip"]
instance = "c8g.4xlarge"
purpose = "primary"
results = "results/arm64/"
host = "results/arm64/host.txt"
date = "2026-10-19"
date_source = "run"
wall_s = 1499
billed_s = 1668
usd_hr = 0.6381
compute_usd = 0.266
billed_usd = 0.296
peak_gib = 5.5
peak_kind = "cgroup-memory.peak"
workers = 16
ranks = 1
threads_per_rank = 1
concurrent = 16
avg_cores = 15.24

[[run]]
id = "chip-c8i"
in = ["chip"]
instance = "c8i.4xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
host = "results/x86_64/host.txt"
date = "2026-10-19"
date_source = "run"
wall_s = 2005
billed_s = 2147
usd_hr = 0.7497
compute_usd = 0.418
billed_usd = 0.447
peak_gib = 10.1
peak_kind = "cgroup-memory.peak"
workers = 16
ranks = 1
threads_per_rank = 1
concurrent = 16
avg_cores = 15.14
note = "x86 installs the env into the container at start and the cgroup counts that page cache; the job itself needs ~5.5 GiB"

[[run]]
id = "chip-c8a"
in = ["chip"]
instance = "c8a.4xlarge"
purpose = "cross-chip"
results = "results/amd/"
host = "results/amd/host.txt"
date = "2026-10-19"
date_source = "run"
wall_s = 1070
billed_s = 1181
usd_hr = 0.8622
compute_usd = 0.256
billed_usd = 0.283
peak_gib = 10.0
peak_kind = "cgroup-memory.peak"
workers = 16
ranks = 1
threads_per_rank = 1
concurrent = 16
avg_cores = 14.93
note = "x86 installs the env into the container at start and the cgroup counts that page cache; the job itself needs ~5.5 GiB"

# checks: the README's "What held at scale, on all three chips" rows (observed = Graviton4; x86 the same)
[[check]]
id = "decode"
claim = "decode: `nsites`, reduced composition, volume vs MP"
kind = "reference"
bound = "exact; volume 1e-9 rel"
observed = "210,579 / 210,579, 2.1e-15"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "spacegroup-mp"
claim = "space group == MP's (spglib 2.7.0 here, 2.5/2.6 at MP)"
kind = "reference"
bound = "all"
observed = "**210,579 / 210,579**"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "spacegroup-rotation"
claim = "space group invariant under a rigid rotation"
kind = "invariance"
bound = "all"
observed = "210,579 / 210,579"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "matcher-rotated"
claim = "`StructureMatcher(primitive_cell=False)` fits its own rotated copy"
kind = "invariance"
bound = "all"
observed = "210,579 / 210,579"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "e-above-hull"
claim = "e_above_hull vs MP, both thermo types"
kind = "reference"
bound = "1e-9 eV/atom"
observed = "≤ 1.4e-12"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "formation-energy"
claim = "formation energy vs MP"
kind = "reference"
bound = "1e-9 eV/atom"
observed = "≤ 1.4e-14"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "decomp-products"
claim = "decomposition products (set) vs MP / amounts"
kind = "reference"
bound = "exact / 1e-9"
observed = "0 mismatches / ≤ 5.7e-14"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "decomp-enthalpy-exact"
claim = "decomposition enthalpy, exact path vs MP"
kind = "reference"
bound = "1e-9 eV/atom"
observed = "≤ 1.4e-12"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "decomp-enthalpy-slsqp"
claim = "decomposition enthalpy, SLSQP path vs MP"
kind = "reference"
bound = "1e-6 eV/atom"
observed = "≤ 3.5e-7 (`mp-27007`)"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "SLSQP decomposition enthalpies agree with Graviton4 to ≤ 5.7e-11 on Intel and AMD: the optimiser landing on the same minimum with different last bits"

[[check]]
id = "eq-reaction-energy"
claim = "equilibrium reaction energy (stable entries) vs MP"
kind = "reference"
bound = "1e-9 eV/atom"
observed = "≤ 4.3e-13"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "is-stable"
claim = "`is_stable` vs MP"
kind = "reference"
bound = "0 flips"
observed = "0 (+126 explained, below)"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "mu-shift-invariance"
claim = "**chemical-potential shift** (a per-element μ added to every energy) leaves e_above_hull and formation energy unchanged"
kind = "invariance"
bound = "1e-9"
observed = "≤ 4.6e-13"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "ehull-consistent"
claim = "an entry gets the same e_above_hull in every phase diagram that contains it"
kind = "identity"
bound = "1e-9"
observed = "≤ 1.4e-12"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "mass-balance"
claim = "decomposition mass balance; `E − Σ aᵢEᵢ == e_above_hull`"
kind = "conservation"
bound = "1e-9"
observed = "≤ 6.3e-14"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Hull numbers agree with Graviton4 to ≤ 9.1e-13 eV/atom on both Intel and AMD (the same worst case on both)"

[[check]]
id = "cross-chip"
claim = "**every per-material number vs Graviton4** (`collect.py`)"
kind = "reference"
bound = "1e-9; SLSQP 1e-6"
observed = "Intel and AMD ≤ 9.1e-13; SLSQP ≤ 5.7e-11"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "Intel and AMD ≤ 9.1e-13; SLSQP ≤ 5.7e-11"

# reported, not asserted
[[check]]
id = "spacegroup-site-order"
claim = "The space group depends on site order and origin at MP's tolerance"
kind = "reported"
observed = "permuting the sites changes it for 494 of 210,579 structures (371 higher, 123 lower), and shifting the origin changes it for 33"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "matcher-primitive-failures"
claim = "StructureMatcher at MP's settings fails to match 13 structures with their own rotated copy"
kind = "reported"
observed = "13 of 210,579; the full rotate + shift + permute + 1.1x volume copy fails 78"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "matcher-groups"
claim = "groups merged by StructureMatcher at MP's own builder settings (`results/matches.tsv`, identical on all chips)"
kind = "reported"
observed = "270 groups covering 541 distinct MP materials"
outcome = "reported"
across_chips = "identical"

[[trap]]
id = "pymatgen-mp-is-stable-flag"
scope = "data"
symptom = "126 R2SCAN materials: MP marks them `is_stable: false`, yet publishes `energy_above_hull: 0` and a *negative* decomposition enthalpy"
cause = "the flag contradicts MP's own values; all 126 have ids at or above `mp-3200000`"
fix = "assert 0 flips against MP's numbers and explain the 126 by name, rather than trusting the flag"

[[trap]]
id = "pymatgen-mp-15590-energy"
scope = "data"
symptom = "`mp-15590` (GGA_GGA+U): MP's published `energy_per_atom` is 1.12e-5 eV/atom off its own entry's corrected energy"
cause = "the only doc of the 400,163 that is inconsistent this way"
fix = "e_above_hull and formation energy differ from MP's by exactly that discrepancy (residual 1.3e-16); explain it, do not widen the bound"

[[trap]]
id = "pymatgen-x86-env-page-cache"
scope = "platform"
symptom = "peak memory 10.1 / 10.0 GiB on x86 against 5.5 GiB on Graviton4"
cause = "On x86 the env is installed into the container at start, and the cgroup counts that page cache"
fix = "size from the job's own ~5.5 GiB; any 16-vCPU `c` box fits it"

[[cross_code]]
with = "published:materials-project-2025-09-25-thermo"
same_bytes = true
metric = "e_above_hull, formation energy, decomposition and stability per material vs MP's published thermo docs"
tolerance_basis = "1e-9 eV/atom for exact facet distances; 1e-6 for the SLSQP path, an optimiser's convergence (ftol 1e-8) on an objective of order 10 eV/atom"
check = "e-above-hull"
