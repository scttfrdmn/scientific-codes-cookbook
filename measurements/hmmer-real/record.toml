# measurements/hmmer-real/record.toml -- Graviton generation ladder + same-generation Intel/AMD.
# Schema 2: the x86 rows' billed is the spawn window; the Graviton rows' printed billed matches no
# surviving completion record or CloudTrail window (results/billed-windows.txt), so it is unattributed.
schema = 2
result_unit = "one proteome annotated: all 30,134 Pfam-A 38.2 families against 23,879 human proteins at --cut_ga"

[workload]
size = { families = 30134, sequences = 23879 }
note = "one hmmsearch --cut_ga --cpu 8 of the whole Pfam-A library against one protein per gene of the Ensembl 116 human proteome"

[timing]
wall = "hmmsearch, timed in search.sh (wall_s in smoke-check-*.txt)"
billed_basis = "spawn-task"

[[series]]
id = "gen"
axis = "generation"
held = ["image", "input", "workers", "size"]
equal_work = "tblout-hits"
attribution = "same-binary"
verdict = { shape = "monotonic", through = 9, on = "wall" }
note = "per-step speedup 1.43x, 1.06x, 1.26x; the weak Gv3 -> Gv4 step makes Graviton4 4% dearer per result on compute (6% billed) than Graviton3; why the step is weak is not established"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "size", "generation"]
equal_work = "tblout-hits"
attribution = "same-version-other-build"
attribution_note = "x86 rows run bioconda's x86 build of HMMER 3.4 (quay.io/biocontainers); SIMD filters are NEON vs SSE/AVX; c8i's 8 vCPUs are 4 cores x 2 threads, c8a's 8 full cores; the x86 legs ran 20 days later on spawn 0.139.1"

[[dataset]]
id = "Pfam releases/Pfam38.2/Pfam-A.hmm.gz"
tier = "versioned-release"
pins = "datasets.sha256"
from_recipe = "hmmer"
note = "inputs/hmmer/; search.sh checks this same sha256 in-task, so the runs read these bytes; re-hashed 2026-10-25 on AWS and unchanged"

[[dataset]]
id = "Ensembl release-116 human pep.all, filtered to one protein per gene"
tier = "versioned-release"
pins = "datasets.sha256"
from_recipe = "hmmer"
note = "inputs/hmmer/; search.sh checks this same sha256 in-task, so the runs read these bytes; re-hashed 2026-10-25 on AWS and unchanged"

