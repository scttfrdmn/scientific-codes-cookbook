# measurements/hmmer-real/record.toml -- Graviton generation ladder + same-generation Intel/AMD.
schema = 1
result_unit = "one proteome annotated: all 30,134 Pfam-A 38.2 families against 23,879 human proteins at --cut_ga"

[[dataset]]
id = "Pfam releases/Pfam38.2/Pfam-A.hmm.gz"
tier = "versioned-release"
from_recipe = "hmmer"
unpinned = "no sha256 manifest committed; recipes/hmmer prints a truncated sha256 in prose"

[[dataset]]
id = "Ensembl release-116 human pep.all, filtered to one protein per gene"
tier = "versioned-release"
from_recipe = "hmmer"
unpinned = "no sha256 manifest committed; recipes/hmmer prints a truncated sha256 in prose"

