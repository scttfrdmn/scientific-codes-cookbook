# --- checks: the in-task asserts in results/smoke-check-*.txt; cross-chip.txt ---------------
[[check]]
id = "models-searched"
claim = "models_searched (every family in Pfam-A 38.2)"
kind = "identity"
bound = "exactly 30134"
observed = "30134"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "target-sequences"
claim = "target_sequences (one protein per gene)"
kind = "identity"
bound = "exactly 23879"
observed = "23879"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "ok-trailer"
claim = "hmmsearch_trailer [ok] (completion sentinel)"
kind = "sentinel"
bound = "exactly [ok]"
observed = "[ok]"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "tblout-hits"
claim = "tblout_hits"
kind = "identity"
bound = "exactly 65607"
observed = "65607"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "both x86 chips return the same 65,607 (protein, family) pairs as Graviton4 (cross-chip.txt: same (protein, family) set True)"

[[check]]
id = "families-with-hit"
claim = "families_with_hit"
kind = "identity"
bound = "exactly 9473"
observed = "9473"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "proteins-with-hit"
claim = "proteins_with_hit (95.23% of genes carry >=1 Pfam domain)"
kind = "identity"
bound = "exactly 22740"
observed = "22740"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "tblout-scores"
claim = "tblout below the hit set: E-values, scores, domain counts, row order (cross-chip.txt)"
kind = "reported"
observed = "full E-value differs on 54, full score on 16 (max |d| 0.2 bits), domain-count columns on 2"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "arm64 tblout body sha256 4c374e47711eb9da vs x86_64 and amd a175982561685b76; NEON vs SSE/AVX filters; Intel and AMD agree byte for byte"

[[trap]]
id = "hmmer-price-api-throttle"
scope = "platform"
symptom = "eight concurrent spawn task run calls throttled the AWS Price List API, and spawn refused to launch"
cause = "truffle's static fallback price table has no Graviton coverage, so spawn cannot enforce the cost cap and correctly refuses rather than drop it"
fix = "launch the rungs serially"
refs = ["truffle#175"]

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "0.139.1's wrapper leaves under 1 KB of the 16 KiB user data; the script is staged as search.sh (pinned in pins.sha256)"

[[upstream]]
ref = "truffle#175"
role = "filed"
