# --- checks: in-task smoke asserts in results/smoke-*.txt, then the README's comparisons
[[check]]
id = "sample"
claim = "sample name NA12878"
kind = "identity"
bound = "want NA12878"
observed = "NA12878"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "off-chr20"
claim = "zero off-chr20 records"
kind = "identity"
bound = "want 0"
observed = "0"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "variant-count"
claim = "385,371 variants on all four chips"
kind = "reported"
observed = "385,371"
outcome = "reported"
across_chips = "identical"
across_chips_evidence = "385,371 on c6g, c7g, c8g, c9g, c8i and c8a"

[[check]]
id = "qual30-records"
claim = "every record above `QUAL≥30` — the same 113,841 sites, alleles and genotypes on all three"
kind = "reported"
observed = "113,841"
outcome = "reported"
across_chips = "identical"

[[check]]
id = "low-qual-tail"
claim = "What differs, ARM build against x86 build: 4 of 385,371 records spell a homopolymer indel's alleles differently at the same position, and 3 more call a different genotype; all 7 have `QUAL` < 28"
kind = "reported"
observed = "7 of 385,371 records"
outcome = "reported"
across_chips = "path"
across_chips_evidence = "4 allele spellings + 3 genotypes differ ARM vs x86, all QUAL < 28; other QUAL values agree except in the last printed digit (one record at 74.5) or below 1e-7"

[[check]]
id = "intel-vs-amd-qual"
claim = "Intel against AMD: same sites, alleles, genotypes, INFO and sample columns on every record; `QUAL` differs on 1,184 records, all below 1e-10"
kind = "reported"
observed = "largest difference 4.8e-16"
outcome = "reported"

[[check]]
id = "self-reproduce"
claim = "Each chip reproduces itself: the VCF body is byte-identical to the recipe's own earlier run on the same chip"
kind = "reported"
observed = "byte-identical"
outcome = "reported"

[[upstream]]
ref = "truffle#175"
role = "workaround"
note = "the static price fallback has no Graviton coverage; rungs launched serially"

[[upstream]]
ref = "spawn#1063"
role = "workaround"
note = "x86 legs exceed EC2's 16 KiB user data; inline command moved into a staged sha256-checked file"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "same user-data limit"
