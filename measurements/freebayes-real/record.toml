# measurements/freebayes-real/record.toml
schema = 1
result_unit = "one whole-chr20 call: freebayes on NA12878 chr20 at 36x against GRCh38 chr20"

[[dataset]]
id = "NA12878.chr20.30x.bam + chr20 of GRCh38 (staged by make stage RECIPE=freebayes)"
tier = "built"
pins = "../gatk4-real/pins.sha256"
from_recipe = "freebayes"
note = "the ladder's tasks read inputs/gatk4/NA12878.chr20.30x.bam (36.3x despite the name) but did not re-check its sha256; the 385,371 variants match the recipe's run"

# --- Graviton generation ladder: 4 vCPU, same digest, same staged objects -------------
[[run]]
instance = "c6g.xlarge"
purpose = "generation-sweep"
results = "results/smoke-c6g.txt"
date = "2026-10-03"
date_source = "git"
workers = 1                     # freebayes is single-threaded
wall_s = 1349
billed_s = 1456
usd_hr = 0.136
compute_usd = 0.051
billed_usd = 0.055

[[run]]
instance = "c7g.xlarge"
purpose = "generation-sweep"
results = "results/smoke-c7g.txt"
date = "2026-10-03"
date_source = "git"
workers = 1
wall_s = 851
billed_s = 926
usd_hr = 0.145
compute_usd = 0.0343
billed_usd = 0.0373

[[run]]
instance = "c8g.xlarge"
purpose = "primary"
results = "results/smoke-c8g.txt"
date = "2026-10-03"
date_source = "git"
workers = 1
threads_per_core = 1            # README: Graviton4 is 1 thread per core (lscpu)
wall_s = 644
billed_s = 704
usd_hr = 0.1595
compute_usd = 0.0285
billed_usd = 0.0312
note = "the recipe's own verified calling task (cookbook-freebayes-chr20) is this rung"

[[run]]
instance = "c9g.xlarge"
purpose = "generation-sweep"
results = "results/smoke-c9g.txt"
