# measurements/scipy-stack-real/record.toml -- drafted by the #118 extraction, then authored.
# Schema 2: billed is "launch to terminate as EC2 reports it" = CloudTrail RunInstances ->
# TerminateInstances, to within 1 s (results/billed-windows.txt). avg_cores is cgroup cpu.stat over
# the workload window (size-*.txt).
schema = 2
result_unit = "one full pass over GHCN-Daily 2024: pandas aggregation, NumPy cross-check, SciPy 0.25-degree gridding"

[workload]
size = { rows = 38470120, stations = 44882, unknowns = 1036800 }
note = "one in-memory pandas pass (pyarrow CSV parse, groupbys, merge, resample), a NumPy cross-check, then a 0.25-degree SciPy gridding solve (SuperLU and Jacobi-CG); mostly single-threaded"

[timing]
wall = "the python3 ghcn_workload.py call, timed in-task (size-*.txt workload_wall_s)"
billed_basis = "ec2"

[[series]]
id = "chip"
axis = "chip"
held = ["input", "workers", "layout", "size", "generation"]
equal_work = "integer-digests"
attribution = "same-version-other-build"
attribution_note = "aarch.science geo-ml image on Graviton4, its geo-ml-d3f7ea36e8bf linux-64 twin on x86 (same versions); the bill is set by image pull vs offline env install, not the work; the AMD leg ran under spawn 0.139.1, which installs Docker during stage-in, so its overhead is not comparable"

[[dataset]]
id = "NOAA GHCN-Daily 3.35-upd-2026101517: s3://noaa-ghcn-pds/csv/by_year/2024.csv + ghcnd-stations.txt"
tier = "roda"
pins = "pins.sha256"
note = "copied from stage-inputs.sh's data.sha256 heredoc; NOAA rewrites the by-year file daily, so a re-stage after its next update fails its own check"

[[run]]
id = "chip-m8g"
in = ["chip"]
instance = "m8g.2xlarge"
purpose = "primary"
results = "results/result-m8g.txt"
date = "2026-10-17"
date_source = "git"
workers = 8
wall_s = 72
billed_s = 226
usd_hr = 0.359
compute_usd = 0.0072
billed_usd = 0.0225
peak_gib = 11.3
peak_kind = "rss"
ranks = 1
threads_per_rank = 8
avg_cores = 2.76

[[run]]
id = "chip-m8i"
in = ["chip"]
instance = "m8i.2xlarge"
purpose = "cross-chip"
results = "results/x86_64/"
date = "2026-10-17"
date_source = "git"
workers = 8
threads_per_core = 2
wall_s = 70
billed_s = 167
usd_hr = 0.4234
compute_usd = 0.0082
billed_usd = 0.0196
peak_gib = 11.2
peak_kind = "rss"
ranks = 1
threads_per_rank = 8
avg_cores = 1.9
note = "geo-ml-d3f7ea36e8bf linux-64 twin; 4 cores x 2"

[[run]]
id = "chip-m8a"
in = ["chip"]
instance = "m8a.2xlarge"
purpose = "cross-chip"
results = "results/amd/"
spawn_version = "0.139.1"
date = "2026-10-20"
date_source = "git"
workers = 8
threads_per_core = 1
wall_s = 46
billed_s = 160
usd_hr = 0.4869
compute_usd = 0.0062
billed_usd = 0.0216
peak_gib = 11.2
peak_kind = "rss"
ranks = 1
threads_per_rank = 8
avg_cores = 1.77
note = "spawn 0.139.1 installs Docker during stage-in, so overhead is not comparable with the other rows; staged a sha256-checked task.sh (spawn#1246)"

[[run]]
id = "probe-r8g"
instance = "r8g.2xlarge"
purpose = "diagnostic"
results = "results/result-r8g.txt"
date = "2026-10-17"
date_source = "git"
workers = 8
wall_s = 65
billed_s = 228
usd_hr = 0.4713
compute_usd = 0.0085
billed_usd = 0.0299
peak_gib = 11.3
peak_kind = "rss"
ranks = 1
threads_per_rank = 8
avg_cores = 2.72
note = "sizing probe; 64 GiB measured 11.3 GiB peak and 2.7 average cores busy, so the real runs went to m8g/m8i"

# --- checks: "What held at scale, on all three chips" (AMD identical to Intel in every value)
[[check]]
id = "rows-parsed"
claim = "rows parsed == newline count of the file"
kind = "identity"
observed = "38,470,120"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "no-duplicates"
claim = "one value per (station, date, element)"
kind = "identity"
observed = "0 duplicates"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "qc-partition"
claim = "QC kept + flagged == all, and their value sums partition the total"
kind = "conservation"
observed = "38,433,260 + 36,860"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "groupby-conservation"
claim = "sum of group sums == column sum; group counts == rows (station × element, month × element, country after merge)"
kind = "conservation"
bound = "int64 exact"
observed = "202,591 / 74·12 / 195 groups"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "numpy-route"
claim = "NumPy factorize + `add.reduceat` == pandas groupby, every group"
kind = "cross-code"
observed = "202,591 groups equal"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "merge-cardinality"
claim = "left m:1 merge keeps every row; matched == independent `isin`; inner == matched"
kind = "conservation"
observed = "38,470,120, 0 unmatched"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "resample-conservation"
claim = "monthly resample sums and counts == TMAX totals"
kind = "conservation"
observed = "156,636 station-months"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "lu-vs-cg"
claim = "`|x_lu − x_cg|/|x_lu| ≤ κ₂ |A(x_lu − x_cg)|/|A x_lu|`"
kind = "identity"
bound = "κ₂ ≤ 17,001 (a bound, not an estimate)"
observed = "2.146e-09 ≤ 1.694e-06"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "forward-error"
claim = "forward error on a known solution ≤ κ₂ × relative residual"
kind = "identity"
bound = "κ₂ ≤ 17,001"
observed = "1.265e-13 ≤ 4.768e-11"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "1.265e-13 ≤ 4.768e-11 (arm64) vs 1.238e-13 ≤ 4.738e-11 (Intel and AMD)"

[[check]]
id = "gridding-conserves-total"
claim = "`|Σb − Σw x| ≤ √n ‖r‖` (1ᵀL = 0: the gridding conserves the total)"
kind = "conservation"
bound = "√n ‖r‖"
observed = "1.48e-10 ≤ 6.60e-09"
outcome = "pass"
across_chips = "fixed-point"
across_chips_evidence = "1.48e-10 ≤ 6.60e-09 (arm64) vs 1.25e-10 ≤ 6.48e-09 (Intel and AMD)"

[[check]]
id = "cg-converges"
claim = "CG reaches rtol 1e-10"
kind = "sentinel"
bound = "rtol 1e-10"
observed = "892 iterations, 9.964e-11"
outcome = "pass"
across_chips = "identical"

# --- "What differed across chips"
[[check]]
id = "integer-digests"
claim = "The four integer result tables (station × element, month × element, country, station-month) hash to the **same sha256 on all four runs**"
kind = "identity"
bound = "same sha256"
observed = "same sha256 on all four runs"
outcome = "pass"
across_chips = "identical"

[[check]]
id = "grid-bits"
claim = "The solved grid differs in its last bits"
kind = "reported"
observed = "1,008,216 of 1,036,800 cells, max 1.2e-13 °C, relative 2.9e-15"
outcome = "reported"
across_chips = "fixed-point"
across_chips_evidence = "max 1.2e-13 °C, relative 2.9e-15, the order of the solver's own residual (2.75e-15 vs 2.70e-15); two Graviton4 runs bit-identical; Intel == AMD, 0 of 1,036,800 cells differ; station-cell mean 16.682887 °C agrees"

[[upstream]]
ref = "spawn#1246"
role = "workaround"
note = "AMD leg staged the resolved command as a sha256-checked task.sh: spawn 0.139.1's wrapper leaves too little of EC2's 16 KiB user data"
