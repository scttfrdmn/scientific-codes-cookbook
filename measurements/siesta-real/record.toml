[[trap]]
id = "siesta-openmpi5-oversubscribe"
scope = "tool"
symptom = "Open MPI 5 refused 16 ranks on Intel's 8 cores"
cause = "Open MPI 5 counts slots by physical core and ignores the environment variable the recipe sets (OMPI_MCA_rmaps_base_oversubscribe)"
fix = "mpiexec --bind-to none --map-by :OVERSUBSCRIBE"
cost = "two x86 launches stopped in their first minutes"
