# measurements/proteomics-real/record.toml -- drafted by the #118 extraction, then authored.
# Two tasks per chip (search, rescore): each run row is one task, and its $ is that task's share of
# the result. README's per-experiment figures are the two rows summed (Graviton4 $0.0346 / $0.0624).
# Schema 2: the two tasks of a chip share attempt "r1" (the per-experiment total is derived from them).
# Billed is the EC2 window (CloudTrail, results/billed-windows.txt), as the README says.
schema = 2
result_unit = "the whole six-run PXD083239 experiment, searched and rescored"

[workload]
size = { runs = 6, spectra = 582823, psms = 538544, fasta_entries = 26836 }
note = "two tasks, one tool each, S3 between them: an 8-thread OpenMS search of all six runs, then Percolator on the six PINs; staging (tmpfs), not RSS, sizes the search box"

[timing]
wall = "tool wall: SimpleSearchEngine summed over six runs, or six seed-1 Percolator trainings (the task script, with every check, is in each row's note)"
billed_basis = "ec2"

[[series]]
id = "search-chip"
axis = "chip"
held = ["input", "workers", "layout", "size"]
equal_work = "psm-accounting"
attribution = "same-version-other-build"
attribution_note = "openms 3.5.0: aarch.bio arm64 vs its bioconda x86 twin (BusyBox userland, which slows the non-search part of the task); 8i vCPUs are SMT threads, 8a and Graviton4 vCPUs whole cores"

[[series]]
id = "rescore-chip"
axis = "chip"
held = ["input", "size"]
equal_work = "percolator-in-out"
attribution = "same-version-other-build"
attribution_note = "percolator 3.09.0: aarch.bio arm64 vs its bioconda x86 twin; the large box is 2 cores on AMD and 1 core with SMT on Intel"

[[dataset]]
id = "PRIDE PXD083239 (CC0): 6 mzML, 6 .pdResult, SwissProt_Human_01062026.fasta"
tier = "durable-id"
pins = "source.sha256"
note = "PRIDE publishes no checksums for this project; source.sha256 is the sha256 of what PRIDE served, re-checked at stage-in"

[[dataset]]
id = "ref/ref_<run>.tsv: the submitters' q <= 0.01 target PSMs as (mzML spectrum, peptide), plus target.fasta and the staged mzML names"
tier = "built"
pins = "derived.sha256"
note = "built by stage.py from the .pdResult files, joined to the mzML by PD's own retention time (all 168,552 land on exactly one spectrum)"

