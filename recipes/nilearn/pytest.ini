# Nilearn 0.14.1's own pytest settings -- [tool.pytest.ini_options] in its pyproject.toml at the
# 0.14.1 tag, transcribed to ini syntax. Two lines are dropped: `addopts` (it points at an HTML
# report template that ships only in the git repo, and adds -v/--showlocals, which are output
# only) and `testpaths` (the suite runs against the INSTALLED package with --pyargs).
# xfail_strict and the registered markers are kept: they change outcomes.
[pytest]
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
filterwarnings =
    ignore:.*you are using the.*:UserWarning
junit_family = xunit2
log_cli_level = INFO
log_level = INFO
markers =
    slow
    single_process
    thread_unsafe
    ai_generated
    engines
    mpl_image_compare
minversion = 6.0
xfail_strict = true
