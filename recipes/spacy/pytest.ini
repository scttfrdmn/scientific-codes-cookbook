# spaCy 3.8.16's own pytest settings -- [tool:pytest] in setup.cfg at the release-v3.8.16 tag,
# transcribed to ini syntax. Upstream CI runs `pytest --pyargs spacy` from the repo root, where
# setup.cfg is the rootdir config; this file plays that role in /tmp. Nothing is dropped:
# `filterwarnings = error` turns any warning into a failure, and the markers are registered.
[pytest]
markers =
    slow: mark a test as slow
    issue: reference specific issue
filterwarnings =
    error
    ignore:Core Pydantic V1:UserWarning:pydantic
