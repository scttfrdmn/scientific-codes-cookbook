name: check

# Runs `make check` — page frontmatter, markdown-a11y, and internal-link resolution
# (scripts/check_pages.py, stdlib only). This is the gate for branch protection on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
