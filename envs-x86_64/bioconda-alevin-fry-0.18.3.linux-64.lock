# arm64 libgcc 16.2.0 h205dda4_7 -> linux-64 16.2.0 ha9f2e26_7
# arm64 libgomp 16.2.0 h8acb6b2_7 -> linux-64 16.2.0 he0feb66_7
# arm64 libstdcxx 16.2.0 hef695bb_7 -> linux-64 16.2.0 h934c35e_7
