# x86_64 twin of the aarch.bio image quay.io/aarchbio/alevin-fry@sha256:1c5b8393d66e... (bioconda alevin-fry=0.18.3), for measurements/single-cell-real
# quay.io/biocontainers had no alevin-fry 0.18.3 image on 2026-10-24 (newest 0.18.2), so the x86 route
#   installs bioconda's own linux-64 build offline from this lock (the aarch.science twin mechanism)
# solved for linux-64 (conda-forge + bioconda), every package pinned to the arm64 image's version AND build number,
#   read from that image's /opt/conda/conda-meta
# 5 packages; 5 of 5 arm64 versions identical, 5 of 5 build numbers identical
# arm64 _openmp_mutex 4.5 20_gnu -> linux-64 4.5 20_gnu
