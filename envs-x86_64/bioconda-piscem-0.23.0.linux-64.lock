# x86_64 twin of the aarch.bio image quay.io/aarchbio/piscem@sha256:40c8a261dc5d... (bioconda piscem=0.23.0), for measurements/single-cell-real
# quay.io/biocontainers had no alevin-fry 0.18.3 image on 2026-10-24 (newest 0.18.2), so the x86 route installs
#   bioconda's own linux-64 builds offline from committed locks (the aarch.science twin mechanism); piscem takes the
#   same route so both tasks run the arm64 image's exact package set
# solved for linux-64 (conda-forge + bioconda), every package pinned to the arm64 image's version AND build number,
#   read from that image's /opt/conda/conda-meta
# 7 packages; 7 of 7 arm64 versions identical, 7 of 7 build numbers identical
# arm64 _openmp_mutex 4.5 20_gnu -> linux-64 4.5 20_gnu
# arm64 bzip2 1.0.8 h4777abc_10 -> linux-64 1.0.8 hda65f42_10
# arm64 libgcc 16.2.0 h205dda4_5 -> linux-64 16.2.0 ha9f2e26_5
# arm64 libgomp 16.2.0 h8acb6b2_5 -> linux-64 16.2.0 he0feb66_5
# arm64 libjemalloc 5.3.1 hfae3067_0 -> linux-64 5.3.1 hecca717_0
# arm64 libstdcxx 16.2.0 hef695bb_5 -> linux-64 16.2.0 h934c35e_5
